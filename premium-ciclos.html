<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Ciclos de Maturidade</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; }
        body { 
            margin: 0; font-family: 'Cormorant Garamond', serif; 
            background-color: var(--bg-dark);
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            color: #e0e0e0; font-size: 19px; line-height: 1.8; 
        }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { font-size: 4em; color: var(--gold); animation: spin 3s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px 100px 20px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 40px; }
        .btn-back { cursor: pointer; color: var(--gold); font-family: 'Cinzel'; text-transform: uppercase; font-size: 0.8em; letter-spacing: 2px; text-decoration: none; }

        .page-header { text-align: center; margin-bottom: 60px; }
        .page-title { font-family: 'Cinzel'; color: var(--gold); font-size: 3em; margin: 0; text-shadow: 0 0 20px rgba(212,175,55,0.4); }
        .subtitle { color: #888; font-style: italic; margin-top: 10px; }

        /* TIMELINE VISUAL */
        .timeline-container { position: relative; margin: 60px 0; padding: 20px 0; }
        .timeline-line { position: absolute; left: 50%; width: 2px; height: 100%; background: linear-gradient(to bottom, transparent, var(--gold), transparent); transform: translateX(-50%); }
        
        .cycle-card { 
            position: relative; width: 45%; padding: 30px; 
            background: rgba(15, 15, 15, 0.95); border: 1px solid #333; 
            border-radius: 8px; margin-bottom: 40px; transition: 0.4s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .cycle-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .cycle-card.left { float: left; text-align: right; border-right: 4px solid var(--gold); }
        .cycle-card.right { float: right; text-align: left; border-left: 4px solid var(--gold); }
        .cycle-card::after { content: ''; position: absolute; top: 30px; width: 20px; height: 20px; background: var(--gold); border-radius: 50%; box-shadow: 0 0 15px var(--gold); }
        .cycle-card.left::after { right: -62px; }
        .cycle-card.right::after { left: -62px; }

        .cycle-age { font-family: 'Cinzel'; color: var(--gold); font-size: 1.5em; display: block; }
        .cycle-title { font-family: 'Cinzel'; color: #fff; font-size: 1.2em; margin: 5px 0 15px 0; letter-spacing: 1px; }
        .cycle-desc { color: #aaa; font-size: 0.95em; text-align: justify; }

        .clearfix::after { content: ""; clear: both; display: table; }

        /* STATUS ATUAL */
        .status-box { 
            background: radial-gradient(circle, #1a1a1a, #050505); 
            border: 2px solid var(--gold); padding: 40px; text-align: center; 
            border-radius: 10px; margin-bottom: 60px; 
        }
        .current-age-label { font-family: 'Cinzel'; color: var(--gold); letter-spacing: 3px; }
        .current-age-val { font-size: 4em; font-family: 'Cinzel'; color: #fff; margin: 10px 0; }

        @media(max-width: 800px) {
            .timeline-line { left: 20px; }
            .cycle-card { width: 85%; float: right !important; text-align: left !important; border-left: 4px solid var(--gold) !important; border-right: none !important; }
            .cycle-card.left::after, .cycle-card.right::after { left: -39px; }
        }
    </style>
</head>
<body>

<div id="loading-screen">
    <i class="fas fa-hourglass-half spinner"></i>
    <p style="color:#666; font-family:'Cinzel'; margin-top:15px; letter-spacing:2px;">Calculando Ciclos Temporais...</p>
</div>

<div class="container">
    <nav class="nav-bar">
        <a href="dashboard-premium.html" class="btn-back">← Retornar ao Hub</a>
        <div style="font-family:'Cinzel'; color:#444;">ARQUÉTIPOS E MATURIDADE</div>
    </nav>

    <header class="page-header">
        <h1 class="page-title">CICLOS DE MATURIDADE</h1>
        <p class="subtitle">A decodificação das grandes crises e renascimentos da sua jornada.</p>
    </header>

    <div class="status-box">
        <div class="current-age-label">Sua Idade Atual</div>
        <div class="current-age-val" id="display-age">--</div>
        <p id="current-phase-text" style="color:#888;">Identificando sua fase evolutiva...</p>
    </div>

    <div class="timeline-container clearfix">
        <div class="timeline-line"></div>
        <div id="cycles-list">
            </div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    try { firebase.initializeApp(firebaseConfig); } catch(e) {}
    const auth = firebase.auth();
    const db = firebase.firestore();

    const CICLOS_DB = [
        { age: 7, title: "A Primeira Quadratura de Saturno", side: "left", desc: "A primeira crise de autoridade. O fim da infância mágica e o início da compreensão das regras do mundo." },
        { age: 14, title: "Oposição de Saturno", side: "right", desc: "A crise da adolescência. O choque entre quem você está se tornando e as estruturas familiares impostas." },
        { age: 21, title: "Segunda Quadratura de Saturno", side: "left", desc: "O nascimento da autonomia. O momento de testar suas próprias estruturas no mundo real." },
        { age: 29, title: "O Retorno de Saturno", side: "right", desc: "A Grande Travessia. O fim da juventude e o início da maturidade real. Seus alicerces são testados pelo Senhor do Tempo." },
        { age: 37, title: "A Quadratura de Netuno", side: "left", desc: "O Despertar Espiritual. Período de desilusão com o materialismo e busca por significados mais profundos da alma." },
        { age: 42, title: "Oposição de Urano", side: "right", desc: "A Crise da Meia-Idade. O desejo visceral de liberdade. Você questiona tudo o que construiu e busca sua verdade mais crua." },
        { age: 50, title: "O Retorno de Quíron", side: "left", desc: "A Cura do Curador. O momento de integrar sua ferida mais profunda e transformá-la em sabedoria para os outros." },
        { age: 58, title: "O Segundo Retorno de Saturno", side: "right", desc: "A Colheita do Legado. Um novo nível de autoridade e sabedoria. O momento de decidir como quer ser lembrado." },
        { age: 84, title: "O Retorno de Urano", side: "left", desc: "A Libertação Final. A integração total da jornada e o desapego das formas mundanas em prol do espírito puro." }
    ];

    auth.onAuthStateChanged(user => {
        if(user) {
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                if(doc.exists) {
                    const d = doc.data();
                    if((d.status || "").toLowerCase() === "premium" || (d.plano || "").toLowerCase() === "premium"){
                        processarCiclos(d);
                    } else { window.location.href = "dashboard.html"; }
                }
            });
        } else { window.location.href = "index.html"; }
    });

    function calcularIdade(dataNasc) {
        const nasc = new Date(dataNasc);
        const hoje = new Date();
        let idade = hoje.getFullYear() - nasc.getFullYear();
        const m = hoje.getMonth() - nasc.getMonth();
        if (m < 0 || (m === 0 && hoje.getDate() < nasc.getDate())) idade--;
        return idade;
    }

    function processarCiclos(usuario) {
        const idade = calcularIdade(usuario.dataNascimento || usuario.nascimento);
        document.getElementById('display-age').innerText = idade;

        const listArea = document.getElementById('cycles-list');
        listArea.innerHTML = "";

        let faseAtualEncontrada = false;

        CICLOS_DB.forEach(ciclo => {
            const isPassed = idade > ciclo.age;
            const isNear = Math.abs(idade - ciclo.age) <= 2;
            
            let statusBadge = "";
            if(isNear) {
                statusBadge = "<span style='color:var(--gold); font-size:0.7em; display:block;'>VOCÊ ESTÁ NESTA FASE</span>";
                document.getElementById('current-phase-text').innerHTML = `Sua alma está processando as energias de: <br><strong style='color:#fff'>${ciclo.title}</strong>`;
                faseAtualEncontrada = true;
            } else if (isPassed) {
                statusBadge = "<span style='color:#444; font-size:0.7em; display:block;'>CICLO CONCLUÍDO</span>";
            } else {
                statusBadge = "<span style='color:#0088ff; font-size:0.7em; display:block;'>FUTURO PRÓXIMO</span>";
            }

            listArea.innerHTML += `
                <div class="cycle-card ${ciclo.side}" style="${isNear ? 'border-color:var(--gold); box-shadow: 0 0 30px rgba(212,175,55,0.2);' : ''} ${isPassed ? 'opacity:0.6;' : ''}">
                    ${statusBadge}
                    <span class="cycle-age">${ciclo.age} Anos</span>
                    <h3 class="cycle-title">${ciclo.title}</h3>
                    <p class="cycle-desc">${ciclo.desc}</p>
                </div>
            `;
        });

        if(!faseAtualEncontrada) {
            document.getElementById('current-phase-text').innerText = "Você está em um período de estabilidade e integração entre grandes ciclos.";
        }

        document.getElementById('loading-screen').style.display = 'none';
    }
</script>
</body>
</html>
