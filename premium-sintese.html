<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | IA Regente - Síntese Sistêmica</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; --red: #8a1c1c; }
        body { 
            margin: 0; font-family: 'Cormorant Garamond', serif; 
            background-color: var(--bg-dark);
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            color: #e0e0e0; font-size: 19px; line-height: 1.8; overflow-x: hidden;
        }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1s; }
        .spinner { font-size: 5em; color: var(--gold); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }

        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px 100px 20px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 40px; }
        .btn-back { cursor: pointer; color: var(--gold); font-family: 'Cinzel'; text-transform: uppercase; font-size: 0.8em; letter-spacing: 2px; text-decoration: none; }

        /* HEADER MASTER */
        .master-header { text-align: center; margin-bottom: 60px; }
        .master-title { font-family: 'Cinzel'; color: var(--gold); font-size: 3.5em; margin: 0; text-shadow: 0 0 30px rgba(212,175,55,0.4); }
        .master-subtitle { color: #888; font-family: 'Cinzel'; letter-spacing: 4px; font-size: 0.9em; margin-top: 10px; }

        /* PAINEL DA SÍNTESE */
        .synthesis-grid { display: grid; grid-template-columns: 1fr; gap: 40px; }
        
        .main-card { 
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); 
            border: 2px solid var(--gold); padding: 60px; border-radius: 15px; 
            text-align: center; position: relative; box-shadow: 0 0 60px rgba(212,175,55,0.1);
        }
        .main-card::before { content: 'CONSELHO DO REGENTE'; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-family: 'Cinzel'; font-size: 0.7em; color: var(--gold); letter-spacing: 5px; opacity: 0.6; }

        .veredicto-text { font-size: 1.4em; line-height: 2.2; text-align: justify; color: #fff; margin-top: 30px; }
        .highlight { color: var(--gold); font-weight: bold; border-bottom: 1px solid rgba(212,175,55,0.3); }

        /* BLOCOS DE CONEXÃO */
        .connection-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 40px; }
        .conn-card { background: rgba(15,15,15,0.9); border: 1px solid #333; padding: 30px; border-radius: 8px; border-top: 3px solid var(--gold); }
        .conn-title { font-family: 'Cinzel'; color: var(--gold); font-size: 1em; margin-bottom: 15px; display: block; letter-spacing: 2px; }
        .conn-text { font-size: 0.95em; color: #aaa; text-align: justify; }

        .action-box { background: var(--red); color: #fff; padding: 30px; border-radius: 8px; margin-top: 50px; text-align: center; font-family: 'Cinzel'; letter-spacing: 2px; }

        @media(max-width: 768px) { .master-title { font-size: 2.2em; } .main-card { padding: 30px; } }
    </style>
</head>
<body>

<div id="loading-screen">
    <i class="fas fa-brain spinner"></i>
    <p style="color:#666; font-family:'Cinzel'; margin-top:15px; letter-spacing:3px;">Unificando Inteligências Arcanas...</p>
</div>

<div class="container">
    <nav class="nav-bar">
        <a href="dashboard-premium.html" class="btn-back">← Hub de Maestria</a>
        <div style="font-family:'Cinzel'; color:#444; font-size:0.8em;">SÍNTESE TRANSCENDENTAL</div>
    </nav>

    <header class="master-header">
        <h1 class="master-title">IA REGENTE</h1>
        <div class="master-subtitle">A unificação sistêmica do seu destino em 2026</div>
    </header>

    <div class="synthesis-grid">
        <div class="main-card">
            <div id="veredicto-container" class="veredicto-text">
                </div>
        </div>

        <div class="connection-grid">
            <div class="conn-card">
                <span class="conn-title">Cruzamento Astro-Numerológico</span>
                <p id="txt-astro-num" class="conn-text">Processando frequências...</p>
            </div>
            <div class="conn-card">
                <span class="conn-title">Dinâmica Oriental 2026</span>
                <p id="txt-china-2026" class="conn-text">Calculando Li Chun...</p>
            </div>
        </div>

        <div class="action-box" id="daily-action">
            SEU RITUAL DE PODER PARA AGORA: CALCULANDO...
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    try { firebase.initializeApp(firebaseConfig); } catch(e) {}
    const auth = firebase.auth();
    const db = firebase.firestore();

    const SIGNOS = ["Áries", "Touro", "Gêmeos", "Câncer", "Leão", "Virgem", "Libra", "Escorpião", "Sagitário", "Capricórnio", "Aquário", "Peixes"];
    const CHINES = ["Macaco","Galo","Cão","Porco","Rato","Boi","Tigre","Coelho","Dragão","Serpente","Cavalo","Cabra"];

    async function processarSintese(d) {
        try {
            // 1. DADOS BASE
            const nome = d.nome || "Iniciado";
            const dataNasc = d.dataNascimento || "2000-01-01";
            const [ano, mes, dia] = dataNasc.split('-').map(Number);

            // 2. CÁLCULO NUMEROLÓGICO EXPRESSO (RIGOR TÉCNICO)
            let somaNum = dataNasc.replace(/\D/g, '').split('').reduce((a,b) => a + parseInt(b), 0);
            while(somaNum > 9 && somaNum !== 11 && somaNum !== 22) somaNum = String(somaNum).split('').reduce((a,b) => a + parseInt(b), 0);

            // 3. CÁLCULO CHINÊS COM LI CHUN
            let anoChina = ano;
            if (mes < 2 || (mes === 2 && dia < 4)) anoChina--;
            const animal = CHINES[anoChina % 12];

            // 4. MOTOR ASTRONÔMICO (SOL E HORA)
            const time = Astronomy.MakeTime(new Date());
            const sunEqu = Astronomy.Equator("Sun", time, null, true, true);
            const sunLong = Astronomy.Ecliptic(sunEqu.vec).elon;
            const signoSolar = SIGNOS[Math.floor(sunLong / 30)];
            const horaAtual = new Date().getHours();

            // 5. HEURÍSTICA DE UNIFICAÇÃO (A IA REGENTE)
            const veredicto = document.getElementById('veredicto-container');
            
            let textoMestre = `Saudações, <span class='highlight'>${nome}</span>. A inteligência do Portal Arcano concluiu a análise transversal do seu biocampo para o dia de hoje. `;
            textoMestre += `Sua essência de <span class='highlight'>${animal}</span> na astrologia oriental encontra o Sol transitando pelo signo de <span class='highlight'>${signoSolar}</span>. `;
            textoMestre += `Esta combinação revela que sua força de execução está sendo testada pela vibração do seu Número de Destino <span class='highlight'>${somaNum}</span>. `;
            textoMestre += `Para 2026, o Ano do Cavalo de Fogo, sua missão é integrar a sabedoria do silêncio com a rapidez da ação solar. Não hesite, pois o cosmos favorece sua assinatura vibracional neste ciclo específico.`;

            veredicto.innerHTML = textoMestre;

            // 6. CONEXÕES DETALHADAS
            document.getElementById('txt-astro-num').innerText = `O trânsito de ${signoSolar} ativa seu pilar numerológico ${somaNum}. Isso indica um momento de colheita material se você mantiver o foco na disciplina de Saturno.`;
            document.getElementById('txt-china-2026').innerText = `Como ${animal}, o Cavalo de Fogo de 2026 é seu aliado em termos de vitalidade, mas exige cautela com a impulsividade.`;

            // 7. RITUAL DE AGORA (BASEADO NA HORA PLANETÁRIA)
            const rituais = ["Banho de Limpeza (Saturno)", "Meditação de Expansão (Júpiter)", "Afirmação de Coragem (Marte)", "Banho de Ouro (Sol)", "Ritual de Atração (Vênus)", "Escrita Terapêutica (Mercúrio)", "Banho de Ervas Doces (Lua)"];
            document.getElementById('daily-action').innerText = `AÇÃO RECOMENDADA PARA ESTA HORA: ${rituais[horaAtual % 7].toUpperCase()}`;

        } catch (e) {
            console.error(e);
        } finally {
            const screen = document.getElementById('loading-screen');
            screen.style.opacity = '0';
            setTimeout(() => screen.style.display = 'none', 1000);
        }
    }

    auth.onAuthStateChanged(user => {
        if(user) {
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                if(doc.exists) processarSintese(doc.data());
            });
        } else { window.location.href = 'index.html'; }
    });
</script>
</body>
</html>
