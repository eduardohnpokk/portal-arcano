<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Feng Shui 2026</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background-color: var(--bg-dark); color: #e0e0e0; font-size: 19px; line-height: 1.6; }
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { font-size: 4em; color: var(--gold); animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px 100px 20px; }
        .kua-hero { background: radial-gradient(circle, #1a1a1a 0%, #000 100%); border: 1px solid var(--gold); padding: 40px; text-align: center; border-radius: 8px; margin-bottom: 50px; box-shadow: 0 0 40px rgba(212,175,55,0.15); }
        .directions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .dir-card { background: rgba(15, 15, 15, 0.9); border: 1px solid #333; padding: 30px; border-radius: 8px; border-left: 4px solid #333; transition: 0.3s; }
        .dir-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .star-2026 { font-size: 0.8em; background: #8a1c1c; color: #fff; padding: 2px 10px; border-radius: 10px; margin-top: 10px; display: inline-block; font-family: 'Cinzel'; }
    </style>
</head>
<body>

<div id="loading-screen">
    <i class="fas fa-compass spinner"></i>
    <p style="color:#666; font-family:'Cinzel'; margin-top:15px; letter-spacing:2px;">Calculando Estrelas Voadoras 2026...</p>
</div>

<div class="container">
    <div class="nav-bar" style="display:flex; justify-content: space-between; align-items:center; margin-bottom:30px; border-bottom:1px solid #222; padding-bottom:10px;">
        <a href="dashboard-premium.html" style="color:var(--gold); font-family:'Cinzel'; text-decoration:none; font-size:0.8em;">← Voltar ao Hub</a>
        <div style="font-family:'Cinzel'; color:#666; font-size:0.8em; letter-spacing:3px;">XUAN KONG FENG SHUI</div>
    </div>

    <div class="kua-hero">
        <div style="font-family:'Cinzel'; color:var(--gold); font-size:6em; line-height:1;" id="val-kua">-</div>
        <div id="val-element" style="text-transform:uppercase; letter-spacing:4px; margin-top:10px; color:#fff;">Calculando Pilar...</div>
    </div>

    <h2 style="text-align:center; color:var(--gold); font-family:'Cinzel'; margin-bottom:30px; letter-spacing:2px;">MAPA DE CURAS 2026</h2>
    <div class="directions-grid" id="dir-grid"></div>
</div>

<script>
    const auth = firebase.auth();
    const db = firebase.firestore();

    const STARS_2026 = {
        "Norte": { id: 1, type: "Prosperidade futura", cure: "Metais" },
        "Sul": { id: 9, type: "Multiplicação de Ganho", cure: "Luz/Vermelho" },
        "Leste": { id: 3, type: "Conflitos/Brigas", cure: "Fogo/Vela" },
        "Oeste": { id: 5, type: "Perdas/Obstáculos", cure: "Sal/Sino de Vento" },
        "Sudeste": { id: 4, type: "Acadêmico/Romance", cure: "Plantas em água" },
        "Sudoeste": { id: 6, type: "Autoridade/Carreira", cure: "Pedras/Cristais" },
        "Nordeste": { id: 8, type: "Sucesso Financeiro", cure: "Movimento" },
        "Noroeste": { id: 7, type: "Roubos/Fofoca", cure: "Água parada" }
    };

    function calcularKua(dataStr, gen) {
        try {
            if (!dataStr || dataStr.length < 4) dataStr = "2000-01-01";
            
            const parts = dataStr.split('-');
            let year = parseInt(parts[0]);
            
            // Segurança contra NaN
            if (isNaN(year)) year = 2000;

            if (parseInt(parts[1]) < 2 || (parseInt(parts[1]) === 2 && parseInt(parts[2]) < 4)) year--;

            let sum = 0;
            String(year).split('').forEach(n => sum += parseInt(n));
            while(sum > 9) sum = String(sum).split('').reduce((a,b) => parseInt(a)+parseInt(b), 0);

            let k = (gen === 'female') ? sum + 4 : 11 - sum;
            while(k > 9) k = String(k).split('').reduce((a,b) => parseInt(a)+parseInt(b), 0);
            if (k === 5) k = (gen === 'female') ? 8 : 2;
            
            render(k);
        } catch (e) {
            console.error("Erro Kua:", e);
            render(9); // Fallback
        }
    }

    function render(k) {
        document.getElementById('val-kua').innerText = k;
        const elem = [1].includes(k)?"Água":[2,5,8].includes(k)?"Terra":[3,4].includes(k)?"Madeira":[6,7].includes(k)?"Metal":"Fogo";
        document.getElementById('val-element').innerText = "Elemento: " + elem;

        const grid = document.getElementById('dir-grid');
        grid.innerHTML = "";

        Object.keys(STARS_2026).forEach(d => {
            const star = STARS_2026[d];
            grid.innerHTML += `
                <div class="dir-card">
                    <div style="display:flex; justify-content:space-between; border-bottom:1px solid #222; padding-bottom:10px;">
                        <span style="font-family:'Cinzel'; color:#fff;">${d}</span>
                        <span style="color:var(--gold); font-family:'Cinzel';">Direção</span>
                    </div>
                    <div class="star-2026">Estrela de 2026: ${star.id}</div>
                    <p style="font-size:0.9em; color:#ccc; margin:15px 0;">Tendência: <span style="color:#fff;">${star.type}</span></p>
                    <p style="font-size:0.8em; color:#888;">Cura recomendada: <span class="highlight-gold">${star.cure}</span></p>
                </div>
            `;
        });
        document.getElementById('loading-screen').style.display = 'none';
    }

    auth.onAuthStateChanged(user => {
        if(user) {
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                const d = doc.exists ? doc.data() : {};
                calcularKua(d.dataNascimento || "2000-01-01", d.genero || "male");
            }).catch(() => {
                calcularKua("2000-01-01", "male");
            });
        } else {
            window.location.href = 'index.html';
        }
    });
</script>
</body>
</html>
