<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Feng Shui Sistêmico 2026</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; --danger: #8a1c1c; --safe: #1c4a1c; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background-color: var(--bg-dark); background-image: url('https://www.transparenttextures.com/patterns/stardust.png'); color: #e0e0e0; font-size: 19px; line-height: 1.6; overflow-x: hidden; }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease; }
        .spinner { font-size: 4em; color: var(--gold); animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px 100px 20px; position: relative; z-index: 1; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .btn-back { cursor: pointer; color: #666; text-transform: uppercase; font-size: 0.8em; letter-spacing: 2px; text-decoration: none; transition: 0.3s; }
        .btn-back:hover { color: var(--gold); }

        /* HERO KUA */
        .kua-hero { 
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); 
            border: 1px solid var(--gold); border-radius: 8px; padding: 50px; 
            text-align: center; margin-bottom: 50px; position: relative;
            box-shadow: 0 0 50px rgba(212,175,55,0.1);
        }
        .kua-number { font-family: 'Cinzel'; color: var(--gold); font-size: 7em; line-height: 1; text-shadow: 0 0 30px rgba(212,175,55,0.3); }
        .kua-group { font-family: 'Cinzel'; text-transform: uppercase; letter-spacing: 5px; color: #fff; margin-top: 10px; font-size: 1.2em; }
        .kua-desc { max-width: 700px; margin: 25px auto 0; color: #aaa; font-style: italic; text-align: justify; }

        /* GRID DE DIREÇÕES */
        .directions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .dir-card { 
            background: rgba(15, 15, 15, 0.95); border: 1px solid #333; padding: 35px; 
            border-radius: 8px; position: relative; transition: 0.4s;
        }
        .dir-card:hover { transform: translateY(-5px); border-color: var(--gold); }
        
        .badge-pos { background: var(--safe); color: #fff; font-family: 'Cinzel'; font-size: 0.6em; padding: 2px 10px; border-radius: 10px; position: absolute; top: 15px; right: 15px; }
        .badge-neg { background: var(--danger); color: #fff; font-family: 'Cinzel'; font-size: 0.6em; padding: 2px 10px; border-radius: 10px; position: absolute; top: 15px; right: 15px; }
        
        .dir-title { font-family: 'Cinzel'; color: var(--gold); font-size: 1.4em; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .star-box { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 4px; margin: 15px 0; border: 1px dashed #444; }
        .star-num { color: #fff; font-weight: bold; font-family: 'Cinzel'; }
        
        .deep-text { font-size: 0.95em; color: #ccc; text-align: justify; margin-bottom: 15px; }
        .cure-box { font-size: 0.85em; color: var(--gold); border-top: 1px solid #222; padding-top: 10px; font-weight: bold; }

        @media(max-width: 768px) { .directions-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div id="loading-screen">
    <i class="fas fa-compass spinner"></i>
    <p style="color:#666; font-family:'Cinzel'; margin-top:15px; letter-spacing:2px;">Mapeando Estrelas Voadoras de 2026...</p>
</div>

<div class="container">
    <div class="nav-bar">
        <a href="dashboard-premium.html" class="btn-back">← Voltar ao Hub</a>
        <div style="font-family:'Cinzel'; color:#444; font-size:0.8em; letter-spacing:3px;">XUAN KONG SISTÊMICO</div>
    </div>

    <div class="kua-hero" id="hero-area">
        <div class="kua-number" id="val-kua">-</div>
        <div class="kua-group" id="val-group">Processando...</div>
        <p class="kua-desc" id="val-kua-desc"></p>
    </div>

    <h2 style="text-align:center; color:var(--gold); font-family:'Cinzel'; margin-bottom:40px; letter-spacing:3px;">BÚSSOLA DE CURAS E ATIVAÇÕES 2026</h2>
    
    <div class="directions-grid" id="dir-grid">
        </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    try { firebase.initializeApp(firebaseConfig); } catch(e) {}
    const auth = firebase.auth();
    const db = firebase.firestore();

    // MAPA MESTRE DAS ESTRELAS VOADORAS 2026 (Ano do Cavalo de Fogo)
    const STARS_2026 = {
        "Norte": { id: 9, energy: "Fogo da Prosperidade Futura", desc: "A estrela mais afortunada de 2026. Traz clareza, reconhecimento e eventos festivos.", cure: "Ative com luz forte ou objetos vermelhos/púrpura." },
        "Sul": { id: 6, energy: "Metal da Autoridade Celestial", desc: "Favorece carreira e status, mas exige disciplina. Estrela de bençãos divinas.", cure: "Mantenha limpo. Use pedras naturais ou cristais." },
        "Leste": { id: 1, energy: "Água da Vitória e Nobreza", desc: "Excelente para estudos, novos projetos e superação de concorrentes.", cure: "Use uma fonte de água ou objetos em tons de azul e preto." },
        "Oeste": { id: 4, energy: "Madeira do Romance e Acadêmico", desc: "Favorece o amor e a criatividade. Cuidado com excessos emocionais.", cure: "Coloque 4 bambus da sorte em água neste setor." },
        "Sudeste": { id: 5, energy: "Terra do Mal Amarelo", desc: "A direção mais perigosa de 2026. Traz obstáculos repentinos e doenças.", cure: "URGENTE: Coloque um sino de vento de metal ou cura de sal." },
        "Sudoeste": { id: 8, energy: "Terra da Prosperidade Presente", desc: "Foco em acúmulo de patrimônio e estabilidade familiar.", cure: "Ative com movimento ou luz quente." },
        "Nordeste": { id: 2, energy: "Terra da Doença", desc: "Vibração de estagnação física e letargia mental.", cure: "Use uma cabaça (Wu Lou) de metal ou objetos redondos dourados." },
        "Noroeste": { id: 3, energy: "Madeira dos Conflitos", desc: "Provoca fofocas, brigas judiciais e desentendimentos.", cure: "Use um tapete vermelho ou uma vela acesa ocasionalmente aqui." }
    };

    const KUA_INFO = {
        1: { group: "Leste", lucky: ["Norte", "Sul", "Leste", "Sudeste"], desc: "Você é regido pela Água Profunda. Sua força é a adaptabilidade e a intuição. Em 2026, seu portal de maior força é o Norte, onde sua essência se une à estrela da prosperidade futura." },
        2: { group: "Oeste", lucky: ["Nordeste", "Noroeste", "Oeste", "Sudoeste"], desc: "Regido pela Terra Mãe. Você é o pilar de sustentação. Suas direções favoráveis exigem aterramento. Cuidado redobrado com o Nordeste em 2026." },
        3: { group: "Leste", lucky: ["Norte", "Sul", "Leste", "Sudeste"], desc: "Regido pela Madeira Trovão. Você é o iniciador. Sua energia expande em direções solares. O Sul será seu aliado estratégico para reconhecimento este ano." },
        4: { group: "Leste", lucky: ["Norte", "Sul", "Leste", "Sudeste"], desc: "Regido pela Madeira Vento. Você flui através das conexões. 2026 pede foco no Sudeste para proteção e no Norte para ganhos financeiros." },
        6: { group: "Oeste", lucky: ["Nordeste", "Noroeste", "Oeste", "Sudoeste"], desc: "Regido pelo Metal do Céu. Você é o líder disciplinado. O Noroeste e o Sudoeste são seus portais de poder natural este ano." },
        7: { group: "Oeste", lucky: ["Nordeste", "Noroeste", "Oeste", "Sudoeste"], desc: "Regido pelo Metal do Lago. Você é o comunicador. Sua sorte reside na alegria e na troca. O Oeste favorece seus estudos em 2026." },
        8: { group: "Oeste", lucky: ["Nordeste", "Noroeste", "Oeste", "Sudoeste"], desc: "Regido pela Terra da Montanha. Você é o sábio imperturbável. O Sudoeste traz a energia de riqueza que você precisa para consolidar projetos." },
        9: { group: "Leste", lucky: ["Norte", "Sul", "Leste", "Sudeste"], desc: "Regido pelo Fogo Radiante. Você é o visionário. 2026 é um ano intenso para sua essência. Use o Norte para acalmar e o Leste para vencer." }
    };

    function calcularKua(dataStr, gen) {
        try {
            const parts = dataStr.split('-');
            let y = parseInt(parts[0]);
            let m = parseInt(parts[1]);
            let d = parseInt(parts[2]);

            // RIGOR TÉCNICO: Pivot Solar Li Chun
            if (m < 2 || (m === 2 && d < 4)) y--;

            let sum = String(y).split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
            while(sum > 9) sum = String(sum).split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);

            let k = (gen === 'female') ? sum + 4 : 11 - sum;
            while(k > 9) k = String(k).split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
            if (k === 5) k = (gen === 'female') ? 8 : 2;

            renderizar(k);
        } catch (e) { console.error("Erro no cálculo Kua:", e); }
    }

    function renderizar(k) {
        const info = KUA_INFO[k];
        document.getElementById('val-kua').innerText = k;
        document.getElementById('val-group').innerText = `GRUPO ${info.group}`;
        document.getElementById('val-kua-desc').innerText = info.desc;

        const grid = document.getElementById('dir-grid');
        grid.innerHTML = "";

        Object.keys(STARS_2026).forEach(dir => {
            const star = STARS_2026[dir];
            const isLucky = info.lucky.includes(dir);
            
            grid.innerHTML += `
                <div class="dir-card">
                    <span class="${isLucky ? 'badge-pos' : 'badge-neg'}">
                        ${isLucky ? 'DIREÇÃO FAVORÁVEL' : 'DIREÇÃO DESFAVORÁVEL'}
                    </span>
                    <h3 class="dir-title">${dir.toUpperCase()}</h3>
                    <div class="star-box">
                        <span class="star-num">Estrela ${star.id}:</span> ${star.energy}
                    </div>
                    <p class="deep-text">${star.desc}</p>
                    <p class="deep-text">
                        <span style="color:${isLucky ? '#fff' : 'var(--danger)'}; font-weight:bold;">
                            Impacto no seu Kua:
                        </span> 
                        ${isLucky ? 'Esta direção potencializa sua força vital. Use-a para dormir ou trabalhar.' : 'Esta direção drena sua energia. Evite passar longos períodos voltado para cá.'}
                    </p>
                    <div class="cure-box">
                        <i class="fas fa-hammer"></i> AÇÃO RECOMENDADA: ${star.cure}
                    </div>
                </div>
            `;
        });

        // PROTOCOLO DE SEGURANÇA: Só remove o loading após renderizar tudo
        const loader = document.getElementById('loading-screen');
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 800);
    }

    auth.onAuthStateChanged(user => {
        if(user) {
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                const d = doc.exists ? doc.data() : {};
                calcularKua(d.dataNascimento || d.nascimento || "1990-01-01", d.genero || "male");
            });
        } else { window.location.href = 'index.html'; }
    });
</script>
</body>
</html>
