<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Sinastria de Almas</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <script src="astronomy.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background: var(--bg-dark); color: #e0e0e0; line-height: 1.6; }
        
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 40px; }
        .back-btn { cursor: pointer; color: var(--gold); font-family: 'Cinzel'; text-transform: uppercase; font-size: 0.8em; }

        h1 { font-family: 'Cinzel'; color: var(--gold); text-align: center; font-size: 2.5em; margin-bottom: 10px; }
        .intro-text { text-align: center; color: #888; margin-bottom: 40px; font-style: italic; }

        /* FORMULÁRIO DO PARCEIRO */
        .sync-box { background: rgba(20,20,20,0.8); border: 1px solid #333; padding: 30px; border-radius: 8px; margin-bottom: 40px; }
        .sync-box h3 { font-family: 'Cinzel'; color: var(--gold); margin-top: 0; text-align: center; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        input { background: #000; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 4px; font-family: 'Cormorant Garamond'; font-size: 1.1em; width: 100%; box-sizing: border-box; }
        input:focus { border-color: var(--gold); outline: none; }
        label { display: block; font-family: 'Cinzel'; font-size: 0.7em; color: var(--gold); margin-bottom: 5px; }

        .btn-calc { width: 100%; background: var(--gold); color: #000; border: none; padding: 15px; font-family: 'Cinzel'; font-weight: bold; cursor: pointer; margin-top: 20px; border-radius: 4px; transition: 0.3s; }
        .btn-calc:hover { background: #fff; transform: scale(1.02); }

        /* RESULTADOS */
        #result-area { display: none; animation: fadeIn 1.5s; }
        .analysis-card { background: #111; border-left: 4px solid var(--gold); padding: 30px; margin-bottom: 20px; text-align: justify; }
        .analysis-card h4 { font-family: 'Cinzel'; color: var(--gold); margin-top: 0; font-size: 1.2em; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media(max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-bar">
        <div class="back-btn" onclick="window.location.href='dashboard-premium.html'">← Voltar ao Portal</div>
        <div style="font-family:'Cinzel'; color:#444;">SINASTRIA DE ALMAS</div>
    </div>

    <h1>SINASTRIA AMOROSA</h1>
    <p class="intro-text">O cruzamento de destinos. Entenda como as estrelas de dois seres dançam em conjunto.</p>

    <div class="sync-box">
        <h3>Dados do Segundo Ser</h3>
        <div class="form-grid">
            <div style="grid-column: span 2;">
                <label>Nome Completo</label>
                <input type="text" id="p-nome" placeholder="Nome da pessoa">
            </div>
            <div>
                <label>Data de Nascimento</label>
                <input type="date" id="p-data">
            </div>
            <div>
                <label>Hora (aproximada)</label>
                <input type="time" id="p-hora">
            </div>
            <div style="grid-column: span 2;">
                <label>Cidade de Nascimento</label>
                <input type="text" id="p-cidade" placeholder="Ex: São Paulo">
            </div>
        </div>
        <button class="btn-calc" onclick="processarSinastria()">CALCULAR AFINIDADE</button>
    </div>

    <div id="result-area">
        <h2 style="font-family:'Cinzel'; color:var(--gold); text-align:center; margin-top:60px;">A Revelação do Elo</h2>
        <div id="sinastria-content"></div>
    </div>
</div>

<script>
    // CONFIGURAÇÃO FIREBASE
    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    try { firebase.initializeApp(firebaseConfig); } catch(e) {}
    const auth = firebase.auth();
    const db = firebase.firestore();

    let dadosUsuario = null;

    auth.onAuthStateChanged(user => {
        if(user) {
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                dadosUsuario = doc.data();
                if(dadosUsuario.status !== 'premium' && dadosUsuario.plano !== 'premium') {
                    window.location.href = 'dashboard.html';
                }
            });
        } else { window.location.href = 'index.html'; }
    });

    async function processarSinastria() {
        const pNome = document.getElementById('p-nome').value;
        const pData = document.getElementById('p-data').value;
        const pHora = document.getElementById('p-hora').value;

        if(!pNome || !pData || !pHora) return alert("Por favor, preencha os dados do segundo ser para a conexão.");

        // Lógica de cálculo (Simulação da primeira fase técnica)
        const content = document.getElementById('sinastria-content');
        const area = document.getElementById('result-area');
        area.style.display = 'block';

        content.innerHTML = `
            <div class="analysis-card">
                <h4>O Encontro de Sóis: Identidade e Propósito</h4>
                <p>O Sol representa a essência. Quando o Sol de ${dadosUsuario.nome} encontra a energia de ${pNome}, percebemos uma dinâmica de força mútua. Existe um reconhecimento imediato de objetivos de vida, permitindo que ambos caminhem na mesma direção sem anular a individualidade um do outro.</p>
            </div>
            <div class="analysis-card">
                <h4>A Dança das Luas: O Conforto Emocional</h4>
                <p>A Lua governa como sentimos. A sinastria entre vocês indica que as necessidades emocionais são complementares. Há um porto seguro onde um entende o silêncio do outro. É o tipo de conexão onde o "sentir-se em casa" acontece naturalmente, sem esforço.</p>
            </div>
            <div class="analysis-card">
                <h4>Vênus e Marte: Atração e Ação</h4>
                <p>O magnetismo entre vocês é movido por uma curiosidade intelectual que se transforma em química física. Enquanto Vênus suaviza as arestas, Marte traz o ímpeto de construir projetos em conjunto. É uma combinação vibrante que evita a estagnação do relacionamento.</p>
            </div>
        `;

        area.scrollIntoView({ behavior: 'smooth' });
    }
</script>
</body>
</html>
