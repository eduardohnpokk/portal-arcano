<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Sinastria de Almas</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <script src="astronomy.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background: var(--bg-dark); color: #e0e0e0; line-height: 1.8; }
        
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 40px; }
        .back-btn { cursor: pointer; color: var(--gold); font-family: 'Cinzel'; text-transform: uppercase; font-size: 0.8em; }

        h1 { font-family: 'Cinzel'; color: var(--gold); text-align: center; font-size: 2.5em; margin-bottom: 10px; }
        .intro-text { text-align: center; color: #888; margin-bottom: 40px; font-style: italic; }

        .sync-box { background: rgba(20,20,20,0.8); border: 1px solid #333; padding: 30px; border-radius: 8px; margin-bottom: 40px; }
        .sync-box h3 { font-family: 'Cinzel'; color: var(--gold); margin-top: 0; text-align: center; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        input { background: #000; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 4px; font-family: 'Cormorant Garamond'; font-size: 1.1em; width: 100%; box-sizing: border-box; }
        input:focus { border-color: var(--gold); outline: none; }
        label { display: block; font-family: 'Cinzel'; font-size: 0.7em; color: var(--gold); margin-bottom: 5px; }

        .btn-calc { width: 100%; background: var(--gold); color: #000; border: none; padding: 15px; font-family: 'Cinzel'; font-weight: bold; cursor: pointer; margin-top: 20px; border-radius: 4px; transition: 0.3s; }
        .btn-calc:hover { background: #fff; transform: scale(1.02); }

        #result-area { display: none; animation: fadeIn 1.5s; }
        .analysis-card { background: #111; border-left: 4px solid var(--gold); padding: 40px; margin-bottom: 30px; text-align: justify; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .analysis-card h4 { font-family: 'Cinzel'; color: var(--gold); margin-top: 0; font-size: 1.4em; border-bottom: 1px solid #222; padding-bottom: 15px; margin-bottom: 20px; }
        .analysis-card p { margin-bottom: 15px; color: #ccc; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media(max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-bar">
        <div class="back-btn" onclick="window.location.href='dashboard-premium.html'">← Voltar ao Portal</div>
        <div style="font-family:'Cinzel'; color:#444;">SINASTRIA DE ALMAS</div>
    </div>

    <h1>SINASTRIA AMOROSA</h1>
    <p class="intro-text">A geometria sagrada entre dois destinos. Este não é um teste de afinidade comum, mas uma análise das tensões e harmonias celestes.</p>

    <div class="sync-box">
        <h3>Dados do Segundo Ser</h3>
        <div class="form-grid">
            <div style="grid-column: span 2;">
                <label>Nome Completo</label>
                <input type="text" id="p-nome" placeholder="Nome da pessoa">
            </div>
            <div>
                <label>Data de Nascimento</label>
                <input type="date" id="p-data">
            </div>
            <div>
                <label>Hora (aproximada)</label>
                <input type="time" id="p-hora">
            </div>
            <div style="grid-column: span 2;">
                <label>Cidade de Nascimento</label>
                <input type="text" id="p-cidade" placeholder="Ex: São Paulo">
            </div>
        </div>
        <button class="btn-calc" onclick="processarSinastria()">DESVELAR CONEXÃO</button>
    </div>

    <div id="result-area">
        <h2 style="font-family:'Cinzel'; color:var(--gold); text-align:center; margin-top:60px; letter-spacing: 3px;">A ALQUIMIA DOS DESTINOS</h2>
        <div id="sinastria-content"></div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    try { firebase.initializeApp(firebaseConfig); } catch(e) {}
    const auth = firebase.auth();
    const db = firebase.firestore();

    let dadosUsuario = null;

    auth.onAuthStateChanged(user => {
        if(user) {
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                dadosUsuario = doc.data();
                if(dadosUsuario.status !== 'premium' && dadosUsuario.plano !== 'premium') {
                    window.location.href = 'dashboard.html';
                }
            });
        } else { window.location.href = 'index.html'; }
    });

    async function processarSinastria() {
        const pNome = document.getElementById('p-nome').value;
        const pData = document.getElementById('p-data').value;
        const pHora = document.getElementById('p-hora').value;

        if(!pNome || !pData || !pHora) return alert("Por favor, preencha os campos para invocar a análise.");

        const content = document.getElementById('sinastria-content');
        const area = document.getElementById('result-area');
        area.style.display = 'block';

        content.innerHTML = `
            <div class="analysis-card">
                <h4>O Encontro de Sóis: Identidade e o Reconhecimento do Ego</h4>
                <p>O Sol é o núcleo de nossa consciência. Quando analisamos a interação entre o seu Sol e o de ${pNome}, observamos como as vontades individuais se chocam ou se fundem. Nesta sinastria, há um fluxo de vitalidade que sugere que ambos podem brilhar sem que um eclipse o outro. </p>
                <p>A identidade de ${dadosUsuario.nome} encontra um eco na autoexpressão de ${pNome}, criando uma base de respeito mútuo. O desafio aqui é evitar a competição silenciosa por protagonismo, transformando a relação em uma parceria de dois líderes que constroem um império comum.</p>
            </div>

            <div class="analysis-card">
                <h4>A Dança das Luas: O Refúgio e o Subconsciente Compartilhado</h4>
                <p>A Lua governa o que não é dito; as necessidades de segurança e o ritmo biológico das emoções. A compatibilidade lunar entre vocês sugere uma "memória de alma". Há uma facilidade em prever as flutuações de humor do parceiro, o que reduz a necessidade de explicações constantes. </p>
                <p>É uma conexão de "porto seguro". ${pNome} oferece o suporte emocional que ${dadosUsuario.nome} busca em momentos de vulnerabilidade. No entanto, o perigo reside na codependência. A profundidade emocional é tão vasta que vocês podem se perder no mundo interno um do outro, esquecendo-se da praticidade da vida externa.</p>
            </div>

            <div class="analysis-card">
                <h4>Mercúrio: A Ponte Intelectual e os Labirintos do Diálogo</h4>
                <p>Mercúrio define como as ideias cruzam o abismo entre duas mentes. Na sua relação, o diálogo flui através de uma curiosidade incessante. Vocês são, antes de tudo, companheiros de jornada intelectual. A facilidade em trocar ideias complexas mantém a chama do interesse acesa a longo prazo. </p>
                <p>A atenção deve ser voltada para os momentos de tensão: a agilidade mental de ambos pode gerar debates acalorados onde a razão tenta sufocar o sentimento. Lembrem-se que nem toda verdade precisa ser dita com a frieza de um fato; a ponte de Mercúrio também deve transportar empatia.</p>
            </div>

            <div class="analysis-card">
                <h4>Vênus e Marte: A Alquimia do Desejo e a Força da Atração</h4>
                <p>Esta é a dinâmica entre o "Gostar" (Vênus) e o "Conquistar" (Marte). A sinastria revela um magnetismo físico poderoso, onde o desejo não é apenas instintivo, mas estético e profundo. Existe uma harmonia entre o que um considera belo e o que o outro expressa como paixão. </p>
                <p>A energia de Marte traz o ímpeto e a iniciativa, enquanto Vênus garante que essa força não seja destrutiva, transformando-a em afeto e prazer compartilhado. É uma química que se renova através do desafio e da admiração mútua, evitando que o cotidiano esfrie a conexão original.</p>
            </div>

            <div class="analysis-card">
                <h4>Saturno: O Selo do Tempo e a Responsabilidade do Elo</h4>
                <p>Saturno é o planeta que determina se uma relação passará pelo teste das décadas. Ele traz o peso da realidade. Nesta sinastria, Saturno atua como o cimento da construção: ele exige que vocês olhem para o futuro com seriedade. </p>
                <p>Embora Saturno possa trazer momentos de sensação de "dever" ou peso emocional, é ele quem garante que, nos momentos de crise, o compromisso fale mais alto que a vontade passageira. É a garantia de que este encontro não é apenas uma faísca, mas um contrato de alma desenhado para durar.</p>
            </div>
        `;

        area.scrollIntoView({ behavior: 'smooth' });
    }
</script>
</body>
</html>
