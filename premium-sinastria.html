<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Sinastria de Almas</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <script src="astronomy.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background: var(--bg-dark); color: #e0e0e0; line-height: 1.8; }
        
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 40px; }
        .back-btn { cursor: pointer; color: var(--gold); font-family: 'Cinzel'; text-transform: uppercase; font-size: 0.8em; }

        h1 { font-family: 'Cinzel'; color: var(--gold); text-align: center; font-size: 2.5em; margin-bottom: 10px; }
        .intro-text { text-align: center; color: #888; margin-bottom: 40px; font-style: italic; }

        .sync-box { background: rgba(20,20,20,0.8); border: 1px solid #333; padding: 30px; border-radius: 8px; margin-bottom: 40px; }
        .sync-box h3 { font-family: 'Cinzel'; color: var(--gold); margin-top: 0; text-align: center; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        input { background: #000; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 4px; font-family: 'Cormorant Garamond'; font-size: 1.1em; width: 100%; box-sizing: border-box; }
        input:focus { border-color: var(--gold); outline: none; }
        label { display: block; font-family: 'Cinzel'; font-size: 0.7em; color: var(--gold); margin-bottom: 5px; }

        .btn-calc { width: 100%; background: var(--gold); color: #000; border: none; padding: 15px; font-family: 'Cinzel'; font-weight: bold; cursor: pointer; margin-top: 20px; border-radius: 4px; transition: 0.3s; }
        .btn-calc:hover { background: #fff; transform: scale(1.02); }

        #result-area { display: none; animation: fadeIn 1.5s; text-align: center; }
        
        /* MEDIDOR DE AFINIDADE */
        .affinity-meter {
            width: 220px; height: 220px; border-radius: 50%; border: 2px solid var(--gold);
            margin: 40px auto; display: flex; flex-direction: column; align-items: center;
            justify-content: center; background: radial-gradient(circle, rgba(212,175,55,0.1) 0%, transparent 70%);
            box-shadow: 0 0 40px rgba(212,175,55,0.2);
        }
        .score-value { font-family: 'Cinzel'; font-size: 4em; color: var(--gold); line-height: 1; }
        .score-label { font-family: 'Cinzel'; font-size: 0.8em; color: #888; letter-spacing: 2px; margin-top: 5px; }

        .analysis-card { background: #111; border-left: 4px solid var(--gold); padding: 40px; margin-bottom: 30px; text-align: justify; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .analysis-card h4 { font-family: 'Cinzel'; color: var(--gold); margin-top: 0; font-size: 1.4em; border-bottom: 1px solid #222; padding-bottom: 15px; margin-bottom: 20px; }
        .analysis-card p { margin-bottom: 15px; color: #ccc; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media(max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-bar">
        <div class="back-btn" onclick="window.location.href='dashboard-premium.html'">← Voltar ao Portal</div>
        <div style="font-family:'Cinzel'; color:#444;">SINASTRIA DE ALMAS</div>
    </div>

    <h1>SINASTRIA AMOROSA</h1>
    <p class="intro-text">A geometria sagrada entre dois destinos. Este não é um teste de afinidade comum, mas uma análise das tensões e harmonias celestes.</p>

    <div class="sync-box">
        <h3>Dados do Segundo Ser</h3>
        <div class="form-grid">
            <div style="grid-column: span 2;">
                <label>Nome Completo</label>
                <input type="text" id="p-nome" placeholder="Nome da pessoa">
            </div>
            <div>
                <label>Data de Nascimento</label>
                <input type="date" id="p-data">
            </div>
            <div>
                <label>Hora (aproximada)</label>
                <input type="time" id="p-hora">
            </div>
            <div style="grid-column: span 2;">
                <label>Cidade de Nascimento</label>
                <input type="text" id="p-cidade" placeholder="Ex: São Paulo">
            </div>
        </div>
        <button class="btn-calc" id="btn-main" onclick="processarSinastria()">DESVELAR CONEXÃO</button>
    </div>

    <div id="result-area">
        <div class="affinity-meter">
            <div class="score-value" id="score-pct">0%</div>
            <div class="score-label">Afinidade Astral</div>
        </div>
        <h2 style="font-family:'Cinzel'; color:var(--gold); text-align:center; margin-top:20px; letter-spacing: 3px;">A ALQUIMIA DOS DESTINOS</h2>
        <div id="sinastria-content" style="text-align: left; margin-top: 40px;"></div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    try { firebase.initializeApp(firebaseConfig); } catch(e) {}
    const auth = firebase.auth();
    const db = firebase.firestore();

    const DB_COORDS = { "sp": {lat:-23.55, lon:-46.63}, "rj": {lat:-22.90, lon:-43.17}, "default": {lat:-15.79, lon:-47.89} };
    let dadosUsuario = null;

    auth.onAuthStateChanged(user => {
        if(user) {
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                dadosUsuario = doc.data();
                if(dadosUsuario.status !== 'premium' && dadosUsuario.plano !== 'premium') {
                    window.location.href = 'dashboard.html';
                }
            });
        } else { window.location.href = 'index.html'; }
    });

    // Função técnica para obter a longitude eclíptica de um planeta
    function getLong(planet, date, hour) {
        const time = Astronomy.MakeTime(new Date(date + "T" + hour));
        const observer = new Astronomy.Observer(DB_COORDS.default.lat, DB_COORDS.default.lon, 0);
        const equ = Astronomy.Equator(planet, time, observer, true, true);
        return Astronomy.Ecliptic(equ.vec).elon;
    }

    async function processarSinastria() {
        const pNome = document.getElementById('p-nome').value;
        const pData = document.getElementById('p-data').value;
        const pHora = document.getElementById('p-hora').value || "12:00";

        if(!pNome || !pData) return alert("Por favor, preencha os dados essenciais para invocar a análise.");
        
        document.getElementById('btn-main').innerText = "CALCULANDO ÓRBITAS...";

        // CÁLCULOS TÉCNICOS
        const uSol = getLong("Sun", dadosUsuario.dataNascimento, dadosUsuario.horaNascimento);
        const uLua = getLong("Moon", dadosUsuario.dataNascimento, dadosUsuario.horaNascimento);
        const uVen = getLong("Venus", dadosUsuario.dataNascimento, dadosUsuario.horaNascimento);
        const uMar = getLong("Mars", dadosUsuario.dataNascimento, dadosUsuario.horaNascimento);

        const pSol = getLong("Sun", pData, pHora);
        const pLua = getLong("Moon", pData, pHora);
        const pVen = getLong("Venus", pData, pHora);
        const pMar = getLong("Mars", pData, pHora);

        // LÓGICA DE AFINIDADE (PESOS)
        let notaTotal = 0;
        
        // Afinidade Sol/Lua (Base da Alma) - Peso 40
        const diffSol = Math.abs(uSol - pSol) % 120;
        if(diffSol < 10) notaTotal += 40; else if(diffSol < 30) notaTotal += 25; else notaTotal += 10;

        // Afinidade Vênus/Marte (Química) - Peso 40
        const diffVen = Math.abs(uVen - pMar) % 120;
        if(diffVen < 10) notaTotal += 40; else if(diffVen < 30) notaTotal += 20; else notaTotal += 5;

        // Bônus de Elemento - Peso 20
        if(Math.floor(uSol/30) % 4 === Math.floor(pSol/30) % 4) notaTotal += 20;

        const scoreFinal = Math.min(notaTotal, 100);

        // EXIBIÇÃO
        const content = document.getElementById('sinastria-content');
        const area = document.getElementById('result-area');
        document.getElementById('score-pct').innerText = scoreFinal + "%";
        area.style.display = 'block';

        content.innerHTML = `
            <div class="analysis-card">
                <h4>O Encontro de Sóis: Identidade e o Reconhecimento do Ego</h4>
                <p>O Sol é o núcleo de nossa consciência. Quando analisamos a interação entre o seu Sol e o de ${pNome}, observamos como as vontades individuais se fundem. Nesta sinastria, há um fluxo de vitalidade que sugere que ambos podem brilhar sem que um eclipse o outro. </p>
                <p>A identidade de ${dadosUsuario.nome} encontra um eco na autoexpressão de ${pNome}, criando uma base de respeito mútuo.</p>
            </div>

            <div class="analysis-card">
                <h4>A Dança das Luas: O Refúgio e o Subconsciente Compartilhado</h4>
                <p>A Lua governa o que não é dito. A compatibilidade lunar entre vocês sugere uma "memória de alma". Há uma facilidade em prever as flutuações de humor do parceiro. </p>
                <p>É uma conexão de "porto seguro". ${pNome} oferece o suporte emocional que ${dadosUsuario.nome} busca em momentos de vulnerabilidade.</p>
            </div>

            <div class="analysis-card">
                <h4>Vênus e Marte: A Alquimia do Desejo e a Força da Atração</h4>
                <p>A sinastria revela um magnetismo físico poderoso. Existe uma harmonia entre o que um considera belo e o que o outro expressa como paixão. </p>
                <p>A energia de Marte traz o ímpeto, enquanto Vênus garante que essa força se transforme em afeto e prazer compartilhado.</p>
            </div>

            <div class="analysis-card">
                <h4>Saturno: O Selo do Tempo e a Responsabilidade do Elo</h4>
                <p>Saturno é o planeta que determina se uma relação passará pelo teste das décadas. Ele exige que vocês olhem para o futuro com seriedade. </p>
                <p>É a garantia de que este encontro não é apenas uma faísca, mas um contrato de alma desenhado para durar.</p>
            </div>
        `;

        document.getElementById('btn-main').innerText = "DESVELAR CONEXÃO";
        area.scrollIntoView({ behavior: 'smooth' });
    }
</script>
</body>
</html>
