<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Zodíaco Chinês</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; --red: #8a1c1c; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background-color: var(--bg-dark); color: #e0e0e0; font-size: 19px; line-height: 1.8; }
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { font-size: 4em; color: var(--gold); animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px 100px 20px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-back { cursor: pointer; color: #666; text-transform: uppercase; font-size: 0.8em; letter-spacing: 2px; text-decoration: none; transition: 0.3s; }
        .btn-back:hover { color: var(--gold); }

        .china-hero { background: radial-gradient(circle, #1a1a1a 0%, #000 100%); border: 1px solid var(--gold); border-radius: 8px; padding: 60px 40px; text-align: center; margin-bottom: 40px; position: relative; }
        .china-hero::after { content: '2026: Ano do Cavalo de Fogo'; position: absolute; bottom: 10px; right: 20px; font-family: 'Cinzel'; font-size: 0.6em; color: var(--red); letter-spacing: 2px; }
        .report-block { background: rgba(20, 20, 20, 0.8); border-left: 4px solid var(--red); padding: 40px; margin-bottom: 30px; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .block-title { font-family: 'Cinzel'; color: var(--gold); margin-bottom: 20px; font-size: 1.4em; }
    </style>
</head>
<body>

<div id="loading-screen">
    <i class="fas fa-dragon spinner"></i>
    <p style="color:#666; font-family:'Cinzel'; margin-top:15px; letter-spacing:2px;">Decifrando Pilares do Destino...</p>
</div>

<div class="container">
    <div class="nav-bar">
        <a href="dashboard-premium.html" class="btn-back">← Voltar ao Hub</a>
        <div style="font-family:'Cinzel'; color:#444;">SHENG XIAO • 2026</div>
    </div>

    <div class="china-hero">
        <div id="res-icon" style="font-size: 6em; color: var(--gold); margin-bottom: 20px;"></div>
        <h1 id="res-animal" style="font-family:'Cinzel'; font-size: 4em; color: #fff; margin:0; text-transform: uppercase;">...</h1>
        <div id="res-element" style="background:var(--red); padding: 5px 30px; display:inline-block; border-radius: 20px; font-family:'Cinzel'; letter-spacing: 2px; margin-top:15px;">...</div>
    </div>

    <div id="report-area"></div>
</div>

<script>
    const ANIMAIS_DB = ["Macaco","Galo","Cão","Porco","Rato","Boi","Tigre","Coelho","Dragão","Serpente","Cavalo","Cabra"];
    const ELEMENTOS_DB = ["Metal","Metal","Água","Água","Madeira","Madeira","Fogo","Fogo","Terra","Terra"];
    const ICONS_DB = {"Rato":"mouse","Boi":"ox","Tigre":"cat","Coelho":"paw","Dragão":"dragon","Serpente":"staff-snake","Cavalo":"horse","Cabra":"bacon","Macaco":"atom","Galo":"crow","Cão":"dog","Porco":"piggy-bank"};

    function processarBazi(dataStr) {
        try {
            // Tratamento de segurança para data
            if (!dataStr || dataStr.length < 4) dataStr = "2000-01-01";
            
            const parts = dataStr.split('-');
            let year = parseInt(parts[0]);
            let month = parseInt(parts[1]);
            let day = parseInt(parts[2]);

            if (isNaN(year)) year = 2000;

            // Correção Li Chun (Início do ano solar chinês)
            if (month < 2 || (month === 2 && day < 4)) {
                year--;
            }

            const animal = ANIMAIS_DB[year % 12];
            const elemento = ELEMENTOS_DB[year % 10];
            
            exibir(animal, elemento);
        } catch (e) {
            console.error(e);
            exibir("Dragão", "Metal"); // Fallback seguro
        } finally {
            document.getElementById('loading-screen').style.display = 'none';
        }
    }

    function exibir(a, e) {
        const iconClass = ICONS_DB[a] || "dragon";
        document.getElementById('res-icon').innerHTML = `<i class="fas fa-${iconClass}"></i>`;
        document.getElementById('res-animal').innerText = a;
        document.getElementById('res-element').innerText = e + " (Pilar Anual)";

        document.getElementById('report-area').innerHTML = `
            <div class="report-block">
                <div class="block-title">A Natureza do seu Espírito: ${a}</div>
                <p style="text-align:justify; color:#ccc;">Sua essência é regida pela vibração do ${a}. No sistema chinês, isso define sua base instintiva. Em 2026, o Ano do Cavalo de Fogo, sua energia terá um encontro dinâmico com a rapidez deste ciclo. ${a === 'Cavalo' ? 'Como este é o seu ano, a intensidade será duplicada: foco total em renovação.' : 'A interação entre sua essência e o ano exige adaptabilidade estratégica.'}</p>
            </div>
            <div class="report-block">
                <div class="block-title">A Matéria Alquímica: ${e}</div>
                <p style="text-align:justify; color:#ccc;">O elemento ${e} é o sangue que corre nas veias do seu animal. Ele define COMO você persegue seus objetivos. O ${e} traz uma camada de ${e === 'Metal' ? 'determinação inflexível' : e === 'Água' ? 'intuição fluida' : e === 'Madeira' ? 'crescimento constante' : e === 'Fogo' ? 'paixão expansiva' : 'estabilidade sólida'} para sua personalidade.</p>
            </div>
        `;
    }

    const auth = firebase.auth();
    const db = firebase.firestore();
    auth.onAuthStateChanged(user => {
        if(user) {
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                const d = doc.exists ? doc.data() : {};
                processarBazi(d.dataNascimento || "2000-01-01");
            }).catch(e => {
                processarBazi("2000-01-01");
            });
        } else {
            // Redirecionamento de segurança
            window.location.href = 'index.html';
        }
    });
</script>
</body>
</html>
