        "Coelho": {
            desc: "O Coelho é o Diplomata da Sorte, regido por uma aura de elegância e astúcia discreta. Você possui uma sensibilidade aguçada que capta as intenções alheias antes que elas sejam verbalizadas. Sistemicamente, você é o harmonizador, aquele que evita o colapso do clã através da palavra certa e do recuo estratégico. Embora pareça frágil, sua força reside na resiliência: você se dobra mas não quebra, sempre encontrando uma saída segura para os conflitos. O desafio é não se tornar excessivamente cauteloso ou fugir das decisões difíceis da vida.",

            mission: "Sua missão é trazer luz às profundezas do conhecimento. Você veio para ser o guardião de verdades ocultas e ensinar a importância da análise profunda sobre a impulsividade."

        "Cabra": {
            desc: "A Cabra representa o Sonhador Criativo, o ápice da energia Yin da compaixão. Você transforma o caos emocional em beleza através da empatia e da sensibilidade artística. Sistemicamente, você é a alma do clã, aquele que nutre os corações e mantém a união através do afeto silencioso. Possui uma resistência passiva incrível: você vence os outros pela insistência doce e pela recusa em entrar em combates desnecessários. O desafio é a dependência emocional; você deve aprender a encontrar segurança dentro de si mesmo, não apenas no apoio alheio.",
            work: "Artes visuais, cura holística, educação ou design de interiores. Você brilha onde a criatividade e o cuidado humano são necessários. Não foi feito para a competição corporativa feroz; você precisa de ambientes colaborativos e harmoniosos para florescer.",

        },
        "Macaco": {
            desc: "O Macaco é o Gênio Inventivo, dotado de uma agilidade mental que beira a magia. Nenhuma situação é complexa demais para sua mente resolutiva. Sistemicamente, você é o solucionador de problemas e o inovador que encontra brechas para o progresso onde ninguém mais vê. Você joga o jogo da vida com leveza e humor, mas sua astúcia pode ser confundida com oportunismo. O desafio é a falta de foco em um único objetivo; você deve aprender que a maestria exige profundidade em um campo, não apenas o conhecimento superficial de mil áreas.",
            work: "Tecnologia de ponta, mercado de ações, engenharia social ou advocacia. Você prospera no caos e na mudança rápida. Sua habilidade em improvisar garante que você nunca fique sem recursos, sendo um mestre em 'fazer muito com pouco'.",
            mission: "Sua missão é acelerar a evolução técnica e mental da humanidade. Você veio para mostrar que a curiosidade eterna e a criatividade são as chaves para vencer qualquer limitação."

        "Galo": {
            desc: "O Galo representa o Guardião da Ordem e da Clareza. Você possui uma visão microscópica para detalhes e uma franqueza que serve como ferramenta de cura social. Sistemicamente, você é o administrador, aquele que organiza os recursos e mantém a disciplina do sistema. Você valoriza a aparência e o status, mas apenas como reflexo do seu trabalho árduo. Seu desafio é o perfeccionismo paralisante e o julgamento severo sobre os outros; aprenda que a perfeição é um ideal divino, mas o progresso humano é feito de falhas.",

        "Cão": {
            desc: "O Cão é o Protetor Vigilante, regido por um radar moral inabalável. Sua lealdade é o pilar que sustenta seus relacionamentos e projetos. Sistemicamente, você é o sentinela, aquele que detecta injustiças e perigos ancestrais antes que eles se manifestem. Você possui uma natureza ansiosa por querer proteger tudo e todos, mas seu espírito é um dos mais nobres do zodíaco. O desafio é o pessimismo; você deve aprender que o universo conspira a favor da justiça e que a sua vigilância não precisa ser uma prisão de medo.",
            work: "Segurança, justiça, assistência social ou ONGs. Você precisa de um propósito moral para trabalhar. Líderes Cães são os mais amados pelas equipes porque priorizam o bem do grupo acima do lucro cego. Sua fortuna é estável e baseada na confiança que os outros depositam em sua palavra.",
            mission: "Sua missão é salvaguardar os valores fundamentais do espírito humano. Você veio para ensinar o valor da lealdade sacrificial e da proteção aos mais vulneráveis."
        },
        "Porco": {
            desc: "O Porco é o Filantropo Nobre, que encerra o ciclo do zodíaco com a vibração da generosidade e do prazer sensorial. Você é uma alma antiga que entende que a verdadeira riqueza reside na abundância compartilhada. Sistemicamente, você é o provedor de conforto e o pacificador final. Sua natureza é honesta, transparente e às vezes ingênua por acreditar na bondade intrínseca de todos. O desafio é o excesso de indulgência; você deve aprender a colocar limites em sua doação para não esgotar sua própria fonte vital.",
            work: "Gastronomia, hotelaria, grandes artes ou filantropia corporativa. Você brilha em qualquer área que proporcione bem-estar aos outros. Sua sorte financeira é imensa, pois o dinheiro flui para você naturalmente para que você possa continuar sendo um canal de abundância para o mundo.",

    };

    const ELEMENTOS_DESC = {
        "Metal": "O <span class='highlight'>Elemento Metal</span> traz para sua essência a determinação cortante, a lógica e o senso de justiça. Ele funciona como uma armadura para o seu animal astrológico, tornando-o ambicioso e focado em resultados tangíveis. Sua vontade é de ferro, mas sua dificuldade reside em expressar vulnerabilidade emocional.",
        "Água": "O <span class='highlight'>Elemento Água</span> confere à sua personalidade uma intuição fluida e um poder comunicativo persuasivo. Ele suaviza as arestas brutas do seu signo, permitindo que você contorne obstáculos com diplomacia. Sua força é a adaptabilidade, infiltrando-se nas brechas do destino para alcançar o oceano do sucesso.",
        "Madeira": "O <span class='highlight'>Elemento Madeira</span> injeta em você o impulso do crescimento constante e uma ética social inabalável. Você é flexível como um bambu, mas possui raízes profundas na tradição. Sua criatividade é expansiva, buscando sempre o progresso coletivo e o bem-estar da sua comunidade.",
        "Fogo": "O <span class='highlight'>Elemento Fogo</span> acende em sua alma a paixão expansiva, o carisma e a liderança visível. Você não nasceu para os bastidores; sua luz atrai atenção e seguidores. Sua força é o dinamismo, mas deve cuidar para que sua intensidade não queime as pontes que construiu no caminho.",
        "Terra": "O <span class='highlight'>Elemento Terra</span> 'aterra' sua essência com pragmatismo, responsabilidade e cautela. Você é o nutridor do zodíaco, focado em segurança e resultados de longo prazo. Sua força é a estabilidade sólida, sendo a rocha sobre a qual todos os outros elementos buscam apoio em momentos de crise."
    };

    const ANIMAIS_LIST = ["Macaco","Galo","Cão","Porco","Rato","Boi","Tigre","Coelho","Dragão","Serpente","Cavalo","Cabra"];
    const ELEMENTOS_LIST = ["Metal","Metal","Água","Água","Madeira","Madeira","Fogo","Fogo","Terra","Terra"];
    const ICONS_MAP = {"Rato":"mouse","Boi":"bullhorn","Tigre":"cat","Coelho":"paw","Dragão":"dragon","Serpente":"staff-snake","Cavalo":"horse","Cabra":"bacon","Macaco":"atom","Galo":"crow","Cão":"dog","Porco":"piggy-bank"};

    function processarBazi(dataStr, nome) {
        try {
            if (!dataStr) throw new Error("Data Ausente");
            const parts = dataStr.split('-');
            let y = parseInt(parts[0]);
            let m = parseInt(parts[1]);
            let d = parseInt(parts[2]);

            // RIGOR TÉCNICO: Correção Li Chun (4 de Fevereiro)
            if (m < 2 || (m === 2 && d < 4)) y--;

            const animal = ANIMAIS_LIST[y % 12];
            const elemento = ELEMENTOS_LIST[y % 10];
            
            exibirDados(animal, elemento, nome, y);
        } catch (e) {
            console.error(e);
        }
    }

    function exibirDados(a, e, nome, ano) {
        document.getElementById('res-icon').innerHTML = `<i class="fas fa-${ICONS_MAP[a]}"></i>`;
        document.getElementById('res-animal').innerText = a;
        document.getElementById('res-element').innerText = `${e.toUpperCase()} • PILAR ANUAL`;
        document.getElementById('user-info').innerText = `${nome.toUpperCase()} • CICLO SOLAR ATIVO`;

        const data = ANIMAIS_DATA[a];
        document.getElementById('report-area').innerHTML = `
            <div class="report-block">
                <div class="block-title">A NATUREZA DO SEU ESPÍRITO: ${a.toUpperCase()}</div>
                <p class="deep-text">${data.desc}</p>
            </div>
            <div class="report-block">
                <div class="block-title">A MATÉRIA ALQUÍMICA: ${e.toUpperCase()}</div>
                <p class="deep-text">${ELEMENTOS_DESC[e]}</p>
            </div>
            <div class="report-block">
                <div class="block-title">DINÂMICA DE CARREIRA E FORTUNA</div>
                <p class="deep-text">${data.work}</p>
            </div>
            <div class="report-block" style="border-left-color: var(--gold);">
                <div class="block-title">INTERAÇÃO COM 2026 (CAVALO DE FOGO)</div>
                <p class="deep-text">O ano de 2026 funciona como um acelerador sistêmico para você. Para a essência do <span class='highlight'>${a}</span>, este ciclo exige um alinhamento cirúrgico entre seus desejos internos e sua ação no mundo. ${a === 'Cavalo' ? 'Este é o seu Ben Ming Nian (Ano do Signo): a intensidade é máxima e a renovação de identidade é obrigatória.' : 'Sua interação com o fogo do Cavalo exige que você abandone métodos lentos e adote uma postura de decisão rápida para não perder as janelas de oportunidade que se fecharão em 2027.'}</p>
            </div>
            <div class="report-block">
                <div class="block-title">SÍNTESE DA MISSÃO DE ALMA</div>
                <p class="deep-text">${data.mission}</p>
            </div>
        `;

        document.getElementById('loading-screen').style.display = 'none';
    }

    auth.onAuthStateChanged(user => {
        if(user) {
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                const d = doc.data();
                processarBazi(d.dataNascimento || d.nascimento || "2000-01-01", d.nome || "Iniciado");
            });
        }
    });
</script>
