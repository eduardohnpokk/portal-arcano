<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Visão Parcial</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background-color: var(--bg-dark); background-image: url('https://www.transparenttextures.com/patterns/stardust.png'); color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .header-container { text-align: center; padding-top: 60px; width: 100%; margin-bottom: 40px; }
        .main-title { font-family: 'Cinzel', serif; font-size: 3em; color: var(--gold); text-shadow: 0 0 20px rgba(212,175,55,0.4); margin: 0; letter-spacing: 2px; }
        .cta-box { border: 1px solid var(--gold); padding: 50px; background: rgba(10, 10, 10, 0.95); border-radius: 12px; margin-top: 60px; text-align: center; }
        .btn-buy { background: linear-gradient(45deg, #d4af37, #b8860b); color: #000; font-family: 'Cinzel'; font-size: 1.3em; padding: 20px 60px; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; width: 100%; max-width: 400px; }
        .btn-logout { background: transparent; border: 1px solid #333; color: #666; padding: 10px 30px; margin-top: 40px; cursor: pointer; font-family: 'Cinzel'; }
    </style>
</head>
<body>
    <div class="header-container"><h1 class="main-title">CONHECIMENTO PARCIAL</h1></div>
    <div class="cta-box">
        <h1 style="font-family:'Cinzel'; color:var(--gold);">DESBLOQUEIE O ARCANO</h1>
        <p>Assinatura Mensal: R$ 49,90</p>
        <button class="btn-buy" id="btn-comprar">ASSINAR PORTAL PREMIUM</button>
    </div>
    <button class="btn-logout" onclick="firebase.auth().signOut()">Sair do Templo</button>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // RIGOR TÉCNICO: ID validado conforme image_892fcf.png
        const ID_ASSINATURA = "price_1T1ProL12Q2zNNHl5Q8qF2aM"; 

        document.getElementById('btn-comprar').addEventListener('click', async () => {
            const user = auth.currentUser;
            if(!user) return;
            const btn = document.getElementById('btn-comprar');
            btn.innerText = "SINTONIZANDO...";
            try {
                const response = await fetch('/api/create-checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        priceId: ID_ASSINATURA, 
                        uid: user.uid, 
                        email: user.email, 
                        mode: 'subscription' 
                    })
                });
                const data = await response.json();
                if (data.url) window.location.href = data.url;
                else throw new Error(data.error);
            } catch (error) {
                alert("ALERTA TÉCNICO: " + error.message);
                btn.innerText = "ASSINAR PORTAL PREMIUM";
            }
        });

        auth.onAuthStateChanged(user => {
            if (user) {
                db.collection("usuarios").doc(user.uid).onSnapshot(doc => {
                    if (doc.exists && doc.data().status === "premium") {
                        window.location.href = "dashboard-premium.html";
                    }
                });
            } else window.location.href = "index.html";
        });
    </script>
</body>
</html>
