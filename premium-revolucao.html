<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Revolução Solar</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; }
        body { 
            margin: 0; font-family: 'Cormorant Garamond', serif; 
            background-color: var(--bg-dark);
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            color: #e0e0e0; font-size: 19px; line-height: 1.8; 
        }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { font-size: 4em; color: var(--gold); animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px 100px 20px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 40px; }
        .btn-back { cursor: pointer; color: var(--gold); font-family: 'Cinzel'; text-transform: uppercase; font-size: 0.8em; letter-spacing: 2px; }

        .page-header { text-align: center; margin-bottom: 60px; }
        .page-title { font-family: 'Cinzel'; color: var(--gold); font-size: 3em; margin: 0; text-shadow: 0 0 20px rgba(212,175,55,0.4); }
        .year-highlight { font-family: 'Cinzel'; font-size: 1.5em; color: #fff; margin-top: 10px; display: block; }

        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-bottom: 50px; }
        .info-card { background: rgba(15, 15, 15, 0.9); border: 1px solid #333; padding: 30px; border-radius: 8px; text-align: center; border-top: 3px solid var(--gold); }
        .info-label { font-family: 'Cinzel'; font-size: 0.8em; color: #888; text-transform: uppercase; letter-spacing: 2px; }
        .info-value { font-family: 'Cinzel'; font-size: 1.8em; color: var(--gold); margin: 10px 0; }

        .analysis-section { background: rgba(20, 20, 20, 0.8); border-left: 4px solid var(--gold); padding: 40px; margin-bottom: 40px; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .analysis-section h3 { font-family: 'Cinzel'; color: var(--gold); margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .analysis-text { text-align: justify; color: #ccc; }
        .highlight-gold { color: var(--gold); font-weight: bold; }

        @media(max-width: 600px) { .page-title { font-size: 2em; } }
    </style>
</head>
<body>

<div id="loading-screen">
    <i class="fas fa-sun spinner"></i>
    <p style="color:#666; font-family:'Cinzel'; margin-top:15px; letter-spacing:2px;">Sincronizando Órbitas...</p>
</div>

<div class="container">
    <div class="nav-bar">
        <div class="btn-back" onclick="window.location.href='dashboard-premium.html'">← Voltar ao Hub</div>
        <div style="font-family:'Cinzel'; color:#444;">MAPA DO ANO 2026</div>
    </div>

    <header class="page-header">
        <h1 class="page-title">REVOLUÇÃO SOLAR</h1>
        <span class="year-highlight" id="user-name">Carregando Nome...</span>
        <p style="color:#888; font-style:italic;">O seu ano pessoal começa aqui.</p>
    </header>

    <div class="summary-grid">
        <div class="info-card">
            <div class="info-label">Início do Ciclo</div>
            <div class="info-value" id="return-date">--/--/--</div>
            <div style="font-size:0.8em; color:#666;">Momento do Retorno Solar</div>
        </div>
        <div class="info-card">
            <div class="info-label">Ascendente do Ano</div>
            <div class="info-value" id="asc-year">Calculando...</div>
            <div style="font-size:0.8em; color:#666;">A tônica do seu desenvolvimento</div>
        </div>
    </div>

    <div id="content-area"></div>
</div>

<script>
    const DB_COORDS = { "default": {lat:-23.55, lon:-46.63} }; // Padrão SP para precisão
    const SIGNOS = ["Áries", "Touro", "Gêmeos", "Câncer", "Leão", "Virgem", "Libra", "Escorpião", "Sagitário", "Capricórnio", "Aquário", "Peixes"];

    const TEXTOS_REVOLUCAO = {
        "Ascendente": {
            "Áries": "Este é um ano de afirmação pessoal e novos começos. A energia é de coragem e ação.",
            "Touro": "O foco do ano é a consolidação material e a busca por estabilidade real.",
            "Gêmeos": "Um ciclo de intensa movimentação intelectual e novos contatos sociais.",
            "Câncer": "A tônica recai sobre o lar e a segurança emocional profunda.",
            "Leão": "Um ano para brilhar. Sua criatividade e autoexpressão pedem espaço.",
            "Virgem": "Período de organização, foco no trabalho e atenção à saúde prática.",
            "Libra": "As parcerias e os relacionamentos ganham destaque absoluto este ano.",
            "Escorpião": "Um ciclo de profundas transformações e renascimentos pessoais.",
            "Sagitário": "Expansão de horizontes, fé e novas aventuras intelectuais ou físicas.",
            "Capricórnio": "Foco total na carreira e na escalada de metas a longo prazo.",
            "Aquário": "Inovação e liberdade. Você buscará caminhos fora do convencional.",
            "Peixes": "Um ciclo de sensibilidade aguçada e encerramentos necessários."
        }
    };

    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    try { firebase.initializeApp(firebaseConfig); } catch(e) {}
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
        if(user) {
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                if(doc.exists) {
                    const d = doc.data();
                    document.getElementById('user-name').innerText = d.nome || "Iniciado";
                    processarRevolucao(d);
                }
            });
        } else { window.location.href = "index.html"; }
    });

    async function processarRevolucao(usuario) {
        try {
            if (typeof Astronomy === 'undefined') return setTimeout(() => processarRevolucao(usuario), 500);

            const dataTxt = usuario.dataNascimento || usuario.nascimento;
            const dataNasc = new Date(dataTxt + "T" + (usuario.horaNascimento || "12:00"));
            
            // 1. Obter Longitude do Sol Natal
            const timeNatal = Astronomy.MakeTime(dataNasc);
            const obs = new Astronomy.Observer(DB_COORDS.default.lat, DB_COORDS.default.lon, 0);
            const equNatal = Astronomy.Equator("Sun", timeNatal, obs, true, true);
            const longNatal = Astronomy.Ecliptic(equNatal.vec).elon;

            // 2. Calcular Retorno Solar para 2026
            const anoBusca = 2026;
            let currentJSDate = new Date(anoBusca, dataNasc.getMonth(), dataNasc.getDate() - 1);
            let timeRetorno = Astronomy.MakeTime(currentJSDate);
            
            // Refinamento Iterativo (Correção da falha AddDays)
            for(let i=0; i<10; i++) {
                let equAtu = Astronomy.Equator("Sun", timeRetorno, obs, true, true);
                let longAtu = Astronomy.Ecliptic(equAtu.vec).elon;
                let diff = (longNatal - longAtu + 360) % 360;
                if(diff > 180) diff -= 360;
                
                // Cálculo nativo de milissegundos (Segurança Total)
                let msToAdd = diff * 1.014 * 24 * 60 * 60 * 1000;
                currentJSDate = new Date(currentJSDate.getTime() + msToAdd);
                timeRetorno = Astronomy.MakeTime(currentJSDate);
            }

            // Exibir Início do Ciclo
            document.getElementById('return-date').innerText = currentJSDate.toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});

            // 3. Calcular Ascendente da Revolução
            const msd = Astronomy.SiderealTime(timeRetorno);
            const lst = (msd + DB_COORDS.default.lon / 15.0) * 15;
            const ramc = lst * Math.PI/180;
            const eps = 23.439 * Math.PI/180;
            const latRad = DB_COORDS.default.lat * Math.PI/180;
            let ascRad = Math.atan2(Math.cos(ramc), -Math.sin(ramc)*Math.cos(eps) - Math.tan(latRad)*Math.sin(eps));
            const ascGrau = (ascRad * 180/Math.PI + 360) % 360;
            const signoAsc = SIGNOS[Math.floor(ascGrau / 30)];

            document.getElementById('asc-year').innerText = signoAsc;

            // 4. Renderizar Conteúdo Profundo
            document.getElementById('content-area').innerHTML = `
                <div class="analysis-section">
                    <h3>O Propósito Solar de 2026</h3>
                    <div class="analysis-text">
                        <p>A Revolução Solar indica o tom vibracional do seu ano. Em 2026, seu Sol retorna ao grau exato de sua origem natal (${longNatal.toFixed(2)}°), iniciando um ciclo de renovação vital.</p>
                        <p>Este ano será marcado pela <span class="highlight-gold">reestruturação da sua identidade</span>. Você sentirá um forte chamado para alinhar sua vida prática com os desejos mais profundos da sua alma, removendo o que não é mais autêntico.</p>
                    </div>
                </div>
                <div class="analysis-section">
                    <h3>A Lente do Ano: Ascendente em ${signoAsc}</h3>
                    <div class="analysis-text">
                        <p>O Ascendente anual define como você irá encarar os desafios deste ciclo. Com o Ascendente em <span class="highlight-gold">${signoAsc}</span>, o universo exige uma postura específica de você.</p>
                        <p>${TEXTOS_REVOLUCAO.Ascendente[signoAsc]}</p>
                    </div>
                </div>
                <div class="analysis-section">
                    <h3>Conselho Sistêmico</h3>
                    <div class="analysis-text">
                        <p>Ao observar as órbitas deste ano, percebemos que a fluidez virá através da <span class="highlight-gold">aceitação do tempo natural das coisas</span>. Não tente apressar os resultados; 2026 é um ano de preparo de solo para colheitas monumentais no futuro próximo.</p>
                    </div>
                </div>`;
        } catch (e) {
            console.error(e);
            document.getElementById('content-area').innerHTML = `<p style='color:red; text-align:center;'>Ocorreu uma falha na interpretação das estrelas: ${e.message}</p>`;
        } finally {
            document.getElementById('loading-screen').style.display = 'none';
        }
    }
</script>
</body>
</html>
