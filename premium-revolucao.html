<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Revolução Solar</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <script src="astronomy.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js';"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; }
        body { 
            margin: 0; font-family: 'Cormorant Garamond', serif; 
            background-color: var(--bg-dark);
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            color: #e0e0e0; font-size: 19px; line-height: 1.8; 
        }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { font-size: 4em; color: var(--gold); animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px 100px 20px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 40px; }
        .btn-back { cursor: pointer; color: var(--gold); font-family: 'Cinzel'; text-transform: uppercase; font-size: 0.8em; letter-spacing: 2px; }

        .page-header { text-align: center; margin-bottom: 60px; }
        .page-title { font-family: 'Cinzel'; color: var(--gold); font-size: 3em; margin: 0; text-shadow: 0 0 20px rgba(212,175,55,0.4); }
        .year-highlight { font-family: 'Cinzel'; font-size: 1.5em; color: #fff; margin-top: 10px; display: block; }

        /* CARDS PRINCIPAIS */
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-bottom: 50px; }
        .info-card { background: rgba(15, 15, 15, 0.9); border: 1px solid #333; padding: 30px; border-radius: 8px; text-align: center; border-top: 3px solid var(--gold); }
        .info-label { font-family: 'Cinzel'; font-size: 0.8em; color: #888; text-transform: uppercase; letter-spacing: 2px; }
        .info-value { font-family: 'Cinzel'; font-size: 1.8em; color: var(--gold); margin: 10px 0; }

        /* BLOCOS DE TEXTO PROFUNDO */
        .analysis-section { background: rgba(20, 20, 20, 0.8); border-left: 4px solid var(--gold); padding: 40px; margin-bottom: 40px; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .analysis-section h3 { font-family: 'Cinzel'; color: var(--gold); margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .analysis-text { text-align: justify; color: #ccc; }
        .highlight-gold { color: var(--gold); font-weight: bold; }

        @media(max-width: 600px) { .page-title { font-size: 2em; } }
        @media print { .btn-back, #loading-screen { display: none; } body { background: #fff; color: #000; } }
    </style>
</head>
<body>

<div id="loading-screen">
    <i class="fas fa-sun spinner"></i>
    <p style="color:#666; font-family:'Cinzel'; margin-top:15px; letter-spacing:2px;">Calculando Retorno Solar...</p>
</div>

<div class="container">
    <div class="nav-bar">
        <div class="btn-back" onclick="window.location.href='dashboard-premium.html'">← Voltar ao Hub</div>
        <div style="font-family:'Cinzel'; color:#444;">MAPA DO ANO 2026</div>
    </div>

    <header class="page-header">
        <h1 class="page-title">REVOLUÇÃO SOLAR</h1>
        <span class="year-highlight" id="user-name">Iniciado</span>
        <p style="color:#888; font-style:italic;">A tônica do seu destino para os próximos 12 meses.</p>
    </header>

    <div class="summary-grid">
        <div class="info-card">
            <div class="info-label">Início do Ciclo</div>
            <div class="info-value" id="return-date">--/--/--</div>
            <div style="font-size:0.8em; color:#666;">Momento exato do Retorno Solar</div>
        </div>
        <div class="info-card">
            <div class="info-label">Ascendente do Ano</div>
            <div class="info-value" id="asc-year">Apurando...</div>
            <div style="font-size:0.8em; color:#666;">A lente pela qual você verá o mundo</div>
        </div>
    </div>

    <div id="content-area">
        </div>
</div>

<script>
    // --- LÓGICA DE TI E ASTROLOGIA ---
    const DB_COORDS = { "default": {lat:-15.79, lon:-47.89} };
    const SIGNOS = ["Áries", "Touro", "Gêmeos", "Câncer", "Leão", "Virgem", "Libra", "Escorpião", "Sagitário", "Capricórnio", "Aquário", "Peixes"];

    const TEXTOS_REVOLUCAO = {
        "Ascendente": {
            "Áries": "Este é um ano de afirmação pessoal e novos começos. Você sentirá uma urgência em agir e liderar. A energia é de coragem, mas o desafio é a paciência.",
            "Touro": "O foco do ano é a consolidação material e a busca por conforto. É um período para plantar colheitas de longo prazo e valorizar o que é tangível.",
            "Gêmeos": "Um ciclo de intensa movimentação intelectual, viagens curtas e muitos contatos. Sua curiosidade estará no auge, favorecendo estudos e trocas.",
            "Câncer": "A tônica recai sobre o lar, a família e a segurança emocional. Você buscará raízes e poderá estar mais voltado para suas bases íntimas.",
            "Leão": "Um ano para brilhar e ser visto. Sua criatividade e autoexpressão pedem espaço. É o momento de assumir o seu palco pessoal com confiança.",
            "Virgem": "Período de organização, foco no trabalho e atenção à saúde. A excelência nos detalhes será sua bússola para o sucesso neste ciclo.",
            "Libra": "As parcerias e os relacionamentos ganham destaque total. É um ano para buscar equilíbrio, diplomacia e harmonia em todas as associações.",
            "Escorpião": "Um ciclo de profundas transformações e renascimentos. Você lidará com assuntos intensos e terá o poder de transmutar crises em força.",
            "Sagitário": "Expansão de horizontes, fé e busca por significado. O ano favorece viagens, estudos superiores e uma visão mais otimista da existência.",
            "Capricórnio": "Foco total na carreira, nas responsabilidades e na reputação. É um ano de "escalar a montanha" com disciplina e persistência.",
            "Aquário": "Inovação, projetos sociais e liberdade. Você buscará caminhos não convencionais e se sentirá atraído por grupos que compartilham seus ideais.",
            "Peixes": "Um ciclo de sensibilidade aguçada, espiritualidade e encerramentos. A intuição será sua maior aliada para navegar as águas do subconsciente."
        }
    };

    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    try { firebase.initializeApp(firebaseConfig); } catch(e) {}
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
        if(user) {
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                const d = doc.data();
                if((d.status || "").toLowerCase() === "premium" || (d.plano || "").toLowerCase() === "premium"){
                    document.getElementById('user-name').innerText = d.nome;
                    processarRevolucao(d);
                } else { window.location.href = "dashboard.html"; }
            });
        } else { window.location.href = "index.html"; }
    });

    async function processarRevolucao(usuario) {
        if (typeof Astronomy === 'undefined') return setTimeout(() => processarRevolucao(usuario), 500);

        // 1. Calcular Sol Natal
        const dataNasc = new Date(usuario.dataNascimento + "T" + (usuario.horaNascimento || "12:00"));
        const timeNatal = Astronomy.MakeTime(dataNasc);
        const obs = new Astronomy.Observer(DB_COORDS.default.lat, DB_COORDS.default.lon, 0);
        const equNatal = Astronomy.Equator("Sun", timeNatal, obs, true, true);
        const longNatal = Astronomy.Ecliptic(equNatal.vec).elon;

        // 2. Encontrar Retorno em 2026
        // Simplificação técnica: Busca o momento em que o Sol cruza a longitude natal em 2026
        const anoBusca = 2026;
        let dataTeste = new Date(anoBusca, dataNasc.getMonth(), dataNasc.getDate() - 1);
        let timeRetorno = Astronomy.MakeTime(dataTeste);
        
        // Iteração para precisão de segundos (Refinamento Newton-Raphson simplificado)
        for(let i=0; i<5; i++) {
            let equAtu = Astronomy.Equator("Sun", timeRetorno, obs, true, true);
            let longAtu = Astronomy.Ecliptic(equAtu.vec).elon;
            let diff = (longNatal - longAtu + 360) % 360;
            if(diff > 180) diff -= 360;
            timeRetorno = Astronomy.AddDays(timeRetorno, diff * 1.014); // 1 dia aprox 1 grau
        }

        const dataFinal = timeRetorno.date;
        document.getElementById('return-date').innerText = dataFinal.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});

        // 3. Calcular Ascendente da Revolução
        const msd = Astronomy.SiderealTime(timeRetorno);
        const lst = (msd + DB_COORDS.default.lon / 15.0) * 15;
        const ramc = lst * Math.PI/180;
        const eps = 23.439 * Math.PI/180;
        const latRad = DB_COORDS.default.lat * Math.PI/180;
        let ascRad = Math.atan2(Math.cos(ramc), -Math.sin(ramc)*Math.cos(eps) - Math.tan(latRad)*Math.sin(eps));
        const ascGrau = (ascRad * 180/Math.PI + 360) % 360;
        const signoAscIdx = Math.floor(ascGrau / 30);
        const signoAsc = SIGNOS[signoAscIdx];

        document.getElementById('asc-year').innerText = signoAsc;

        // 4. Renderizar Análise Profunda
        const area = document.getElementById('content-area');
        area.innerHTML = `
            <div class="analysis-section">
                <h3>O Propósito do Ano: Sol na Revolução</h3>
                <div class="analysis-text">
                    <p>O Sol na Revolução Solar indica onde sua energia vital estará concentrada. Em 2026, seu Sol retorna ao grau exato de ${longNatal.toFixed(2)}°, reativando sua essência primordial.</p>
                    <p>Este ano será marcado por um processo de <span class="highlight-gold">reafirmação de identidade</span>. Você sentirá um chamado para alinhar seus projetos externos com o que sua alma realmente deseja expressar. Não é um ano para se esconder, mas para brilhar na área da vida onde você se sente mais autêntico.</p>
                </div>
            </div>

            <div class="analysis-section">
                <h3>A Lente do Ano: Ascendente em ${signoAsc}</h3>
                <div class="analysis-text">
                    <p>O Ascendente da Revolução Solar é o "filtro" através do qual você processará as experiências deste ciclo. Com o Ascendente em <span class="highlight-gold">${signoAsc}</span>, o universo exige de você uma postura específica.</p>
                    <p>${TEXTOS_REVOLUCAO.Ascendente[signoAsc]}</p>
                    <p>Sistemicamente, este posicionamento sugere que as oportunidades virão quando você assumir a responsabilidade por essa energia. Se o Ascendente pede ação, o sucesso virá da iniciativa; se pede diplomacia, virá da conciliação.</p>
                </div>
            </div>

            <div class="analysis-section">
                <h3>Panorama Evolutivo e Síntese</h3>
                <div class="analysis-text">
                    <p>Ao cruzarmos os dados, percebemos que 2026 é um ano de <span class="highlight-gold">transição estrutural</span>. Você está encerrando um ciclo de sete anos e iniciando uma nova oitava de aprendizado. A configuração celeste sugere que o maior desafio será equilibrar suas ambições pessoais com suas necessidades de paz interior.</p>
                    <p><b>Conselho do Portal:</b> Aproveite os primeiros três meses após o seu aniversário para lançar as sementes mais importantes. O céu estará especialmente favorável para novos empreendimentos e mudanças de rota profundas.</p>
                </div>
            </div>
        `;

        document.getElementById('loading-screen').style.display = 'none';
    }
</script>
</body>
</html>
