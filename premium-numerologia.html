<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Numerologia Cabalística</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <script src="numerologia-database.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background: var(--bg-dark); color: #e0e0e0; font-size: 19px; line-height: 1.6; }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { font-size: 4em; color: var(--gold); animation: spin 2s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px 20px 100px 20px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-back { cursor: pointer; color: #666; text-transform: uppercase; font-size: 0.8em; letter-spacing: 2px; transition:0.3s; }
        .btn-back:hover { color: var(--gold); }
        .btn-print { background: var(--gold); color: #000; border: none; padding: 8px 15px; border-radius: 4px; font-family: 'Cinzel'; cursor: pointer; font-weight: bold; }

        .page-header { text-align: center; margin-bottom: 50px; }
        .page-title { font-family: 'Cinzel'; color: var(--gold); font-size: 2.8em; margin: 0; text-shadow: 0 0 20px rgba(212,175,55,0.3); }

        .num-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 60px; }
        .num-card { background: #0a0a0a; border: 1px solid #333; padding: 25px; border-radius: 8px; text-align: center; border-top: 3px solid var(--gold); }
        .num-label { font-family: 'Cinzel'; font-size: 0.75em; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .num-big { font-family: 'Cinzel'; font-size: 4em; color: var(--gold); line-height: 1; margin: 10px 0; }

        .report-block { background: rgba(15, 15, 15, 0.9); border: 1px solid #222; padding: 40px; border-left: 4px solid var(--gold); border-radius: 4px; margin-bottom: 40px; }
        .block-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .block-title { font-family: 'Cinzel'; font-size: 1.5em; color: var(--gold); margin: 0; }
        .block-text { color: #ccc; text-align: justify; }

        .synthesis-box { margin-top: 40px; border: 1px solid var(--gold); padding: 40px; border-radius: 8px; background: radial-gradient(circle, #111, #000); }
        .synthesis-title { font-family: 'Cinzel'; color: var(--gold); text-align: center; margin-bottom: 20px; }

        @media print { .btn-back, .btn-print { display: none; } body { background: #fff; color: #000; } }
    </style>
</head>
<body>

<div id="loading-screen">
    <i class="fas fa-compass spinner"></i>
    <p style="color:#666; font-family:'Cinzel'; margin-top:15px;">Decodificando Vibrações Numéricas...</p>
</div>

<div class="container">
    <div class="nav-bar">
        <div onclick="window.location.href='dashboard-premium.html'" class="btn-back">← Voltar</div>
        <button onclick="window.print()" class="btn-print"><i class="fas fa-print"></i> Imprimir Dossiê</button>
    </div>

    <div class="page-header">
        <h1 class="page-title">DOSSIÊ NUMEROLÓGICO</h1>
        <div id="user-info" style="color:#888; font-family:'Cinzel'; margin-top:10px;"></div>
    </div>

    <div class="num-grid" id="main-grid"></div>
    <div id="report-content"></div>
    
    <div class="synthesis-box" id="synthesis-area" style="display:none">
        <h2 class="synthesis-title">GRANDE SÍNTESE SISTÊMICA</h2>
        <div id="synthesis-text"></div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    try { firebase.initializeApp(firebaseConfig); } catch(e) {}
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
        if(user){
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                const d = doc.data();
                if((d.status || "").toLowerCase() === "premium" || (d.plano || "").toLowerCase() === "premium"){
                    renderizar(d.nome, d.dataNascimento);
                } else { window.location.href = "dashboard.html"; }
            });
        } else { window.location.href = "index.html"; }
    });

    function renderizar(nome, data) {
        document.getElementById('user-info').innerText = `${nome} • ${data}`;
        const res = calcularNumerologia(nome, data);
        
        // 1. Renderizar Cards do Topo
        const grid = document.getElementById('main-grid');
        const cards = [
            {label: "Motivação (Alma)", val: res.motivacao},
            {label: "Impressão (Ego)", val: res.impressao},
            {label: "Missão (Expressão)", val: res.expressao},
            {label: "Caminho de Destino", val: res.destino}
        ];
        grid.innerHTML = cards.map(c => `
            <div class="num-card">
                <div class="num-label">${c.label}</div>
                <div class="num-big">${c.val}</div>
            </div>
        `).join('');

        // 2. Renderizar Relatório (CHAVES CORRIGIDAS AQUI)
        const report = document.getElementById('report-content');
        const blocos = [
            {t: "Motivação da Alma", n: res.motivacao, k: "motiva", icon: "heart"},
            {t: "Impressão do Ego", n: res.impressao, k: "impres", icon: "user"},
            {t: "Missão e Expressão", n: res.expressao, k: "desc", icon: "fingerprint"},
            {t: "Caminho de Destino", n: res.destino, k: "destino", icon: "road"}
        ];

        report.innerHTML = blocos.map(b => {
            const info = TEXTOS_NUMEROS[String(b.n)];
            // Validação de segurança para números não mapeados (como 33)
            if(!info) return `<div class="report-block"><h3>Número ${b.n} em análise.</h3></div>`;
            
            return `
                <div class="report-block">
                    <div class="block-header">
                        <i class="fas fa-${b.icon}" style="color:var(--gold); font-size:1.5em; margin-right:15px;"></i>
                        <h3 class="block-title">${b.t}: ${b.n}</h3>
                    </div>
                    <div class="block-text">
                        <h4 style="color:var(--gold); font-family:'Cinzel'; margin-top:0; border-bottom:1px solid #333; padding-bottom:5px;">
                            Arquétipo: ${info.arquetipo} - ${info.titulo}
                        </h4>
                        ${info[b.k]}
                    </div>
                </div>
            `;
        }).join('');

        // 3. Grande Síntese
        document.getElementById('synthesis-area').style.display = 'block';
        document.getElementById('synthesis-text').innerHTML = `
            <p>Seu <b>Caminho de Destino ${res.destino}</b> define o solo onde você pisa nesta existência. Para trilhar este solo, você utiliza sua <b>Missão ${res.expressao}</b>, que são seus talentos inatos manifestados para o mundo.</p>
            <p>A harmonia real só ocorre quando esses atos externos alimentam sua <b>Vibração da Alma (${res.motivacao})</b>. Se houver divórcio entre o que você faz e o que sua alma pede, o sucesso material será acompanhado de um vazio inexplicável. O segredo da sua plenitude é usar seus dons naturais (${res.expressao}) para cumprir seu propósito de vida (${res.destino}) sem nunca trair os desejos profundos do seu coração (${res.motivacao}).</p>
        `;

        document.getElementById('loading-screen').style.display = 'none';
    }
</script>
</body>
</html>
