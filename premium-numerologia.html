<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Dossiê Numerológico de Elite</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <script src="numerologia-database.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background-color: var(--bg-dark); background-image: url('https://www.transparenttextures.com/patterns/stardust.png'); color: #e0e0e0; font-size: 19px; line-height: 1.8; }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { font-size: 4em; color: var(--gold); animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px 100px 20px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 40px; }
        .btn-back { cursor: pointer; color: #666; text-transform: uppercase; font-size: 0.8em; letter-spacing: 2px; text-decoration: none; transition: 0.3s; }
        .btn-back:hover { color: var(--gold); }

        .page-header { text-align: center; margin-bottom: 60px; }
        .page-title { font-family: 'Cinzel'; color: var(--gold); font-size: 3em; margin: 0; text-shadow: 0 0 30px rgba(212,175,55,0.4); letter-spacing: 4px; }
        .user-info-text { color: #888; font-family: 'Cinzel'; margin-top: 15px; letter-spacing: 2px; }

        .num-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 60px; }
        .num-card { background: #0a0a0a; border: 1px solid #333; padding: 30px; border-radius: 8px; text-align: center; border-top: 4px solid var(--gold); box-shadow: 0 10px 25px rgba(0,0,0,0.4); transition: 0.3s; }
        .num-card:hover { transform: translateY(-5px); border-color: #fff; }
        .num-label { font-family: 'Cinzel'; font-size: 0.7em; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        .num-big { font-family: 'Cinzel'; font-size: 4.5em; color: var(--gold); line-height: 1; margin: 15px 0; text-shadow: 0 0 15px rgba(212,175,55,0.3); }

        .report-block { background: rgba(15, 15, 15, 0.95); border: 1px solid #222; padding: 50px; border-left: 6px solid var(--gold); border-radius: 4px; margin-bottom: 45px; box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
        .block-header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        .block-title { font-family: 'Cinzel'; font-size: 1.8em; color: var(--gold); margin: 0; text-transform: uppercase; }
        .block-text { color: #ccc; text-align: justify; font-size: 1.1em; line-height: 2; }
        .highlight { color: #fff; font-weight: bold; border-bottom: 1px solid var(--gold); }

        .synthesis-section { margin-top: 80px; border: 2px solid var(--gold); padding: 60px; border-radius: 12px; background: radial-gradient(circle, #1a1a1a, #000); box-shadow: 0 0 60px rgba(212,175,55,0.1); }
        .synthesis-title { font-family: 'Cinzel'; color: var(--gold); text-align: center; margin-bottom: 40px; font-size: 2.5em; letter-spacing: 5px; }

        @media(max-width: 600px) { .num-grid { grid-template-columns: 1fr; } .block-header { flex-direction: column; text-align: center; } .page-title { font-size: 2em; } }
    </style>
</head>
<body>

<div id="loading-screen">
    <i class="fas fa-fingerprint spinner"></i>
    <p style="color:#666; font-family:'Cinzel'; margin-top:15px; letter-spacing:3px;">Codificando Matriz Numérica...</p>
</div>

<div class="container">
    <div class="nav-bar">
        <a href="dashboard-premium.html" class="btn-back">← Retornar ao Hub</a>
        <button onclick="window.print()" style="background:var(--gold); border:none; padding:8px 20px; font-family:'Cinzel'; font-weight:bold; cursor:pointer; border-radius:4px;"><i class="fas fa-print"></i> PDF</button>
    </div>

    <div class="page-header">
        <h1 class="page-title">SISTEMA NUMEROLÓGICO</h1>
        <div id="user-info-display" class="user-info-text">...</div>
    </div>

    <div class="num-grid" id="main-grid"></div>
    <div id="report-content"></div>
    
    <div class="synthesis-section">
        <h2 class="synthesis-title">A LEI DA HARMONIA</h2>
        <div id="final-essay" class="block-text"></div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    try { firebase.initializeApp(firebaseConfig); } catch(e) {}
    const auth = firebase.auth();
    const db = firebase.firestore();

    function carregarDados(user) {
        db.collection("usuarios").doc(user.uid).get().then(doc => {
            if(doc.exists) {
                const d = doc.data();
                document.getElementById('user-info-display').innerText = `${d.nome.toUpperCase()} • NASCIDO EM ${d.dataNascimento}`;
                const res = calcularNumerologia(d.nome, d.dataNascimento);
                renderizarInterface(res, d.nome);
            }
        });
    }

    function renderizarInterface(res, nome) {
        const grid = document.getElementById('main-grid');
        const cards = [
            {l: "Motivação (Alma)", v: res.motivacao},
            {l: "Impressão (Ego)", v: res.impressao},
            {l: "Missão (Expressão)", v: res.expressao},
            {l: "Caminho de Destino", v: res.destino}
        ];
        
        grid.innerHTML = cards.map(c => `
            <div class="num-card">
                <div class="num-label">${c.l}</div>
                <div class="num-big">${c.v}</div>
            </div>
        `).join('');

        const report = document.getElementById('report-content');
        const sections = [
            {t: "Vibração da Alma", n: res.motivacao, key: "motiva", icon: "heart"},
            {t: "Imagem Externa", n: res.impressao, key: "impres", icon: "eye"},
            {t: "Ferramenta de Vida", n: res.expressao, key: "desc", icon: "hammer"},
            {t: "Caminho de Destino", n: res.destino, key: "destino", icon: "road"}
        ];

        report.innerHTML = sections.map(s => {
            const info = TEXTOS_NUMEROS[String(s.n)];
            if(!info) return "";
            return `
                <div class="report-block">
                    <div class="block-header">
                        <i class="fas fa-${s.icon}" style="color:var(--gold); font-size:2em;"></i>
                        <h3 class="block-title">${s.t}: ${s.n}</h3>
                    </div>
                    <div class="block-text">
                        <h4 style="font-family:'Cinzel'; color:var(--gold); margin-top:0;">ARQUÉTIPO: ${info.arquetipo.toUpperCase()}</h4>
                        ${info[s.key]}
                    </div>
                </div>
            `;
        }).join('');

        // GRANDE SÍNTESE PROFUNDA
        document.getElementById('final-essay').innerHTML = `
            <p>O dossiê de <span class="highlight">${nome}</span> revela uma engenharia vibracional específica. Seu <span class="highlight">Caminho de Destino ${res.destino}</span> define o cenário obrigatório de aprendizado nesta vida, enquanto sua <span class="highlight">Missão ${res.expressao}</span> entrega as armas e talentos para vencer as batalhas deste solo.</p>
            <p>O grande conflito humano, no entanto, nasce do divórcio entre o Ego (${res.impressao}) e a Alma (${res.motivacao}). Sua alma pede a vibração do número ${res.motivacao}, um desejo silencioso que muitas vezes é abafado pelas exigências sociais. A harmonia suprema só será alcançada quando você alinhar seus atos externos com este chamado interno.</p>
            <p>Para 2026, a numerologia cabalística indica que a integração destes quatro pilares será o divisor de águas entre a sobrevivência e a plenitude espiritual.</p>
        `;

        document.getElementById('loading-screen').style.opacity = '0';
        setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 800);
    }

    auth.onAuthStateChanged(user => { if(user) carregarDados(user); else window.location.href="index.html"; });
</script>
</body>
</html>
