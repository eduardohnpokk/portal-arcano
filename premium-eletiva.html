<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Datas de Poder</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; --success: #28a745; --danger: #dc3545; }
        body { 
            margin: 0; font-family: 'Cormorant Garamond', serif; 
            background-color: var(--bg-dark);
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            color: #e0e0e0; font-size: 18px; line-height: 1.6; 
        }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { font-size: 4em; color: var(--gold); animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 40px; }
        .btn-back { cursor: pointer; color: var(--gold); font-family: 'Cinzel'; text-transform: uppercase; font-size: 0.8em; letter-spacing: 2px; text-decoration: none; }

        .page-header { text-align: center; margin-bottom: 50px; }
        .page-title { font-family: 'Cinzel'; color: var(--gold); font-size: 2.8em; margin: 0; text-shadow: 0 0 20px rgba(212,175,55,0.4); }

        /* CALENDÁRIO */
        .calendar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .day-card { 
            background: rgba(15, 15, 15, 0.95); border: 1px solid #333; 
            padding: 20px; border-radius: 8px; transition: 0.3s;
            position: relative; overflow: hidden;
        }
        .day-card:hover { border-color: var(--gold); transform: translateY(-3px); }
        .day-card.today { border: 2px solid var(--gold); box-shadow: 0 0 20px rgba(212,175,55,0.2); }

        .date-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .date-num { font-family: 'Cinzel'; font-size: 1.4em; color: var(--gold); }
        .moon-phase { font-size: 1.2em; }

        .score-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 0.9em; }
        .score-bar-bg { flex-grow: 1; height: 4px; background: #222; margin: 0 10px; border-radius: 2px; position: relative; }
        .score-bar-fill { height: 100%; background: var(--gold); border-radius: 2px; }
        .score-label { width: 80px; font-family: 'Cinzel'; font-size: 0.7em; color: #888; }

        .warning-box { background: rgba(220, 53, 69, 0.1); border: 1px solid var(--danger); color: var(--danger); padding: 10px; border-radius: 4px; font-size: 0.8em; margin-top: 15px; text-align: center; }
        .mercury-retro { font-family: 'Cinzel'; font-weight: bold; }

        @media(max-width: 600px) { .page-title { font-size: 1.8em; } }
    </style>
</head>
<body>

<div id="loading-screen">
    <i class="fas fa-calendar-alt spinner"></i>
    <p style="color:#666; font-family:'Cinzel'; margin-top:15px; letter-spacing:2px;">Escaneando Portais Temporais...</p>
</div>

<div class="container">
    <nav class="nav-bar">
        <a href="dashboard-premium.html" class="btn-back">← Voltar ao Hub</a>
        <div style="font-family:'Cinzel'; color:#444;">CALENDÁRIO ELETIVO 2026</div>
    </nav>

    <header class="page-header">
        <h1 class="page-title">DATAS DE PODER</h1>
        <p style="color:#888; font-style:italic;">Identifique o momento exato para cada ação importante.</p>
    </header>

    <div id="calendar-container" class="calendar-grid"></div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    try { firebase.initializeApp(firebaseConfig); } catch(e) {}
    const auth = firebase.auth();
    const db = firebase.firestore();

    const MOON_ICONS = ["🌑", "🌒", "🌓", "🌔", "🌕", "🌖", "🌗", "🌘"];
    const SIGNOS = ["Áries", "Touro", "Gêmeos", "Câncer", "Leão", "Virgem", "Libra", "Escorpião", "Sagitário", "Capricórnio", "Aquário", "Peixes"];

    auth.onAuthStateChanged(user => {
        if(user) {
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                if(doc.exists) {
                    const d = doc.data();
                    if((d.status || "").toLowerCase() === "premium" || (d.plano || "").toLowerCase() === "premium"){
                        gerarCalendario();
                    } else { window.location.href = "dashboard.html"; }
                }
            });
        } else { window.location.href = "index.html"; }
    });

    function getMoonPhaseIcon(angle) {
        const index = Math.floor(((angle + 22.5) % 360) / 45);
        return MOON_ICONS[index % 8];
    }

    function calcularEletiva(data) {
        const time = Astronomy.MakeTime(data);
        const obs = new Astronomy.Observer(-23.55, -46.63, 0); 
        
        const phase = Astronomy.MoonPhase(time);
        const equLua = Astronomy.Equator("Moon", time, obs, true, true);
        const longLua = Astronomy.Ecliptic(equLua.vec).elon;
        const signoLuaIdx = Math.floor(longLua / 30);
        
        // Simulação de Retrógrado (Baseado no calendário de 2026)
        const isMercuryRetro = (data.getMonth() === 1); 

        let scores = { biz: 50, love: 50, health: 50 };

        // Lógica de Fases da Lua
        if(phase < 90) scores.biz += 20; 
        if(phase > 180 && phase < 270) scores.health += 25; 

        // Lógica de Signos da Lua (Ajustada cirurgicamente)
        if([1, 3, 9].includes(signoLuaIdx)) scores.biz += 15; // Touro, Câncer, Capricórnio favorecem estabilidade
        if([4, 6].includes(signoLuaIdx)) scores.love += 20;  // Leão e Libra favorecem romances
        if([7, 11].includes(signoLuaIdx)) scores.health += 10; // Escorpião e Peixes para cura emocional

        if(isMercuryRetro) {
            scores.biz = Math.max(scores.biz - 40, 10);
        }

        return {
            phaseIcon: getMoonPhaseIcon(phase),
            signoLua: SIGNOS[signoLuaIdx],
            isMercuryRetro: isMercuryRetro,
            scores: scores
        };
    }

    function gerarCalendario() {
        const container = document.getElementById('calendar-container');
        if(!container) return;
        
        container.innerHTML = "";
        const hoje = new Date();
        
        for(let i=0; i<30; i++) {
            const dataAlvo = new Date(hoje.getTime() + (i * 24 * 60 * 60 * 1000));
            const info = calcularEletiva(dataAlvo);
            
            const card = document.createElement('div');
            card.className = `day-card ${i === 0 ? 'today' : ''}`;
            
            card.innerHTML = `
                <div class="date-header">
                    <div class="date-num">${dataAlvo.getDate()}/${dataAlvo.getMonth()+1}</div>
                    <div class="moon-phase" title="Lua em ${info.signoLua}">${info.phaseIcon}</div>
                </div>
                
                <div class="score-row">
                    <span class="score-label">Negócios</span>
                    <div class="score-bar-bg"><div class="score-bar-fill" style="width:${info.scores.biz}%"></div></div>
                    <span style="font-size:0.7em">${info.scores.biz}%</span>
                </div>
                <div class="score-row">
                    <span class="score-label">Amor</span>
                    <div class="score-bar-bg"><div class="score-bar-fill" style="width:${info.scores.love}%"></div></div>
                    <span style="font-size:0.7em">${info.scores.love}%</span>
                </div>
                <div class="score-row">
                    <span class="score-label">Saúde</span>
                    <div class="score-bar-bg"><div class="score-bar-fill" style="width:${info.scores.health}%"></div></div>
                    <span style="font-size:0.7em">${info.scores.health}%</span>
                </div>

                ${info.isMercuryRetro ? `
                    <div class="warning-box">
                        <i class="fas fa-exclamation-triangle"></i> 
                        <span class="mercury-retro">Mercúrio Retrógrado</span><br>
                        Atenção a contratos e eletrônicos.
                    </div>
                ` : ''}
            `;
            container.appendChild(card);
        }
        document.getElementById('loading-screen').style.display = 'none';
    }
</script>
</body>
</html>
