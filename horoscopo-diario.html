        .container { max-width: 900px; margin: 0 auto; padding: 20px 20px 100px 20px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid #222; padding-bottom: 20px; }

        .date-display { text-align: center; margin-bottom: 40px; }
        .today-label { font-family: 'Cinzel'; color: #666; letter-spacing: 3px; font-size: 0.9em; text-transform: uppercase; }
        .current-date { font-family: 'Cinzel'; color: var(--gold); font-size: 2.5em; margin: 10px 0; text-shadow: 0 0 15px rgba(212,175,55,0.3); }

        /* SEÇÃO DE DESTAQUE (LUA) */
        .moon-section { 
            background: linear-gradient(135deg, #1a1a1a 0%, #050505 100%); 
            border: 1px solid var(--gold); border-radius: 8px; padding: 30px; 
            display: flex; align-items: center; gap: 30px; margin-bottom: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .moon-icon { font-size: 4em; color: #fff; text-shadow: 0 0 20px #fff; }
        .moon-info h3 { margin: 0; color: var(--gold); font-family: 'Cinzel'; font-size: 1.5em; }
        
        /* CARDS DE TRÂNSITOS */
        .transits-grid { display: grid; gap: 30px; }
        .transit-card { 
            background: #111; border-left: 4px solid #333; padding: 25px; 
            border-radius: 4px; transition: transform 0.3s;
        }
        .transit-card:hover { transform: translateX(10px); border-left-color: var(--gold); background: #161616; }
        
        .planet-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .p-icon { font-size: 1.8em; color: var(--gold); }
        .p-name { font-family: 'Cinzel'; font-size: 1.3em; color: #fff; }
        .house-badge { background: #222; color: #888; padding: 2px 10px; border-radius: 10px; font-size: 0.8em; margin-left: auto; border: 1px solid #333; }
        
        .impact-text { color: #ccc; text-align: justify; margin-bottom: 10px; }
        .advice-text { color: #d4af37; font-style: italic; font-size: 0.95em; border-top: 1px solid #222; padding-top: 10px; margin-top: 15px; display: block; }

        @media(max-width: 600px) { 
            .moon-section { flex-direction: column; text-align: center; } 
            .current-date { font-size: 1.8em; }
        }

            "Restrição financeira. O dinheiro exige trabalho duro e economia. Não é hora de gastar, mas de estruturar.", // Casa 2
            "Mente séria e preocupada. Comunicação difícil ou bloqueada. Estude algo difícil e fale pouco.", // Casa 3
            "Peso familiar. Responsabilidades com pais ou problemas estruturais na casa. O passado cobra a conta.", // Casa 4
            "Bloqueio criativo ou frieza no romance. A diversão parece obrigação. Leve a sério seus hobbies ou filhos.", // Casa 5

            "O ápice da cobrança. Chefes exigentes e muito trabalho. Sua reputação está sendo testada. Aguente firme.", // Casa 10

    // --- 2. CONFIGURAÇÃO BÁSICA ---
    const DB_COORDS = { "sp": {lat:-23.55, lon:-46.63}, "rj": {lat:-22.90, lon:-43.17}, "default": {lat:-15.79, lon:-47.89} };
    const SIGNOS = ["Áries", "Touro", "Gêmeos", "Câncer", "Leão", "Virgem", "Libra", "Escorpião", "Sagitário", "Capricórnio", "Aquário", "Peixes"];
    
    // --- 3. LÓGICA ASTRONÔMICA DE TRÂNSITOS ---
    function calcularTransitos(usuario) {
        if (typeof Astronomy === 'undefined') return setTimeout(() => calcularTransitos(usuario), 500);

        // A. Calcular ASCENDENTE NATAL (O ponto de partida)
        const dataNasc = new Date(usuario.dataNascimento + "T" + usuario.horaNascimento);
        const coords = DB_COORDS[usuario.estado?.toLowerCase()] || DB_COORDS["default"];
        
        const dateNatal = Astronomy.MakeTime(dataNasc);
        const observer = new Astronomy.Observer(coords.lat, coords.lon, 0);
        
        // Cálculo Sideral do Ascendente Natal
        const msd = Astronomy.SiderealTime(dateNatal);
        const lst = (msd + coords.lon / 15.0) * 15;
        const ramc = lst * Math.PI/180;
        const eps = 23.439 * Math.PI/180;
        const latRad = coords.lat * Math.PI/180;
        let ascRad = Math.atan2(Math.cos(ramc), -Math.sin(ramc)*Math.cos(eps) - Math.tan(latRad)*Math.sin(eps));
        const ascGrauNatal = (ascRad * 180/Math.PI + 360) % 360;

        // B. Calcular PLANETAS AGORA (Trânsitos)
        const agora = new Date();
        const dateAgora = Astronomy.MakeTime(agora);
        
        // Exibir Data
        document.getElementById('display-date').innerText = agora.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });

        const listaPlanetas = ["Sol", "Mercúrio", "Vênus", "Marte", "Júpiter", "Saturno"]; // Lua é separada
        const nomesIngles = {"Sol":"Sun", "Mercúrio":"Mercury", "Vênus":"Venus", "Marte":"Mars", "Júpiter":"Jupiter", "Saturno":"Saturn"};
        const htmlTransitos = document.getElementById('transits-list');
        htmlTransitos.innerHTML = "";

        // 1. Processar LUA (Clima Astral)
        const equLua = Astronomy.Equator("Moon", dateAgora, observer, true, true);
        const longLua = Astronomy.Ecliptic(equLua.vec).elon;
        const signoLuaIdx = Math.floor(longLua / 30);
        
        // Onde a Lua cai no mapa da pessoa (Casa)
        let distLua = (longLua - ascGrauNatal + 360) % 360;
        let casaLua = Math.floor(distLua / 30) + 1;

        document.getElementById('moon-widget').innerHTML = `
            <div class="moon-icon">🌑</div>
            <div class="moon-info">
                <h3>A Lua Hoje está em ${SIGNOS[signoLuaIdx]}</h3>
                <p style="color:#ccc; margin-top:5px;">
                    Ela transita pela sua <strong>Casa ${casaLua}</strong>. 
                    O clima emocional do seu dia está focado em: <span style="color:var(--gold)">${getAssuntoCasa(casaLua)}</span>.
                </p>
            </div>
        `;

        // 2. Processar PLANETAS
        listaPlanetas.forEach(pNome => {
            const pKey = nomesIngles[pNome];
            const equ = Astronomy.Equator(pKey, dateAgora, observer, true, true);
            const long = Astronomy.Ecliptic(equ.vec).elon;
            
            // Cálculo da Casa de Trânsito (Long Atual - Asc Natal)
            let distancia = (long - ascGrauNatal + 360) % 360;
            let casaTransito = Math.floor(distancia / 30) + 1; // 1 a 12
            
            // Pega o Texto do Banco de Dados
            // O array tem index 0-11, então casaTransito - 1
            const textoImpacto = TRANSIT_DB[pNome][casaTransito - 1];
            
            // Renderiza Card
            const icons = {"Sol":"☉", "Mercúrio":"☿", "Vênus":"♀", "Marte":"♂", "Júpiter":"♃", "Saturno":"♄"};
            
            htmlTransitos.innerHTML += `
                <div class="transit-card">
                    <div class="planet-header">
                        <span class="p-icon">${icons[pNome]}</span>
                        <span class="p-name">${pNome}</span>
                        <span class="house-badge">Ativando Casa ${casaTransito}</span>
                    </div>
                    <div class="impact-text">${textoImpacto}</div>
                    <span class="advice-text">Dica do Oráculo: Use essa energia a seu favor.</span>
                </div>
            `;
        });

        document.getElementById('loading-screen').style.display = 'none';
    }

    function getAssuntoCasa(num) {
        const assuntos = ["Identidade e Corpo", "Finanças e Valores", "Comunicação e Trocas", "Lar e Família", "Criatividade e Romance", "Rotina e Saúde", "Parcerias e Casamento", "Transformação e Crises", "Viagens e Expansão", "Carreira e Status", "Amigos e Futuro", "Inconsciente e Espiritualidade"];
        return assuntos[num-1];
    }

    // --- 4. FIREBASE AUTH ---
    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    try { firebase.initializeApp(firebaseConfig); } catch(e) {}
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
        if(user){
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                const d = doc.exists ? doc.data() : {};
                const status = (d.status || "").toLowerCase();
                const plano = (d.plano || "").toLowerCase();
                
                if(status !== "premium" && plano !== "premium") {
                    alert("Acesso exclusivo para membros Premium.");
                    window.location.href = 'dashboard.html';
                    return;
                }

                calcularTransitos(d);

            }).catch(e => window.location.href = 'index.html');
        } else { window.location.href = 'index.html'; }
    });
