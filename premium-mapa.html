<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Mapa Astral de Elite</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background-color: var(--bg-dark); background-image: url('https://www.transparenttextures.com/patterns/stardust.png'); color: #e0e0e0; font-size: 19px; line-height: 1.8; overflow-x: hidden; }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s; }
        .spinner { font-size: 4em; color: var(--gold); animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px 100px 20px; position: relative; z-index: 1; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid #222; padding-bottom: 20px; }
        .btn-back { cursor: pointer; color: #666; text-transform: uppercase; font-size: 0.8em; letter-spacing: 2px; text-decoration: none; transition: 0.3s; }
        .btn-back:hover { color: var(--gold); }
        .btn-print { background: var(--gold); color: #000; border: none; padding: 10px 25px; border-radius: 4px; font-family: 'Cinzel'; cursor: pointer; font-weight: bold; letter-spacing: 1px; }

        .page-header { text-align: center; margin-bottom: 50px; }
        .page-title { font-family: 'Cinzel'; color: var(--gold); font-size: 3.2em; margin: 0; text-shadow: 0 0 30px rgba(212,175,55,0.4); letter-spacing: 4px; }
        .user-details { color: #888; font-family: 'Cinzel'; font-size: 0.9em; letter-spacing: 2px; margin-top: 10px; }

        .mandala-box { display: flex; justify-content: center; margin: 60px 0; }
        .mandala-svg { width: 100%; max-width: 550px; filter: drop-shadow(0 0 25px rgba(212,175,55,0.2)); animation: fadeIn 2s ease-out; }

        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 60px; }
        .panel { background: rgba(15, 15, 15, 0.95); border: 1px solid #333; border-radius: 8px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .panel-header { background: #1a1a1a; padding: 18px; border-bottom: 1px solid var(--gold); font-family: 'Cinzel'; color: var(--gold); text-align: center; letter-spacing: 3px; }
        .row { display: flex; justify-content: space-between; padding: 15px 25px; border-bottom: 1px solid #222; font-size: 0.9em; }
        .row:last-child { border-bottom: none; }
        
        .deep-analysis { display: flex; flex-direction: column; gap: 50px; }
        .planet-block { background: rgba(20, 20, 20, 0.85); border: 1px solid #333; border-left: 6px solid var(--gold); padding: 45px; border-radius: 4px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .planet-title { font-family: 'Cinzel'; font-size: 2em; color: #fff; margin: 0 0 20px 0; border-bottom: 1px solid #444; padding-bottom: 15px; display: flex; align-items: center; gap: 20px; }
        .planet-icon { color: var(--gold); font-size: 1.5em; }
        
        .analysis-text { text-align: justify; color: #ccc; font-size: 1.15em; line-height: 2; }
        .highlight { color: var(--gold); font-weight: bold; }

        .synthesis-card { background: radial-gradient(circle, #1a1a1a, #000); border: 2px solid var(--gold); padding: 60px; border-radius: 12px; margin-top: 80px; text-align: center; box-shadow: 0 0 60px rgba(212,175,55,0.1); }
        .synthesis-title { font-family: 'Cinzel'; font-size: 2.5em; color: var(--gold); margin-bottom: 40px; letter-spacing: 5px; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @media(max-width: 768px) { .data-grid { grid-template-columns: 1fr; } .planet-block { padding: 30px; } .page-title { font-size: 2.2em; } }
        @media print { .btn-back, .btn-print, #loading-screen { display: none; } body { background: #fff; color: #000; } .panel, .planet-block, .synthesis-card { border: 1px solid #000; background: #fff; color: #000; box-shadow: none; } .highlight, .planet-title { color: #000 !important; } }
    </style>
</head>
<body>

<div id="loading-screen">
    <i class="fas fa-dharmachakra spinner"></i>
    <p style="color:#666; font-family:'Cinzel'; margin-top:15px; letter-spacing:3px;">Calculando Mandalas Akáshicas...</p>
</div>

<div class="container">
    <nav class="nav-bar">
        <a href="dashboard-premium.html" class="btn-back">← Voltar ao Portal</a>
        <button onclick="window.print()" class="btn-print"><i class="fas fa-print"></i> Dossiê de Impressão</button>
    </nav>

    <header class="page-header">
        <h1 class="page-title">DOSSIÊ MAPA NATAL</h1>
        <div class="user-details" id="user-header">...</div>
    </header>

    <div class="mandala-box" id="mandala-area"></div>

    <div class="data-grid">
        <div class="panel">
            <div class="panel-header">Posições Celestiais</div>
            <div id="list-planets"></div>
        </div>
        <div class="panel">
            <div class="panel-header">Domínios (Casas)</div>
            <div id="list-houses"></div>
        </div>
    </div>

    <h2 style="text-align:center; color:var(--gold); font-family:'Cinzel'; font-size:2.2em; margin-bottom:50px; letter-spacing:3px;">O LIVRO DA ALMA</h2>
    <div class="deep-analysis" id="analysis-container"></div>

    <div class="synthesis-card">
        <h2 class="synthesis-title">GRANDE SÍNTESE</h2>
        <div class="analysis-text" id="final-synthesis"></div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    try { firebase.initializeApp(firebaseConfig); } catch(e) {}
    const auth = firebase.auth();
    const db = firebase.firestore();

    const SIGNOS = ["Áries", "Touro", "Gêmeos", "Câncer", "Leão", "Virgem", "Libra", "Escorpião", "Sagitário", "Capricórnio", "Aquário", "Peixes"];
    const ICONS = {"Sol":"☉", "Lua":"☽", "Mercúrio":"☿", "Vênus":"♀", "Marte":"♂", "Júpiter":"♃", "Saturno":"♄", "Urano":"♅", "Netuno":"♆", "Plutão":"♇"};
    const GLYPHS = ["♈", "♉", "♊", "♋", "♌", "♍", "♎", "♏", "♐", "♑", "♒", "♓"];

    // BANCO DE DADOS DE INTERPRETAÇÃO PROFUNDA (ESTILO DOSSIÊ)
    const INTERP_DB = {
        "Sol": { 
            titulo: "O Propósito Central do Espírito", 
            intro: "O Sol é o núcleo atômico da sua identidade. Ele define onde sua luz deve brilhar para que você se sinta vivo.",
            shadow: "Cuidado com o orgulho cego e a necessidade de validação externa constante.",
            light: "Sua força reside na capacidade de liderar através do exemplo e da autenticidade pura."
        },
        "Lua": { 
            titulo: "O Oceano do Inconsciente e Emoção", 
            intro: "A Lua rege sua segurança emocional, sua ancestralidade e como sua alma 'bebe' conforto do mundo.",
            shadow: "Tendência a se perder em flutuações de humor e medos infantis de abandono.",
            light: "Sua intuição é sua maior bússola; quando em paz, você é um curador nato para os outros."
        },
        "Ascendente": {
            titulo: "A Persona e o Portal de Entrada",
            intro: "O Ascendente é como o mundo te lê. É a armadura que você veste para cumprir o contrato do seu Sol.",
            shadow: "O risco de se tornar refém da imagem que os outros projetam sobre você.",
            light: "É a chave para iniciar projetos com sucesso e integrar sua essência à realidade material."
        }
    };

    function processarMapa(usuario) {
        try {
            if (typeof Astronomy === 'undefined') return setTimeout(() => processarMapa(usuario), 300);

            const dataTxt = usuario.dataNascimento || "2000-01-01";
            const horaTxt = usuario.horaNascimento || "12:00";
            const dataFull = new Date(dataTxt + "T" + horaTxt);
            const time = Astronomy.MakeTime(dataFull);
            
            // Geolocalização fallback (São Paulo se não houver no cadastro)
            const lat = usuario.latitude || -23.55;
            const lon = usuario.longitude || -46.63;
            const obs = new Astronomy.Observer(lat, lon, 0);

            document.getElementById('user-header').innerText = `${usuario.nome.toUpperCase()} • ${dataTxt} às ${horaTxt} • ${usuario.cidade || 'Localização Padrão'}`;

            const planetas = [];
            const corpos = ["Sun", "Moon", "Mercury", "Venus", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune", "Pluto"];
            const nomesPT = {"Sun":"Sol", "Moon":"Lua", "Mercury":"Mercúrio", "Venus":"Vênus", "Mars":"Marte", "Jupiter":"Júpiter", "Saturn":"Saturno", "Uranus":"Urano", "Neptune":"Netuno", "Pluto":"Plutão"};

            corpos.forEach(c => {
                const equ = Astronomy.Equator(c, time, obs, true, true);
                const long = Astronomy.Ecliptic(equ.vec).elon;
                planetas.push({ nome: nomesPT[c], grau: long, sIdx: Math.floor(long / 30) });
            });

            // Cálculo do Ascendente
            const sidereal = Astronomy.SiderealTime(time);
            const lst = (sidereal + lon / 15.0) * 15;
            const ramc = lst * Math.PI/180;
            const eps = 23.439 * Math.PI/180;
            const latRad = lat * Math.PI/180;
            let ascRad = Math.atan2(Math.cos(ramc), -Math.sin(ramc)*Math.cos(eps) - Math.tan(latRad)*Math.sin(eps));
            const ascGrau = (ascRad * 180/Math.PI + 360) % 360;
            const ascIdx = Math.floor(ascGrau / 30);

            renderizarSVG(planetas, ascGrau);
            renderizarListas(planetas, ascGrau);
            renderizarTextoProfundo(planetas, ascIdx, usuario.nome);

        } catch (e) {
            console.error(e);
            document.getElementById('loading-screen').style.display = 'none';
        }
    }

    function renderizarSVG(planetas, asc) {
        const cx=250, cy=250, r=220;
        let svg = `<svg viewBox="0 0 500 500" class="mandala-svg">
            <circle cx="${cx}" cy="${cy}" r="${r}" stroke="var(--gold)" stroke-width="2" fill="none" opacity="0.5"/>
            <circle cx="${cx}" cy="${cy}" r="${r*0.7}" stroke="#222" stroke-width="1" fill="none"/>`;
        
        for(let i=0; i<12; i++) {
            const rad = (i * 30 + 180) * Math.PI / 180;
            const x2 = cx + r * Math.cos(rad);
            const y2 = cy + r * Math.sin(rad);
            svg += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#1a1a1a" stroke-width="1"/>`;
            
            const textRad = (i * 30 + 15 + 180) * Math.PI / 180;
            const tx = cx + r * 0.85 * Math.cos(textRad);
            const ty = cy + r * 0.85 * Math.sin(textRad);
            svg += `<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle" fill="var(--gold)" font-size="18">${GLYPHS[i]}</text>`;
        }

        planetas.forEach((p, idx) => {
            const posRel = (p.grau - asc + 360) % 360;
            const rad = (posRel + 180) * Math.PI / 180;
            const dist = r * 0.55 - (idx * 5);
            const px = cx + dist * Math.cos(rad);
            const py = cy + dist * Math.sin(rad);
            svg += `<text x="${px}" y="${py}" text-anchor="middle" fill="#fff" font-size="14" style="filter:drop-shadow(0 0 2px #000)">${ICONS[p.nome]}</text>`;
        });

        svg += `</svg>`;
        document.getElementById('mandala-area').innerHTML = svg;
    }

    function renderizarListas(planetas, asc) {
        const pList = document.getElementById('list-planets');
        const hList = document.getElementById('list-houses');
        
        pList.innerHTML = planetas.map(p => `
            <div class="row"><div class="lbl">${ICONS[p.nome]} ${p.nome}</div><div class="val">${SIGNOS[p.sIdx]} (${Math.floor(p.grau % 30)}°)</div></div>
        `).join('');

        hList.innerHTML = Array.from({length: 12}, (_, i) => `
            <div class="row"><div class="lbl">Casa ${i+1}</div><div class="val">${SIGNOS[(Math.floor(asc/30) + i) % 12]}</div></div>
        `).join('');
    }

    function renderizarTextoProfundo(planetas, ascIdx, nome) {
        const container = document.getElementById('analysis-container');
        const sol = planetas[0];
        const lua = planetas[1];

        // LOGICA DE SÍNTESE MASTER
        container.innerHTML = `
            <div class="planet-block">
                <h3 class="planet-title"><span class="planet-icon">${ICONS.Sol}</span> ${INTERP_DB.Sol.titulo}</h3>
                <p class="analysis-text">
                    Ao nascer com o <span class="highlight">Sol em ${SIGNOS[sol.sIdx]}</span>, sua consciência carrega a missão de expressar os atributos deste signo de forma visceral. ${INTERP_DB.Sol.intro}<br><br>
                    <span class="highlight">O Dom de Luz:</span> ${INTERP_DB.Sol.light}<br>
                    <span class="highlight">A Prova de Sombra:</span> ${INTERP_DB.Sol.shadow}
                </p>
            </div>
            <div class="planet-block">
                <h3 class="planet-title"><span class="planet-icon">${ICONS.Lua}</span> ${INTERP_DB.Lua.titulo}</h3>
                <p class="analysis-text">
                    Sua <span class="highlight">Lua em ${SIGNOS[lua.sIdx]}</span> revela que sua segurança emocional depende da estabilidade destas águas. ${INTERP_DB.Lua.intro}<br><br>
                    <span class="highlight">Equilíbrio:</span> ${INTERP_DB.Lua.light}<br>
                    <span class="highlight">Desafio:</span> ${INTERP_DB.Lua.shadow}
                </p>
            </div>
            <div class="planet-block">
                <h3 class="planet-title"><span class="planet-icon"><i class="fas fa-door-open"></i></span> ${INTERP_DB.Ascendente.titulo}</h3>
                <p class="analysis-text">
                    Seu <span class="highlight">Ascendente em ${SIGNOS[ascIdx]}</span> é o seu método de ação. É através desta lente que você filtra o mundo e é filtrado por ele. ${INTERP_DB.Ascendente.intro}<br><br>
                    <span class="highlight">Vibração Social:</span> ${INTERP_DB.Ascendente.light}
                </p>
            </div>
        `;

        document.getElementById('final-synthesis').innerHTML = `
            <p>A alma de <strong>${nome}</strong> veio ao mundo para integrar a vontade do Sol em <strong>${SIGNOS[sol.sIdx]}</strong> com a sensibilidade da Lua em <strong>${SIGNOS[lua.sIdx]}</strong>, operando através da ferramenta do Ascendente em <strong>${SIGNOS[ascIdx]}</strong>.</p>
            <p>Este mapa revela que você não é um ser fragmentado, mas um complexo sistema de forças buscando harmonia. Sua jornada de 2026 exige que você honre o pilar da sua casa 10 para alcançar o reconhecimento que seu espírito já conhece, mas que sua matéria ainda está lapidando.</p>
        `;

        document.getElementById('loading-screen').style.opacity = '0';
        setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 800);
    }

    auth.onAuthStateChanged(user => {
        if(user) {
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                if(doc.exists) processarMapa(doc.data());
                else window.location.href = "index.html";
            });
        } else window.location.href = "index.html";
    });
</script>
</body>
</html>
