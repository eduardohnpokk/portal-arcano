<!DOCTYPE html>

    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background-color: var(--bg-dark); background-image: url('https://www.transparenttextures.com/patterns/stardust.png'); color: #e0e0e0; font-size: 19px; line-height: 1.8; overflow-x: hidden; }

        .spinner { font-size: 4em; color: var(--gold); animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px 100px 20px; position: relative; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid #222; padding-bottom: 20px; }

        .btn-back:hover { color: var(--gold); }
        .btn-print { background: var(--gold); color: #000; border: none; padding: 10px 25px; border-radius: 4px; font-family: 'Cinzel'; cursor: pointer; font-weight: bold; }

        .page-header { text-align: center; margin-bottom: 50px; }
        .page-title { font-family: 'Cinzel'; color: var(--gold); font-size: 3.2em; margin: 0; text-shadow: 0 0 30px rgba(212,175,55,0.4); letter-spacing: 4px; }
        
        .mandala-box { display: flex; justify-content: center; margin: 60px 0; }
        .mandala-svg { width: 100%; max-width: 550px; filter: drop-shadow(0 0 25px rgba(212,175,55,0.2)); }

        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 60px; }
        .panel { background: rgba(15, 15, 15, 0.95); border: 1px solid #333; border-radius: 8px; overflow: hidden; }
        .panel-header { background: #1a1a1a; padding: 18px; border-bottom: 1px solid var(--gold); font-family: 'Cinzel'; color: var(--gold); text-align: center; letter-spacing: 3px; }
        .row { display: flex; justify-content: space-between; padding: 15px 25px; border-bottom: 1px solid #222; font-size: 0.9em; }

        .deep-analysis { display: flex; flex-direction: column; gap: 50px; }
        .planet-block { background: rgba(20, 20, 20, 0.85); border: 1px solid #333; border-left: 6px solid var(--gold); padding: 45px; border-radius: 4px; }
        .planet-title { font-family: 'Cinzel'; font-size: 2em; color: #fff; margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 15px; }
        
        .analysis-text { text-align: justify; color: #ccc; font-size: 1.15em; line-height: 2; margin-bottom: 20px; }
        .highlight { color: var(--gold); font-weight: bold; }
        
        .house-context { background: rgba(0,0,0,0.4); padding: 25px; border-radius: 4px; border: 1px dashed #444; margin-top: 20px; }
        .house-title { font-family: 'Cinzel'; color: var(--gold); font-size: 0.9em; display: block; margin-bottom: 10px; }

        .synthesis-card { background: radial-gradient(circle, #1a1a1a, #000); border: 2px solid var(--gold); padding: 60px; border-radius: 12px; margin-top: 80px; text-align: center; }

        @media(max-width: 768px) { .data-grid { grid-template-columns: 1fr; } .planet-block { padding: 30px; } }
    </style>
</head>
<body>

<div class="container">

    <header class="page-header">

        <div class="user-details" id="user-header" style="color:#888; font-family:'Cinzel'; margin-top:10px;"></div>
    </header>

    <div class="mandala-box" id="mandala-area"></div>

    <div class="data-grid">
        <div class="panel">
            <div class="panel-header">Posições Celestiais</div>

        </div>
        <div class="panel">
            <div class="panel-header">Domínios do Destino</div>
            <div id="list-houses"></div>

    <h2 style="text-align:center; color:var(--gold); font-family:'Cinzel'; font-size:2.2em; margin-bottom:50px; letter-spacing:3px;">TRADUÇÃO DOS ARQUÉTIPOS</h2>
    <div class="deep-analysis" id="analysis-container"></div>

    <div class="synthesis-card">
        <h2 style="font-family:'Cinzel'; color:var(--gold); font-size:2.5em; margin-bottom:30px;">GRANDE SÍNTESE DA ALMA</h2>
        <div class="analysis-text" id="final-synthesis"></div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    try { firebase.initializeApp(firebaseConfig); } catch(e) {}
    const auth = firebase.auth();
    const db = firebase.firestore();

    const SIGNOS = ["Áries", "Touro", "Gêmeos", "Câncer", "Leão", "Virgem", "Libra", "Escorpião", "Sagitário", "Capricórnio", "Aquário", "Peixes"];
    const GLYPHS = ["♈", "♉", "♊", "♋", "♌", "♍", "♎", "♏", "♐", "♑", "♒", "♓"];
    const PLANET_ICONS = {"Sol":"☉", "Lua":"☽", "Mercúrio":"☿", "Vênus":"♀", "Marte":"♂", "Júpiter":"♃", "Saturno":"♄", "Urano":"♅", "Netuno":"♆", "Plutão":"♇"};

    // BANCO DE DADOS DE ALTA DENSIDADE (RESTAURADO E EXPANDIDO)
    const INTERP_PLANETAS = {
        "Sol": { 
            titulo: "O Propósito Central e a Identidade do Espírito", 
            corpo: "O Sol é o soberano do seu mapa. Ele representa o 'Eu' consciente, a vontade criativa e a jornada do herói que sua alma aceitou trilhar. Ele indica onde você deve buscar reconhecimento e autonomia para se sentir plenamente vivo. É o núcleo atômico que sustenta todos os outros planetas do seu sistema pessoal.",
            conselho: "Honre sua essência sem permitir que o ego obscureça a luz da sua generosidade natural."
        },
        "Lua": { 
            titulo: "O Oceano Emocional e a Memória Ancestral", 
            corpo: "A Lua rege o que é instintivo e inconsciente. Ela descreve sua necessidade de segurança emocional, seu passado, a figura materna e como você reage quando está vulnerável. É o seu 'lar' interno, a base psíquica que nutre suas ações no mundo externo.",
            conselho: "Aprenda a ouvir o silêncio da sua intuição; ela é o mapa para a sua paz interior."
        },
        "Mercúrio": {
            titulo: "O Processador Mental e o Mensageiro",
            corpo: "Rege a inteligência, a fala e a forma como você organiza dados. Mercúrio é a ponte entre sua essência e o mundo. Ele define se sua comunicação é lógica, intuitiva, rápida ou cautelosa.",
            conselho: "Use a palavra como uma ferramenta de construção, nunca de dispersão energética."
        },
        "Vênus": {
            titulo: "O Magnetismo, Valores e a Lei da Atração",
            corpo: "Vênus dita o que você ama e o que você valoriza. Ela é o seu radar para o prazer, a beleza e a harmonia nos relacionamentos. Define sua linguagem afetiva e sua capacidade de atrair recursos materiais.",
            conselho: "A abundância flui quando você reconhece o valor sagrado de quem você é."
        },
        "Marte": {
            titulo: "A Vontade de Ação e a Conquista do Desejo",
            corpo: "O motor da sua afirmação no mundo. Marte é a coragem, o instinto de defesa e a libido. Ele mostra como você luta suas batalhas e onde você coloca sua agressividade construtiva.",
            conselho: "Transforme a força bruta em ação estratégica; o guerreiro sábio não desperdiça energia."
        },
        "Júpiter": {
            titulo: "A Busca por Sentido, Expansão e Fortuna",
            corpo: "O mestre da ética e da abundância. Júpiter expande tudo o que toca. Ele representa sua fé na vida, seus ideais superiores e a capacidade de enxergar o quadro maior das situações.",
            conselho: "A verdadeira sorte nasce da generosidade de espírito e do aprendizado contínuo."
        },
        "Saturno": {
            titulo: "O Senhor do Tempo, Limites e Autoridade",
            corpo: "Saturno é o mestre rigoroso. Onde ele está, há desafio, mas também a promessa de uma obra duradoura. Ele rege a disciplina, o karma e a responsabilidade total sobre o próprio destino.",
            conselho: "O tempo é seu aliado. Construa suas fundações sobre a rocha da integridade."
        }
    };

    const INTERP_CASAS = {
        1: { nome: "Casa da Identidade (Ascendente)", desc: "O 'Eu' em ação. Rege sua persona, seu corpo físico e a primeira impressão que você causa no mundo. É o seu portal de entrada na vida." },
        2: { nome: "Casa dos Recursos e Valores", desc: "A base material. Rege suas finanças, seus talentos produtivos e o que você considera sagrado ou valioso para sua segurança." },
        3: { nome: "Casa da Comunicação e Ambiente", desc: "A mente prática. Rege o intelecto, os irmãos, as pequenas viagens e a forma como você troca informações com o seu entorno." },
        4: { nome: "Casa do Lar e Ancestralidade", desc: "O fundo do céu. Rege suas raízes familiares, o passado, a sua privacidade e a fundação emocional da sua alma." },
        5: { nome: "Casa da Criatividade e Prazer", desc: "A expressão do brilho. Rege os romances, os filhos, a diversão e a capacidade de criar algo único a partir do coração." },
        6: { nome: "Casa do Trabalho e Saúde", desc: "O aperfeiçoamento diário. Rege sua rotina, o serviço aos outros, a saúde física e o cuidado minucioso com os detalhes." },
        7: { nome: "Casa das Parcerias e do Outro", desc: "O espelho social. Rege o casamento, as sociedades comerciais e como você lida com quem está diante de você." },
        8: { nome: "Casa da Transformação e Oculto", desc: "A alquimia da alma. Rege os recursos compartilhados, as crises profundas, a sexualidade e o poder de renascimento das cinzas." },
        9: { nome: "Casa da Expansão e Sabedoria", desc: "A jornada distante. Rege o ensino superior, a filosofia, a religiosidade e as grandes viagens que expandem a consciência." },
        10: { nome: "Casa da Missão e Carreira", desc: "O ápice do céu. Rege sua reputação pública, sua vocação, o sucesso profissional e o legado que você deixará na Terra." },
        11: { nome: "Casa do Coletivo e Projetos", desc: "O plano futuro. Rege as amizades, os grupos sociais, as esperanças e os projetos que beneficiam o bem comum." },
        12: { nome: "Casa do Inconsciente e Resgate", desc: "O encerramento do ciclo. Rege a espiritualidade mística, o isolamento necessário, o karma e a dissolução do ego em algo maior." }
    };

    function processarMapa(usuario) {
        try {
            if (typeof Astronomy === 'undefined') return setTimeout(() => processarMapa(usuario), 300);

            const dNasc = usuario.dataNascimento || "2000-01-01";
            const hNasc = usuario.horaNascimento || "12:00";
            const time = Astronomy.MakeTime(new Date(dNasc + "T" + hNasc));
            const lat = usuario.latitude || -23.55;
            const lon = usuario.longitude || -46.63;
            const obs = new Astronomy.Observer(lat, lon, 0);

            document.getElementById('user-header').innerText = `${usuario.nome.toUpperCase()} • ${dNasc} • ${usuario.cidade || 'São Paulo'}`;

            const planetas = [];
            const corpos = ["Sun", "Moon", "Mercury", "Venus", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune", "Pluto"];
            const nomesPT = {"Sun":"Sol", "Moon":"Lua", "Mercury":"Mercúrio", "Venus":"Vênus", "Mars":"Marte", "Jupiter":"Júpiter", "Saturn":"Saturno", "Uranus":"Urano", "Neptune":"Netuno", "Pluto":"Plutão"};

            corpos.forEach(c => {
                const equ = Astronomy.Equator(c, time, obs, true, true);
                const long = Astronomy.Ecliptic(equ.vec).elon;
                planetas.push({ nome: nomesPT[c], grau: long, sIdx: Math.floor(long / 30) });
            });

            // Ascendente Real
            const sidereal = Astronomy.SiderealTime(time);
            const lst = (sidereal + lon / 15.0) * 15;
            const ramc = lst * Math.PI/180;
            const eps = 23.439 * Math.PI/180;
            let ascRad = Math.atan2(Math.cos(ramc), -Math.sin(ramc)*Math.cos(eps) - Math.tan(lat*Math.PI/180)*Math.sin(eps));
            const ascGrau = (ascRad * 180/Math.PI + 360) % 360;

            // Atribuição de Casas
            planetas.forEach(p => {
                let dist = (p.grau - ascGrau + 360) % 360;
                p.casa = Math.floor(dist / 30) + 1;
            });

            renderizarMapa(planetas, ascGrau);
            renderizarDossie(planetas, ascGrau, usuario.nome);

        } catch (e) { console.error(e); }
    }

    function renderizarMapa(planetas, asc) {
        const cx=250, cy=250, r=220;
        let svg = `<svg viewBox="0 0 500 500" class="mandala-svg">
            <circle cx="${cx}" cy="${cy}" r="${r}" stroke="var(--gold)" stroke-width="2" fill="none" opacity="0.4"/>`;
        
        for(let i=0; i<12; i++) {
            const rad = (i * 30 + 180) * Math.PI / 180;
            svg += `<line x1="${cx}" y1="${cy}" x2="${cx + r * Math.cos(rad)}" y2="${cy + r * Math.sin(rad)}" stroke="#222" stroke-width="1"/>`;
            const textRad = (i * 30 + 15 + 180) * Math.PI / 180;
            svg += `<text x="${cx + r*0.88*Math.cos(textRad)}" y="${cy + r*0.88*Math.sin(textRad)}" text-anchor="middle" dominant-baseline="middle" fill="var(--gold)" font-size="16">${GLYPHS[i]}</text>`;
        }

        planetas.forEach((p, idx) => {
            const posRel = (p.grau - asc + 360) % 360;
            const rad = (posRel + 180) * Math.PI / 180;
            const dist = r * 0.55 - (idx * 5);
            svg += `<text x="${cx + dist*Math.cos(rad)}" y="${cy + dist*Math.sin(rad)}" text-anchor="middle" fill="#fff" font-size="14">${PLANET_ICONS[p.nome]}</text>`;
        });
        svg += `</svg>`;
        document.getElementById('mandala-area').innerHTML = svg;
    }

    function renderizarDossie(planetas, asc, nome) {
        const pList = document.getElementById('list-planets');
        const hList = document.getElementById('list-houses');
        const analysis = document.getElementById('analysis-container');

        pList.innerHTML = planetas.map(p => `<div class="row"><span>${PLANET_ICONS[p.nome]} ${p.nome}</span><span class="highlight">${SIGNOS[p.sIdx]} (${Math.floor(p.grau % 30)}°)</span></div>`).join('');
        
        hList.innerHTML = Array.from({length: 12}, (_, i) => `
            <div class="row"><span>Casa ${i+1}</span><span class="highlight">${SIGNOS[(Math.floor(asc/30) + i) % 12]}</span></div>
        `).join('');

        analysis.innerHTML = planetas.slice(0, 7).map(p => {
            const info = INTERP_PLANETAS[p.nome] || {titulo: p.nome, corpo: "", conselho: ""};
            const hInfo = INTERP_CASAS[p.casa];
            return `
                <div class="planet-block">
                    <h3 class="planet-title">${PLANET_ICONS[p.nome]} ${info.titulo}</h3>
                    <p class="analysis-text">Ao analisarmos o seu nascimento, identificamos o <span class="highlight">${p.nome} em ${SIGNOS[p.sIdx]}</span>. ${info.corpo}</p>
                    <div class="house-context">
                        <span class="house-title">OCORRÊNCIA NA ${hInfo.nome.toUpperCase()}</span>
                        <p class="analysis-text" style="font-size:0.95em; margin:0;">${hInfo.desc} Esta combinação revela que você utiliza a energia de ${SIGNOS[p.sIdx]} especificamente neste cenário da vida.</p>
                    </div>
                    <p class="analysis-text" style="color:var(--gold); font-size:1em; margin-top:20px;"><strong>💡 DIRETRIVZ DE MAESTRIA:</strong> ${info.conselho}</p>
                </div>
            `;
        }).join('');

        document.getElementById('final-synthesis').innerHTML = `<p>O dossiê Master de <strong>${nome}</strong> revela uma estrutura de alma focada em integração. Com o Sol em <strong>${SIGNOS[planetas[0].sIdx]}</strong> e Ascendente em <strong>${SIGNOS[Math.floor(asc/30)]}</strong>, sua jornada em 2026 é um convite para a manifestação material da sua sabedoria interna. Você não é um ser fragmentado; você é um sistema solar completo em evolução.</p>`;

        document.getElementById('loading-screen').style.display = 'none';
    }

    auth.onAuthStateChanged(user => {
        if(user) db.collection("usuarios").doc(user.uid).get().then(doc => processarMapa(doc.data()));
        else window.location.href = "index.html";
    });
</script>
