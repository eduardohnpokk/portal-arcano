<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Transmutação em Curso</title>
    <meta name="description" content="O Portal Arcano está a passar por uma atualização de elite para integrar novas inteligências sistêmicas.">
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; }
        body { 
            margin: 0; 
            font-family: 'Cormorant Garamond', serif; 
            background-color: var(--bg-dark); 
            background-image: url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            color: #e0e0e0; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        body::before { 
            content: ''; 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.75); 
            z-index: -1; 
        }
        .maintenance-box {
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--gold);
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(212,175,55,0.2);
            max-width: 600px;
            width: 90%;
            z-index: 1;
            animation: fadeIn 2s;
        }
        .icon-spin {
            font-size: 3.5em;
            color: var(--gold);
            margin-bottom: 20px;
            animation: pulse 3s infinite alternate;
        }
        h1 { 
            font-family: 'Cinzel', serif; 
            color: var(--gold); 
            font-size: 2.5em; 
            margin: 0 0 20px 0; 
            letter-spacing: 4px; 
            text-shadow: 0 0 20px rgba(212,175,55,0.4); 
        }
        p { 
            font-size: 1.3em; 
            line-height: 1.6; 
            color: #ccc; 
            margin-bottom: 30px; 
        }
        .highlight {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 1.1em;
            letter-spacing: 2px;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 100% { transform: scale(1.05); opacity: 1; } }
    </style>
</head>
<body>

    <div class="maintenance-box">
        <i class="fas fa-gem icon-spin"></i>
        <h1>TEMPLO EM RECESSO</h1>
        <p>O Portal Arcano está a passar por uma transmutação profunda da sua infraestrutura.</p>
        <p>Estamos a integrar o novo motor cognitivo para elevar a precisão do nosso <strong>Oráculo Sagrado</strong> e dos nossos <strong>Dossiês</strong> ao estado de arte.</p>
        <div class="highlight">RETORNAREMOS EM BREVE</div>
    </div>

</body>
</html>
