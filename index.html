<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Alerta de Segurança e Reestruturação</title>
    <meta name="description" content="O Portal Arcano encontra-se temporariamente indisponível para reestruturação de segurança.">
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; --alert-red: #8b0000; }
        body { 
            margin: 0; 
            font-family: 'Cormorant Garamond', serif; 
            background-color: var(--bg-dark); 
            background-image: url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            color: #e0e0e0; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        body::before { 
            content: ''; 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.85); /* Fundo ainda mais escuro para o alerta */
            z-index: -1; 
        }
        .alert-box {
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid var(--alert-red);
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(139, 0, 0, 0.3);
            max-width: 650px;
            width: 90%;
            z-index: 1;
            animation: fadeIn 1.5s;
        }
        .icon-alert {
            font-size: 4em;
            color: var(--alert-red);
            margin-bottom: 25px;
            animation: pulse 2s infinite alternate;
        }
        h1 { 
            font-family: 'Cinzel', serif; 
            color: #fff; 
            font-size: 2.2em; 
            margin: 0 0 20px 0; 
            letter-spacing: 3px; 
            text-transform: uppercase;
        }
        p { 
            font-size: 1.4em; 
            line-height: 1.6; 
            color: #ccc; 
            margin-bottom: 20px; 
        }
        .highlight {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 1.1em;
            letter-spacing: 2px;
            margin-top: 30px;
            display: block;
            border-top: 1px solid #333;
            padding-top: 20px;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 100% { transform: scale(1.05); opacity: 1; } }
    </style>
</head>
<body>

    <div class="alert-box">
        <i class="fas fa-shield-alt icon-alert"></i>
        <h1>COMUNICADO OFICIAL</h1>
        <p>Sofremos uma invasão e nossos arquivos foram danificados.</p>
        <p>O portal ficará algum tempo fora do ar para que possamos reestruturar absolutamente toda a nossa base e entregá-lo ainda melhor para você.</p>
        <span class="highlight">AGRADECEMOS A COMPREENSÃO DOS INICIADOS</span>
    </div>

</body>
</html>
