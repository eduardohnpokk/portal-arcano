<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Dossiê Master 2026</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background: #000; color: #fff; text-align: center; }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 60px; height: 60px; border: 4px solid #111; border-top: 4px solid var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { padding: 100px 20px; }
        .btn-generate { background: var(--gold); color: #000; border: none; padding: 20px 50px; font-family: 'Cinzel'; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 1.2em; }

        /* --- CONFIGURAÇÃO TÉCNICA DO PDF (SISTEMA DE PRECISÃO) --- */
        #pdf-template { 
            background: white; 
            color: black; 
            width: 210mm; 
            position: absolute; 
            left: -10000px; /* Mantém "visível" para o motor mas invisível para o usuário */
            top: 0;
        }
        .page { 
            width: 210mm; 
            height: 296mm; /* Ajuste milimétrico para evitar páginas duplas */
            padding: 25mm 20mm; 
            box-sizing: border-box; 
            page-break-after: always; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
        }
        .pdf-header { font-family: 'Cinzel'; color: #b8860b; border-bottom: 1px solid #ddd; margin-bottom: 15px; font-size: 10pt; text-align: right; }
        .pdf-title { font-family: 'Cinzel'; font-size: 40pt; text-align: center; margin-top: 50mm; }
        .section-title { font-family: 'Cinzel'; color: #b8860b; font-size: 22pt; margin: 20px 0; border-left: 5px solid #b8860b; padding-left: 15px; }
        .text-block { font-size: 12pt; text-align: justify; line-height: 1.7; color: #111; }
        .footer-page { position: absolute; bottom: 15mm; width: 170mm; text-align: center; font-size: 9pt; color: #999; border-top: 1px solid #eee; padding-top: 5px; font-family: 'Cinzel'; }
    </style>
</head>
<body>

<div id="loading-screen">
    <div class="spinner"></div>
    <p style="color:var(--gold); font-family:'Cinzel'; margin-top:20px;">Sincronizando Destino Master...</p>
</div>

<div class="container">
    <h1 style="font-family:'Cinzel'; color:var(--gold);">LIVRO DO DESTINO MASTER</h1>
    <p>Compilação de 62 páginas iniciada.</p>
    <button id="btn-master" class="btn-generate" onclick="gerarDossie()">GERAR PDF AGORA</button>
</div>

<div id="pdf-template">
    <div class="page" style="justify-content: center; align-items: center; text-align: center;">
        <h1 class="pdf-title">PORTAL ARCANO</h1>
        <p style="font-family:'Cinzel'; font-size:1.5em; letter-spacing:5px;">DOSSIÊ DA ALMA 2026</p>
        <div style="margin-top:30mm;">
            <p style="font-family:'Cinzel'; font-size:1.8em;" id="pdf-user-name"></p>
            <p style="color:#666;" id="pdf-user-info"></p>
        </div>
    </div>
    <div id="dynamic-content"></div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let userData = null;

    const SABEDORIA = [
        "A posição astrológica no momento do seu nascimento estabelece um contrato vibracional inquebrável. Em 2026, as estrelas voadoras indicam que sua energia solar está pronta para transmutar desafios em maestria absoluta, exigindo que você ocupe seu lugar de direito na hierarquia do destino.",
        "A numerologia sistêmica do seu nome revela um código de construção. Este ciclo master não permite a mediocridade; cada decisão tomada agora ecoará pelos próximos nove anos. O universo orquestrou este encontro para que você alinhe sua vontade com o propósito maior.",
        "O seu signo no zodíaco oriental, sob a regência deste ciclo, traz uma resiliência de ferro. É o momento de agir com a precisão de um alquimista, separando o que é essência do que é apenas ruído externo, ancorando sua luz de forma prática e próspera no plano físico."
    ];

    async function gerarDossie() {
        const btn = document.getElementById('btn-master');
        btn.disabled = true;
        btn.innerText = "PROCESSANDO PÁGINAS...";

        const contentArea = document.getElementById('dynamic-content');
        contentArea.innerHTML = '';

        document.getElementById('pdf-user-name').innerText = userData.nome.toUpperCase();
        document.getElementById('pdf-user-info').innerText = `${userData.dataNascimento} • ${userData.cidade}`;

        // LOOP DE 61 PÁGINAS + CAPA = 62 PÁGINAS TOTAIS
        for(let i = 1; i <= 61; i++) {
            let section = document.createElement('div');
            section.className = 'page';
            section.innerHTML = `
                <div class="pdf-header">DOSSIÊ MASTER • CAPÍTULO ${i}</div>
                <h2 class="section-title">Análise de Profundidade: Grau ${i}</h2>
                <div class="text-block">
                    <p>${SABEDORIA[i % SABEDORIA.length]}</p>
                    <p>Ao examinarmos o seu portal pessoal, Eduardo, notamos que a sua missão exige uma integração entre a mente analítica e a intuição arcaica. O ano de 2026 será o palco onde essa união gerará frutos tangíveis em sua carreira e vida espiritual.</p>
                    <p>Este capítulo foca na sua capacidade de regeneração. Assim como o fênix, você está em um período de queima de carmas antigos para o surgimento de uma nova autoridade. Não tema o fogo da transformação, pois ele é o único caminho para a verdadeira liberdade sistêmica.</p>
                    <p>A matemática do seu destino aponta para uma convergência de forças no segundo semestre. Esteja atento aos sinais e mantenha sua frequência elevada através dos rituais recomendados nas seções de alquimia deste livro.</p>
                </div>
                <div class="footer-page">Portal Arcano • Página ${i + 1} de 62 • Eduardo Henrique Pokk</div>
            `;
            contentArea.appendChild(section);
        }

        const element = document.getElementById('pdf-template');
        
        const opt = {
            margin: 0,
            filename: `Dossie_MASTER_62_PAGINAS_${userData.nome}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 1.5, useCORS: true, logging: false },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        // EXCUÇÃO DO MOTOR DE PDF
        await html2pdf().set(opt).from(element).save();

        btn.disabled = false;
        btn.innerText = "LIVRO MASTER CONCLUÍDO";
    }

    auth.onAuthStateChanged(user => {
        if(user) {
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                userData = doc.data();
                document.getElementById('loading-screen').style.display = 'none';
            });
        } else { window.location.href = 'index.html'; }
    });
</script>
</body>
</html>
