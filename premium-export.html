<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Gerador do Dossiê Master 2026</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background: #000; color: #fff; }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 80px; height: 80px; border: 4px solid #111; border-top: 4px solid var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 800px; margin: 0 auto; padding: 100px 20px; text-align: center; }
        .export-card { background: rgba(15, 15, 15, 0.95); border: 1px solid var(--gold); padding: 60px; border-radius: 12px; }
        .btn-generate { background: var(--gold); color: #000; border: none; padding: 20px 50px; font-family: 'Cinzel'; font-weight: bold; font-size: 1.2em; border-radius: 4px; cursor: pointer; transition: 0.4s; letter-spacing: 2px; }
        .btn-generate:hover { background: #fff; transform: scale(1.05); }

        /* --- ESTILO DO PDF (ALTA DENSIDADE) --- */
        #pdf-template { background: white; color: black; width: 210mm; display: none; }
        .page { padding: 25mm 20mm; min-height: 297mm; position: relative; page-break-after: always; box-sizing: border-box; }
        .pdf-header { font-family: 'Cinzel'; color: #b8860b; border-bottom: 1px solid #ddd; margin-bottom: 20px; font-size: 0.9em; text-align: right; }
        .pdf-title { font-family: 'Cinzel'; font-size: 4em; text-align: center; margin-top: 60mm; color: #000; }
        .pdf-subtitle { font-family: 'Cinzel'; font-size: 1.2em; text-align: center; color: #666; letter-spacing: 5px; }
        .section-title { font-family: 'Cinzel'; color: #b8860b; font-size: 1.8em; margin-top: 30px; border-bottom: 2px solid #b8860b; display: inline-block; }
        .text-block { font-size: 12pt; text-align: justify; line-height: 1.6; margin: 15px 0; color: #333; }
        .chapter-cover { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; min-height: 250mm; }
        .footer-page { position: absolute; bottom: 15mm; left: 0; width: 100%; text-align: center; font-size: 0.8em; color: #aaa; border-top: 1px solid #eee; padding-top: 5px; }
    </style>
</head>
<body>

<div id="loading-screen">
    <div class="spinner"></div>
    <p style="color:var(--gold); font-family:'Cinzel'; margin-top:25px;">Sincronizando Destino...</p>
</div>

<div class="container">
    <div class="export-card">
        <h1 style="font-family:'Cinzel'; color:#fff;">LIVRO DO DESTINO MASTER</h1>
        <p style="color:#888;">Gerando seu dossiê profundo de autoconhecimento.</p>
        <button id="btn-master" class="btn-generate" onclick="gerarDossie()">GERAR PDF COMPLETO</button>
        <p id="status-text" style="color:var(--gold); margin-top:20px; display:none; font-family:'Cinzel';">Processando 60+ páginas de sabedoria...</p>
    </div>
</div>

<div id="pdf-template">
    <div class="page chapter-cover">
        <h1 class="pdf-title">PORTAL ARCANO</h1>
        <p class="pdf-subtitle">O DOSSIÊ MASTER DA ALMA</p>
        <div style="margin-top:30mm;">
            <p style="font-family:'Cinzel'; font-size:2em;" id="pdf-user-name"></p>
            <p style="color:#666;" id="pdf-user-info"></p>
        </div>
        <div class="footer-page">DOCUMENTO SIGILOSO E PERSONALIZADO</div>
    </div>

    <div id="dynamic-content"></div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let userData = null;

    // Função para criar parágrafos longos interpretativos
    function getInterpretacao(tipo, index) {
        const textos = {
            astrologia: [
                "A posição deste astro no momento do seu primeiro fôlego estabelece um contrato vibracional inquebrável com o cosmos. Esta energia atua como uma bússola invisível, guiando suas decisões mais instintivas e moldando a forma como o mundo percebe sua autoridade sistêmica.",
                "Nesta casa astrológica, o fluxo de energia encontra um campo de manifestação material. É aqui que seus desafios kármicos se transformam em ferramentas de poder, exigindo que você transcenda as limitações impostas pela ancestralidade para assumir seu papel de mestre do próprio destino.",
                "O aspecto formado entre esses pontos celestes cria uma tensão criativa necessária para sua evolução. Não veja os obstáculos como barreiras, mas como degraus alquímicos que refinam sua alma através do fogo da experiência direta e da sabedoria acumulada."
            ],
            numerologia: [
                "A frequência numérica que rege sua jornada em 2026 indica um período de profunda reestruturação das bases. Os números não mentem: você está sendo convocado a alinhar suas ações com o propósito maior que foi desenhado antes mesmo de sua encarnação.",
                "Sua vibração de alma ressoa em uma oitava superior de consciência neste ciclo. Isso significa que a mediocridade não é mais uma opção aceitável. A matemática sagrada exige que você ocupe o espaço que lhe foi destinado por direito de consciência."
            ]
        };
        return textos[tipo][index % textos[tipo].length];
    }

    async function gerarDossie() {
        const btn = document.getElementById('btn-master');
        const status = document.getElementById('status-text');
        btn.disabled = true;
        btn.innerText = "COMPILANDO...";
        status.style.display = "block";

        const contentArea = document.getElementById('dynamic-content');
        contentArea.innerHTML = ''; // Limpa antes de gerar

        document.getElementById('pdf-user-name').innerText = userData.nome.toUpperCase();
        document.getElementById('pdf-user-info').innerText = `${userData.cidade} • ${userData.dataNascimento} • ${userData.horaNascimento}`;

        // LAÇO DE GERAÇÃO PARA ALTA DENSIDADE (SIMULAÇÃO DE 60 PÁGINAS)
        for(let i = 1; i <= 15; i++) {
            let section = document.createElement('div');
            section.className = 'page';
            section.innerHTML = `
                <div class="pdf-header">CAPÍTULO ${i}: ARCANOS E MANIFESTAÇÕES</div>
                <h2 class="section-title">Setor ${i}: Análise de Profundidade</h2>
                <div class="text-block">
                    <p>${getInterpretacao('astrologia', i)}</p>
                    <p>Considerando o seu nascimento em ${userData.cidade}, a curvatura do horizonte no momento exato revela que a sua missão está ligada à transmutação de padrões de escassez em abundância espiritual. Este setor do seu mapa master foca na maestria das relações e na forma como você ancora sua luz no plano físico.</p>
                    <p>${getInterpretacao('astrologia', i+1)}</p>
                    <p>A sabedoria milenar indica que este trânsito, específico para o seu ciclo de 2026, funcionará como um acelerador de resultados. Prepare-se para colher o que foi plantado nos últimos sete anos, pois o universo não perdoa a inércia, mas recompensa generosamente a audácia.</p>
                    <p>${getInterpretacao('numerologia', i)}</p>
                    <p>Ao cruzar os dados da sua Gematria com sua posição solar, o Dossiê Arcano identifica uma oportunidade única de expansão profissional entre os meses de maio e setembro. Mantenha sua frequência elevada e não se deixe distrair por ruídos externos.</p>
                </div>
                <div class="footer-page">Página ${i + 1} • Portal Arcano • Eduardo Henrique Pokk</div>
            `;
            contentArea.appendChild(section);
        }

        const element = document.getElementById('pdf-template');
        element.style.display = "block";

        const opt = {
            margin: 0,
            filename: `Dossie_Master_2026_${userData.nome}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        await html2pdf().set(opt).from(element).save();

        element.style.display = "none";
        btn.disabled = false;
        btn.innerText = "LIVRO GERADO";
        status.innerText = "Dossiê de alta densidade concluído.";
    }

    auth.onAuthStateChanged(user => {
        if(user) {
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                userData = doc.data();
                document.getElementById('loading-screen').style.display = 'none';
            });
        } else { window.location.href = 'index.html'; }
    });
</script>
</body>
</html>
