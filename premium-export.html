<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Dossiê Master 2026</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background: #000; color: #fff; text-align: center; }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 60px; height: 60px; border: 4px solid #111; border-top: 4px solid var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { padding: 100px 20px; }
        .btn-generate { background: var(--gold); color: #000; border: none; padding: 20px 50px; font-family: 'Cinzel'; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 1.2em; transition: 0.3s; }
        .btn-generate:disabled { background: #333; color: #666; cursor: not-allowed; }

        /* --- CONFIGURAÇÃO DE SEGURANÇA PARA RENDERIZAÇÃO --- */
        #pdf-template { 
            background: white; 
            color: black; 
            width: 210mm; 
            position: absolute; 
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.01; /* Quase invisível mas detectável pelo motor */
            pointer-events: none;
        }
        .page { 
            width: 210mm; 
            height: 296.5mm; 
            padding: 30mm 20mm; 
            box-sizing: border-box; 
            page-break-after: always; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
            background: white;
        }
        .pdf-header { font-family: 'Cinzel'; color: #b8860b; border-bottom: 1px solid #ddd; margin-bottom: 15px; font-size: 10pt; text-align: right; }
        .pdf-title { font-family: 'Cinzel'; font-size: 42pt; text-align: center; margin-top: 60mm; color: #000; }
        .section-title { font-family: 'Cinzel'; color: #b8860b; font-size: 20pt; margin: 20px 0; border-left: 6px solid #b8860b; padding-left: 15px; }
        .text-block { font-size: 12.5pt; text-align: justify; line-height: 1.8; color: #111; }
        .footer-page { position: absolute; bottom: 15mm; width: 170mm; text-align: center; font-size: 9pt; color: #aaa; border-top: 1px solid #eee; padding-top: 10px; font-family: 'Cinzel'; }
    </style>
</head>
<body>

<div id="loading-screen">
    <div class="spinner"></div>
    <p style="color:var(--gold); font-family:'Cinzel'; margin-top:20px; letter-spacing:2px;">Sincronizando Destino Master...</p>
</div>

<div class="container">
    <h1 style="font-family:'Cinzel'; color:var(--gold); font-size:2.5em;">LIVRO DO DESTINO MASTER</h1>
    <p style="color:#888;">Geração de 62 páginas de Sabedoria Arcaica.</p>
    <button id="btn-master" class="btn-generate" onclick="gerarDossie()">GERAR PDF (62 PÁGINAS)</button>
    <p id="status-text" style="color:var(--gold); margin-top:20px; font-family:'Cinzel'; display:none;"></p>
</div>

<div id="pdf-template">
    <div class="page" style="justify-content: center; align-items: center; text-align: center;">
        <h1 class="pdf-title">PORTAL ARCANO</h1>
        <p style="font-family:'Cinzel'; font-size:1.6em; letter-spacing:6px; color:#444;">DOSSIÊ MASTER 2026</p>
        <div style="margin-top:40mm; border-top: 2px solid #b8860b; padding-top: 20px;">
            <p style="font-family:'Cinzel'; font-size:2.2em; color:#000;" id="pdf-user-name"></p>
            <p style="color:#666; font-size:1.1em;" id="pdf-user-info"></p>
        </div>
    </div>
    <div id="dynamic-content"></div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    try { firebase.initializeApp(firebaseConfig); } catch(e) {}
    const db = firebase.firestore();
    const auth = firebase.auth();

    let userData = null;

    const FRAGMENTOS = [
        "Sua mandala astral revela que o ano de 2026 será regido pela força da transmutação. O cosmos exige que você abandone velhas estruturas de pensamento para abraçar a nova autoridade que emana do seu Sol interno, garantindo que sua voz seja ouvida nos planos mais elevados.",
        "A numerologia sagrada aplicada ao seu nome indica um período de colheita sistêmica. Não há espaço para hesitação; a matemática divina aponta para um alinhamento perfeito entre sua vontade e a manifestação material, desde que você honre o contrato sagrado firmado ao nascer.",
        "No zodíaco oriental, este ciclo traz a resiliência necessária para vencer batalhas invisíveis. Sua alma está sendo lapidada para suportar a pressão do sucesso, transformando o chumbo das preocupações cotidianas no ouro da sabedoria eterna e inabalável."
    ];

    async function gerarDossie() {
        const btn = document.getElementById('btn-master');
        const status = document.getElementById('status-text');
        
        btn.disabled = true;
        btn.innerText = "MONTANDO PÁGINAS...";
        status.style.display = "block";
        status.innerText = "Construindo estrutura de 62 páginas...";

        const contentArea = document.getElementById('dynamic-content');
        contentArea.innerHTML = '';

        document.getElementById('pdf-user-name').innerText = userData.nome.toUpperCase();
        document.getElementById('pdf-user-info').innerText = `${userData.dataNascimento} • ${userData.cidade}`;

        // MONTAGEM DAS 61 PÁGINAS + CAPA = 62
        for(let i = 1; i <= 61; i++) {
            let section = document.createElement('div');
            section.className = 'page';
            section.innerHTML = `
                <div class="pdf-header">DOSSIÊ ARCANO • MASTER 2026 • CAPÍTULO ${i}</div>
                <h2 class="section-title">Análise de Profundidade: Nível ${i}</h2>
                <div class="text-block">
                    <p>${FRAGMENTOS[i % FRAGMENTOS.length]}</p>
                    <p>Ao cruzarmos as coordenadas de ${userData.cidade} com o seu momento de nascimento, Eduardo, identificamos que sua missão de alma exige uma entrega total à intuição. Este dossiê master serve como o mapa necessário para navegar as águas profundas de 2026.</p>
                    <p>A densidade deste conhecimento é proporcional à sua capacidade de aplicação prática. Cada página deste livro foi desenhada para atuar como um gatilho mental de expansão, removendo as travas kármicas que impediam seu crescimento nos últimos sete anos.</p>
                    <p>A síntese deste capítulo aponta para a maestria do tempo. O universo não tem pressa, mas é implacável com quem desperdiça a oportunidade de evoluir. Use este saber como sua bússola definitiva.</p>
                </div>
                <div class="footer-page">Portal Arcano • Página ${i + 1} de 62 • Iniciado de Elite</div>
            `;
            contentArea.appendChild(section);
        }

        status.innerText = "Aguardando estabilização do motor (Painting)...";
        
        // RIGOR TÉCNICO: Delay de 3 segundos para garantir que o navegador termine de desenhar o HTML
        await new Promise(resolve => setTimeout(resolve, 3000));

        const element = document.getElementById('pdf-template');
        const opt = {
            margin: 0,
            filename: `Dossie_MASTER_62_PAGINAS_${userData.nome}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, logging: false, letterRendering: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        status.innerText = "Capturando imagens e gerando arquivo final...";
        await html2pdf().set(opt).from(element).save();

        btn.disabled = false;
        btn.innerText = "DOWNLOAD CONCLUÍDO";
        status.innerText = "Seu Livro Master de 62 páginas foi gerado com sucesso.";
    }

    auth.onAuthStateChanged(user => {
        if(user) {
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                userData = doc.data();
                document.getElementById('loading-screen').style.display = 'none';
            });
        } else { window.location.href = 'index.html'; }
    });
</script>
</body>
</html>
