<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Dossiê Master 2026</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #d4af37; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background: #000; color: #fff; }
        
        /* Interface do Utilizador */
        .ui-container { padding: 50px; text-align: center; background: #000; min-height: 100vh; }
        .btn-action { background: var(--gold); color: #000; border: none; padding: 20px 40px; font-family: 'Cinzel'; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 1.2em; margin: 10px; }
        .btn-action:disabled { background: #333; color: #666; }

        /* CONFIGURAÇÃO DO LIVRO (VISÍVEL NO ECRÃ PARA O UTILIZADOR CONFERIR) */
        #book-preview { background: #555; padding: 50px 0; display: none; }
        .page { 
            background: white; 
            color: black; 
            width: 210mm; 
            height: 297mm; 
            margin: 0 auto 20px auto; 
            padding: 25mm 20mm; 
            box-sizing: border-box; 
            position: relative; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            text-align: justify;
        }

        /* ESTILOS INTERNOS DO LIVRO */
        .pdf-header { font-family: 'Cinzel'; color: #b8860b; border-bottom: 1px solid #ddd; margin-bottom: 20px; font-size: 10pt; text-align: right; }
        .pdf-title { font-family: 'Cinzel'; font-size: 45pt; text-align: center; margin-top: 60mm; }
        .section-title { font-family: 'Cinzel'; color: #b8860b; font-size: 22pt; margin: 30px 0; border-left: 6px solid #b8860b; padding-left: 15px; }
        .text-block { font-size: 12.5pt; line-height: 1.8; color: #111; }
        .footer-page { position: absolute; bottom: 15mm; left: 20mm; width: 170mm; text-align: center; font-size: 9pt; color: #aaa; border-top: 1px solid #eee; padding-top: 10px; font-family: 'Cinzel'; }

        /* REGRA DE IMPRESSÃO (O QUE VAI PARA O PDF) */
        @media print {
            body { background: white !important; }
            .ui-container, #loading-screen, .btn-action { display: none !important; }
            #book-preview { display: block !important; padding: 0 !important; background: white !important; }
            .page { margin: 0 !important; box-shadow: none !important; page-break-after: always !important; }
        }
    </style>
</head>
<body>

<div class="ui-container" id="ui-main">
    <h1 style="font-family:'Cinzel'; color:var(--gold);">LIVRO DO DESTINO MASTER</h1>
    <p>A promessa de 62 páginas de Sabedoria Arcaica será cumprida agora.</p>
    <button id="btn-prepare" class="btn-action" onclick="prepararLivro()">1. PREPARAR LIVRO</button>
    <button id="btn-print" class="btn-action" onclick="window.print()" disabled>2. DESCARREGAR PDF</button>
    <p id="status" style="color:var(--gold); font-family:'Cinzel'; margin-top:20px;"></p>
</div>

<div id="book-preview">
    <div class="page" style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <h1 class="pdf-title">PORTAL ARCANO</h1>
        <p style="font-family:'Cinzel'; font-size:1.5em; letter-spacing:5px;">DOSSIÊ MASTER 2026</p>
        <div style="margin-top:40mm; border-top:2px solid #b8860b; padding-top:20px; text-align: center;">
            <p style="font-family:'Cinzel'; font-size:2em;" id="user-name">...</p>
            <p style="color:#666;" id="user-info">...</p>
        </div>
    </div>
    <div id="dynamic-pages"></div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let userData = null;

    const TEXTOS = [
        "A análise da sua mandala astral revela um contrato vibracional inquebrável com o cosmos. Em 2026, as estrelas indicam que a sua essência solar está pronta para transmutar desafios em maestria absoluta.",
        "A numerologia sistémica do seu nome revela um código de construção de legado. Este ciclo master não permite a mediocridade; cada decisão tomada agora ecoará pelos próximos nove anos de sua jornada evolutiva.",
        "No zodíaco oriental, este ciclo traz a resiliência de um Dragão de Metal. Sua alma está a ser lapidada para suportar a pressão do sucesso, transformando o chumbo das preocupações no ouro da sabedoria eterna."
    ];

    async function prepararLivro() {
        const btnPrepare = document.getElementById('btn-prepare');
        const btnPrint = document.getElementById('btn-print');
        const status = document.getElementById('status');
        const dynamic = document.getElementById('dynamic-pages');

        status.innerText = "A gerar 61 capítulos de alta densidade...";
        document.getElementById('user-name').innerText = userData.nome.toUpperCase();
        document.getElementById('user-info').innerText = `${userData.dataNascimento} • ${userData.cidade}`;
        
        dynamic.innerHTML = '';

        for(let i = 1; i <= 61; i++) {
            const page = document.createElement('div');
            page.className = 'page';
            page.innerHTML = `
                <div class="pdf-header">DOSSIÊ ARCANO • MASTER 2026 • CAPÍTULO ${i}</div>
                <h2 class="section-title">Sabedoria Oculta: Nível ${i}</h2>
                <div class="text-block">
                    <p>${TEXTOS[i % TEXTOS.length]}</p>
                    <p>Ao examinarmos o seu mapa, Eduardo, notamos que a sua missão exige uma integração total entre a mente analítica e a intuição arcaica. O ano de 2026 será o palco onde essa união gerará frutos tangíveis.</p>
                    <p>A densidade deste conhecimento é proporcional à sua capacidade de aplicação prática. Cada página deste livro foi desenhada para atuar como um gatilho de expansão, removendo as travas kármicas do passado.</p>
                    <p>A matemática do seu destino aponta para uma convergência de forças. Use este saber como sua bússola definitiva para navegar as águas profundas do destino que agora se revela perante si.</p>
                    <p>Nesta etapa do dossiê, focamos na maestria das relações. Sua configuração revela que a abundância espiritual está ligada à forma como ancora sua luz no plano físico, servindo de exemplo para outros iniciados.</p>
                </div>
                <div class="footer-page">Página ${i + 1} de 62 • Iniciado de Elite</div>
            `;
            dynamic.appendChild(page);
        }

        document.getElementById('book-preview').style.display = 'block';
        status.innerText = "Livro preparado! Pode conferir as páginas abaixo e clicar em DESCARREGAR.";
        btnPrint.disabled = false;
        btnPrepare.innerText = "LIVRO PRONTO";
    }

    auth.onAuthStateChanged(user => {
        if(user) {
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                userData = doc.data();
            });
        } else { window.location.href = 'index.html'; }
    });
</script>
</body>
</html>
