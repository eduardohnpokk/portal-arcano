<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Dossiê Master 2026</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background: #000; color: #fff; text-align: center; }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 60px; height: 60px; border: 4px solid #111; border-top: 4px solid var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { padding: 100px 20px; }
        .btn-generate { background: var(--gold); color: #000; border: none; padding: 20px 50px; font-family: 'Cinzel'; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 1.2em; }
        .btn-generate:disabled { background: #333; color: #666; cursor: not-allowed; }

        /* --- CONTENTOR DE RENDERIZAÇÃO BLINDADO --- */
        #pdf-render-area { 
            position: absolute; 
            left: -9999px; 
            top: 0; 
            width: 210mm; 
            background: white; 
            color: black; 
            text-align: left;
        }
        .html2pdf__page-break { page-break-after: always; height: 0; }
        .page-content { 
            width: 210mm; 
            min-height: 296mm; 
            padding: 30mm 20mm; 
            box-sizing: border-box; 
            position: relative; 
            background: white;
        }
        .pdf-header { font-family: 'Cinzel'; color: #b8860b; border-bottom: 1px solid #eee; margin-bottom: 20px; font-size: 10pt; text-align: right; }
        .pdf-title { font-family: 'Cinzel'; font-size: 44pt; text-align: center; margin-top: 60mm; color: #000; }
        .section-title { font-family: 'Cinzel'; color: #b8860b; font-size: 22pt; margin: 30px 0 15px 0; border-left: 5px solid #b8860b; padding-left: 15px; }
        .text-block { font-size: 12.5pt; text-align: justify; line-height: 1.8; color: #111; margin-bottom: 15px; }
        .footer-page { position: absolute; bottom: 15mm; width: 170mm; text-align: center; font-size: 9pt; color: #aaa; border-top: 1px solid #eee; padding-top: 10px; font-family: 'Cinzel'; }
    </style>
</head>
<body>

<div id="loading-screen">
    <div class="spinner"></div>
    <p style="color:var(--gold); font-family:'Cinzel'; margin-top:20px;">A Carregar Dossiê Master...</p>
</div>

<div class="container">
    <h1 style="font-family:'Cinzel'; color:var(--gold); font-size:2.5em;">LIVRO DO DESTINO</h1>
    <p style="color:#888;">Geração garantida de 62 páginas de Sabedoria Arcaica.</p>
    <button id="btn-master" class="btn-generate" onclick="iniciarGeracao()">GERAR LIVRO COMPLETO</button>
    <p id="progress-status" style="color:var(--gold); margin-top:20px; font-family:'Cinzel'; display:none;"></p>
</div>

<div id="pdf-render-area"></div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let userData = null;

    const TEXTOS = [
        "A sua mandala astral revela um contrato vibracional inquebrável. Em 2026, as estrelas voadoras indicam que a sua energia está pronta para transmutar desafios em maestria absoluta, exigindo que ocupe o seu lugar de direito na hierarquia do destino.",
        "A numerologia sistémica do seu nome revela um código de construção. Este ciclo master não permite a mediocridade; cada decisão tomada agora ecoará pelos próximos nove anos. O universo orquestrou este encontro para que alinhe a sua vontade com o propósito maior.",
        "No zodíaco oriental, este ciclo traz a resiliência necessária para vencer batalhas invisíveis. A sua alma está a ser lapidada para suportar a pressão do sucesso, transformando o chumbo das preocupações cotidianas no ouro da sabedoria eterna."
    ];

    async function iniciarGeracao() {
        const btn = document.getElementById('btn-master');
        const status = document.getElementById('progress-status');
        const renderArea = document.getElementById('pdf-render-area');

        btn.disabled = true;
        status.style.display = "block";
        renderArea.innerHTML = '';

        // 1. GERAR CAPA
        renderArea.innerHTML += `
            <div class="page-content">
                <h1 class="pdf-title">PORTAL ARCANO</h1>
                <p style="text-align:center; font-family:'Cinzel'; font-size:1.5em; letter-spacing:5px; color:#666;">DOSSIÊ MASTER 2026</p>
                <div style="margin-top:40mm; text-align:center; border-top:2px solid #b8860b; padding-top:20px;">
                    <p style="font-family:'Cinzel'; font-size:2em;">${userData.nome.toUpperCase()}</p>
                    <p style="color:#666;">${userData.dataNascimento} • ${userData.cidade}</p>
                </div>
                <div class="footer-page">DOCUMENTO EXCLUSIVO</div>
            </div>
            <div class="html2pdf__page-break"></div>
        `;

        // 2. LOOP DE ALTA DENSIDADE (61 PÁGINAS)
        for (let i = 1; i <= 61; i++) {
            status.innerText = `A processar página ${i} de 62...`;
            
            const pContent = `
                <div class="page-content">
                    <div class="pdf-header">CAPÍTULO ${i} • MAESTRIA SISTÉMICA</div>
                    <h2 class="section-title">Análise de Profundidade Nível ${i}</h2>
                    <div class="text-block">
                        <p>${TEXTOS[i % TEXTOS.length]}</p>
                        <p>Ao examinarmos o seu mapa, Eduardo, notamos que a sua missão exige uma integração total entre a mente analítica e a intuição arcaica. O ano de 2026 será o palco onde essa união gerará frutos tangíveis em todas as áreas da sua vida.</p>
                        <p>A sabedoria milenar indica que este trânsito funcionará como um acelerador de resultados. Prepare-se para colher o que foi plantado, pois o universo recompensa generosamente a audácia e a verdade pessoal.</p>
                        <p>Este dossiê master não é apenas informativo; é uma ferramenta iniciática. Use este saber como a sua bússola definitiva para navegar as águas profundas do destino que agora se revela perante si.</p>
                    </div>
                    <div class="footer-page">Página ${i + 1} • Portal Arcano • Eduardo Henrique Pokk</div>
                </div>
                ${i < 61 ? '<div class="html2pdf__page-break"></div>' : ''}
            `;
            
            renderArea.innerHTML += pContent;
            
            // Pausa técnica para o navegador não travar (Event Loop)
            if (i % 10 === 0) await new Promise(r => setTimeout(r, 100));
        }

        status.innerText = "A finalizar renderização... Por favor, aguarde.";
        
        // Delay de segurança final
        await new Promise(r => setTimeout(r, 2000));

        const opt = {
            margin: 0,
            filename: `Dossie_Master_Arcano_${userData.nome}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, letterRendering: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        try {
            await html2pdf().set(opt).from(renderArea).save();
            status.innerText = "Download concluído com sucesso.";
        } catch (err) {
            console.error(err);
            status.innerText = "Erro na geração. Tente novamente.";
        } finally {
            btn.disabled = false;
        }
    }

    auth.onAuthStateChanged(user => {
        if(user) {
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                userData = doc.data();
                document.getElementById('loading-screen').style.display = 'none';
            });
        } else { window.location.href = 'index.html'; }
    });
</script>
</body>
</html>
