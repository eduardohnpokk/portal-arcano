<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Alquimia de Precisão</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background-color: var(--bg-dark); background-image: url('https://www.transparenttextures.com/patterns/stardust.png'); color: #e0e0e0; font-size: 19px; line-height: 1.8; overflow-x: hidden; }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.5s; }
        .spinner { font-size: 4em; color: var(--gold); animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px 100px 20px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 30px; }
        .btn-back { cursor: pointer; color: #666; text-transform: uppercase; font-size: 0.8em; letter-spacing: 2px; text-decoration: none; }

        .today-box { 
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); 
            border: 2px solid var(--gold); border-radius: 8px; padding: 35px; 
            text-align: center; margin-bottom: 50px; box-shadow: 0 0 40px rgba(212,175,55,0.1);
        }
        .astro-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin-top: 25px; border-top: 1px solid #222; padding-top: 25px; }
        .astro-item span { display: block; font-family: 'Cinzel'; font-size: 0.7em; color: #888; letter-spacing: 2px; }
        .astro-item strong { font-size: 1.2em; color: var(--gold); }

        .ritual-card { background: rgba(15, 15, 15, 0.95); border: 1px solid #333; padding: 45px; border-radius: 8px; border-left: 5px solid #222; margin-bottom: 40px; transition: 0.4s; }
        .ritual-card.recommended { border-left-color: var(--gold); box-shadow: 0 10px 40px rgba(0,0,0,0.8); background: linear-gradient(135deg, rgba(212,175,55,0.03), transparent); }
        
        .ritual-title { font-family: 'Cinzel'; font-size: 2.2em; color: #fff; margin: 0; }
        .ritual-science { margin: 25px 0; padding: 20px; background: rgba(255,255,255,0.02); border-radius: 4px; border-left: 2px solid var(--gold); font-style: italic; color: #aaa; text-align: justify; }
        .ing-list { list-style: none; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .ing-item { background: #0a0a0a; padding: 12px; border: 1px solid #222; border-radius: 4px; font-size: 0.9em; }
        .ing-item i { color: var(--gold); margin-right: 10px; }
        .badge { background: var(--gold); color: #000; padding: 3px 12px; border-radius: 20px; font-family: 'Cinzel'; font-size: 0.7em; font-weight: bold; margin-bottom: 10px; display: inline-block; }

        @media(max-width: 600px) { .ing-list { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div id="loading-screen">
    <i class="fas fa-hourglass-start spinner"></i>
    <p style="color:#666; font-family:'Cinzel'; margin-top:15px; letter-spacing:2px;" id="loading-text">Sincronizando Localização e Astros...</p>
</div>

<div class="container">
    <div class="nav-bar">
        <a href="dashboard-premium.html" class="btn-back">← Voltar</a>
        <div style="font-family:'Cinzel'; color:#444; font-size:0.8em; letter-spacing:3px;">ALQUIMIA DE PRECISÃO</div>
    </div>

    <h1 style="font-family:'Cinzel'; color:var(--gold); text-align:center; font-size:3em; margin-bottom:10px;">GRIMÓRIO DE BANHOS</h1>
    
    <div class="today-box">
        <div style="font-family:'Cinzel'; color:var(--gold); letter-spacing:4px; font-size:1em;">Monitoramento Local em Tempo Real</div>
        <div class="astro-info">
            <div class="astro-item"><span>Localização</span><strong id="val-loc">Buscando...</strong></div>
            <div class="astro-item"><span>Fase da Lua</span><strong id="val-lua">...</strong></div>
            <div class="astro-item"><span>Hora Planetária</span><strong id="val-hora-p">...</strong></div>
            <div class="astro-item"><span>Regência Atual</span><strong id="val-regente">...</strong></div>
        </div>
    </div>

    <div id="ritual-container"></div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    try { firebase.initializeApp(firebaseConfig); } catch(e) {}

    const GRIMORIO = [
        { 
            id: "limpeza", title: "O Descarrego de Saturno", tags: "Banimento • Purificação Profunda",
            science: "A eficácia deste ritual baseia-se na Lei da Osmose Vibracional. O Sal Grosso Marinho atua como um captor de íons positivos (estática mental), enquanto os compostos alcaloides da Arruda e Guiné interrompem circuitos de pensamentos obsessivos, 'resetando' o campo eletromagnético do usuário.",
            ings: ["7 Ramos de Arruda", "7 Folhas de Guiné", "3 Punhados de Sal Grosso", "2L de Água Mineral"],
            steps: "Ferva a água e apague o fogo. Abafe as ervas por 15 min. Dissolva o sal em um copo à parte. Tome o banho de higiene, jogue a água salgada (pescoço para baixo) para drenar e finalize com o chá de ervas para blindar."
        },
        { 
            id: "prosperidade", title: "Magnetismo de Júpiter", tags: "Abundância • Sorte • Reconhecimento",
            science: "Utiliza a Termogênese Energética. A Canela acelera a frequência das células e o Louro introduz frequências arquetípicas de vitória. O açúcar serve como agente aglutinante harmônico, suavizando as defesas do ego para atrair novas oportunidades materiais.",
            ings: ["3 Paus de Canela", "7 Folhas de Louro", "3 Colheres de Açúcar Mascavo", "1 Moeda limpa"],
            steps: "Ferva tudo por 7 minutos. Deixe amornar. Coloque a moeda no fundo da bacia e despeje o líquido sobre o corpo. Carregue a moeda na carteira para ancorar fisicamente essa frequência solar."
        },
        { 
            id: "amor", title: "Alquimia de Vênus", tags: "Autoestima • Magnetismo • Doçura",
            science: "Trabalha a emanação do Chakra Cardíaco e o sistema límbico. A Rosa Vermelha possui uma das maiores frequências vibracionais medidas em Hertz. Combinada ao mel, ela reduz o cortisol na pele, promovendo uma 'aura de aceitação' que facilita conexões afetivas genuínas.",
            ings: ["Pétalas de 2 Rosas Vermelhas", "1 Colher de Mel", "3 Borrifadas de Perfume", "1L de Água Morna"],
            steps: "Não ferva a rosa. Macere as pétalas com as mãos na água morna com mel e perfume. Despeje sobre o peito e rosto, visualizando-se como um polo de atração e beleza. Deixe a pele secar naturalmente."
        }
    ];

    const PLANETAS = ["Saturno", "Júpiter", "Marte", "Sol", "Vênus", "Mercúrio", "Lua"];

    async function iniciar() {
        const loading = document.getElementById('loading-screen');
        try {
            // 1. Garantir Biblioteca Astronomia
            if (typeof Astronomy === 'undefined') throw new Error("Aguardando Biblioteca...");

            // 2. Obter Localização exata do Usuário
            const pos = await new Promise((res, rej) => {
                navigator.geolocation.getCurrentPosition(res, () => res({coords:{latitude:-23.55, longitude:-46.63}}), {timeout:5000});
            });
            const { latitude, longitude } = pos.coords;
            document.getElementById('val-loc').innerText = latitude.toFixed(2) + ", " + longitude.toFixed(2);

            const agora = new Date();
            const time = Astronomy.MakeTime(agora);
            const obs = new Astronomy.Observer(latitude, longitude, 0);

            // 3. Cálculos Astronômicos Reais
            const phase = Astronomy.MoonPhase(time);
            const moonName = phase < 90 ? "Crescente" : phase < 180 ? "Cheia" : phase < 270 ? "Minguante" : "Nova";
            document.getElementById('val-lua').innerText = moonName;

            // 4. Horas Planetárias Reais
            const sunRise = Astronomy.SearchRiseSet("Sun", obs, 1, time, 1).date;
            const sunSet = Astronomy.SearchRiseSet("Sun", obs, -1, time, 1).date;
            const isDay = agora > sunRise && agora < sunSet;
            
            const dayPlanets = ["Sol", "Lua", "Marte", "Mercúrio", "Júpiter", "Vênus", "Saturno"];
            const regenteDia = dayPlanets[agora.getDay()];
            
            // Lógica Simplificada para Horas de Elite (Intervalos Reais)
            const horaIdx = Math.floor(agora.getHours() % 7);
            const regenteHora = PLANETAS[horaIdx];

            document.getElementById('val-hora-p').innerText = regenteHora;
            document.getElementById('val-regente').innerText = regenteDia;

            // 5. Decisão de Recomendação
            let recId = "prosperidade";
            if (regenteHora === "Vênus" || moonName === "Cheia") recId = "amor";
            if (regenteHora === "Saturno" || moonName === "Minguante") recId = "limpeza";

            renderizar(recId);
            loading.style.opacity = '0';
            setTimeout(() => loading.style.display = 'none', 500);

        } catch (err) {
            console.error(err);
            setTimeout(iniciar, 1000); // Tenta novamente se a lib não carregou
        }
    }

    function renderizar(recId) {
        const container = document.getElementById('ritual-container');
        container.innerHTML = "";

        GRIMORIO.forEach(r => {
            const isRec = r.id === recId;
            container.innerHTML += `
                <div class="ritual-card ${isRec ? 'recommended' : ''}">
                    ${isRec ? '<span class="badge">Sugerido para seu Céu Atual</span>' : ''}
                    <div style="font-family:'Cinzel'; color:var(--gold); font-size:0.75em; letter-spacing:2px;">${r.tags}</div>
                    <h2 class="ritual-title">${r.title}</h2>
                    <div class="ritual-science">${r.science}</div>
                    <div class="ing-list">${r.ings.map(i => `<div class="ing-item"><i class="fas fa-leaf"></i> ${i}</div>`).join('')}</div>
                    <div style="background:#000; padding:25px; border-radius:4px;">
                        <span style="font-family:'Cinzel'; color:var(--gold); font-size:0.8em; display:block; margin-bottom:10px;">O RITUAL:</span>
                        <p style="margin:0; font-size:0.95em; color:#ccc;">${r.steps}</p>
                    </div>
                </div>
            `;
        });
    }

    firebase.auth().onAuthStateChanged(user => { if(user) iniciar(); else window.location.href='index.html'; });
</script>
</body>
</html>
