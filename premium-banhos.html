<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Arcano | Rituais e Alquimia</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --bg-dark: #050505; }
        body { margin: 0; font-family: 'Cormorant Garamond', serif; background-color: var(--bg-dark); background-image: url('https://www.transparenttextures.com/patterns/stardust.png'); color: #e0e0e0; font-size: 19px; line-height: 1.8; }
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { font-size: 4em; color: var(--gold); animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px 100px 20px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-back { cursor: pointer; color: #666; text-transform: uppercase; font-size: 0.8em; letter-spacing: 2px; text-decoration: none; transition: 0.3s; }
        .btn-back:hover { color: var(--gold); }

        .today-box { background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); border: 2px solid var(--gold); border-radius: 8px; padding: 30px; text-align: center; margin-bottom: 50px; box-shadow: 0 0 40px rgba(212,175,55,0.2); }
        .ritual-card { background: rgba(20, 20, 20, 0.9); border: 1px solid #333; padding: 40px; border-radius: 8px; border-left: 5px solid var(--gold); margin-bottom: 40px; transition: 0.4s; }
        .ritual-card.recommended { border-color: var(--gold); box-shadow: 0 0 30px rgba(212,175,55,0.1); transform: scale(1.02); }
        .ing-list { list-style: none; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .ing-item { background: rgba(212,175,55,0.05); padding: 10px; border: 1px solid #222; border-radius: 4px; font-size: 0.9em; }
        .highlight-gold { color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>

<div id="loading-screen">
    <i class="fas fa-mortar-pestle spinner"></i>
    <p style="color:#666; font-family:'Cinzel'; margin-top:15px; letter-spacing:2px;">Sintonizando Éteres...</p>
</div>

<div class="container">
    <div class="nav-bar">
        <a href="dashboard-premium.html" class="btn-back">← Voltar ao Hub</a>
        <div style="font-family:'Cinzel'; color:#444;">ALQUIMIA BOTÂNICA</div>
    </div>

    <h1 style="font-family:'Cinzel'; color:var(--gold); text-align:center; font-size:2.8em;">GRIMÓRIO DE RITUAIS</h1>
    
    <div class="today-box">
        <div style="font-family:'Cinzel'; color:#888; letter-spacing:3px; font-size:0.8em; margin-bottom:10px;">Monitoramento Celeste em Tempo Real</div>
        <div id="astro-display" style="font-size:1.4em; color:#fff;">Calculando...</div>
        <div id="rec-display" style="color:var(--gold); font-weight:bold; margin-top:10px;">Aguardando alinhamento...</div>
    </div>

    <div id="ritual-list">
        </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDMeLgPB2wroI-papk-T9R_mbCcj3MC2TE", authDomain: "portal-mistico-6532b.firebaseapp.com", projectId: "portal-mistico-6532b", storageBucket: "portal-mistico-6532b.firebasestorage.app", messagingSenderId: "925159229004", appId: "1:925159229004:web:5d9dc758474789085016e9" };
    try { firebase.initializeApp(firebaseConfig); } catch(e) {}

    const RITUAIS = [
        { id: "limpeza", title: "O Descarrego Maior", tags: "Limpeza • Corte de Inveja", planets: [6, 1], science: "O Sal Grosso neutraliza íons positivos (estática áurica), enquanto a Arruda age como 'antibiótico astral' contra formas-pensamento parasitárias.", ings: ["7 Ramos de Arruda", "7 Folhas de Guiné", "3 Punhados de Sal Grosso", "2L de Água"], steps: "Dissolva o sal primeiro e jogue do pescoço para baixo. Finalize com as ervas maceradas na água morna." },
        { id: "prosperidade", title: "Caminhos Dourados", tags: "Abundância • Sucesso", planets: [0, 4], science: "A Canela acelera a frequência vibracional (fogo). O Louro é o arquétipo da vitória solar. O açúcar harmoniza o campo magnético para atração de recursos.", ings: ["3 Paus de Canela", "3 Folhas de Louro", "3 Chaves (talismãs)", "1L de Água"], steps: "Ferva os ingredientes por 7 min. Use na casa (chão da entrada) ou no corpo para magnetizar oportunidades." },
        { id: "amor", title: "Banho de Vênus", tags: "Magnetismo • Autoamor", planets: [5, 4], science: "Trabalha a emanação do chakra cardíaco. A Rosa Vermelha vibra na frequência da paixão, enquanto o mel suaviza a resistência inconsciente ao prazer.", ings: ["Pétalas de 1 Rosa", "1 Colher de Mel", "3 Borrifadas de Perfume", "Água Morna"], steps: "Não ferva a rosa. Macere as pétalas com mel na água morna e deixe o líquido escorrer suavemente sobre o peito." }
    ];

    function calcularEletiva() {
        const agora = new Date();
        const time = Astronomy.MakeTime(agora);
        const phase = Astronomy.MoonPhase(time);
        const illum = Astronomy.MoonIllumination(time) * 100;
        const diaSemana = agora.getDay(); 

        let luaNome = phase < 90 ? "Crescente" : phase < 180 ? "Cheia" : phase < 270 ? "Minguante" : "Nova";
        document.getElementById('astro-display').innerHTML = `Lua ${luaNome} (${illum.toFixed(1)}% iluminada) | Dia de Regência: ${getPlanetaDia(diaSemana)}`;

        renderRituais(diaSemana, luaNome);
    }

    function getPlanetaDia(d) {
        return ["Sol (Domingo)", "Lua (Segunda)", "Marte (Terça)", "Mercúrio (Quarta)", "Júpiter (Quinta)", "Vênus (Sexta)", "Saturno (Sábado)"][d];
    }

    function renderRituais(dia, lua) {
        const area = document.getElementById('ritual-list');
        area.innerHTML = "";
        
        let recId = (dia === 5) ? "amor" : (dia === 4 || dia === 0) ? "prosperidade" : (dia === 6 || lua === "Minguante") ? "limpeza" : "prosperidade";
        document.getElementById('rec-display').innerText = "Ritual Recomendado: " + RITUAIS.find(r => r.id === recId).title;

        RITUAIS.forEach(r => {
            const isRec = r.id === recId;
            area.innerHTML += `
                <div class="ritual-card ${isRec ? 'recommended' : ''}">
                    <div style="font-family:'Cinzel'; color:var(--gold); font-size:0.8em; margin-bottom:5px;">${r.tags}</div>
                    <h2 style="font-family:'Cinzel'; margin:0; font-size:1.8em; color:#fff;">${r.title}</h2>
                    <p style="font-size:0.95em; color:#aaa; margin:15px 0;">${r.science}</p>
                    <div class="highlight-gold" style="font-size:0.8em; margin-bottom:10px;">INGREDIENTES ESSENCIAIS:</div>
                    <div class="ing-list">${r.ings.map(i => `<div class="ing-item"><i class="fas fa-check"></i> ${i}</div>`).join('')}</div>
                    <div class="highlight-gold" style="font-size:0.8em; margin-bottom:10px;">EXECUÇÃO DO RITUAL:</div>
                    <div style="color:#ccc; font-size:0.9em;">${r.steps}</div>
                </div>
            `;
        });
        document.getElementById('loading-screen').style.display = 'none';
    }

    calcularEletiva();
</script>
</body>
</html>
